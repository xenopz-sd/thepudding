# Task 5.5 fixture inventory (spec: svc-07-secrets-manager).
#
# A single local connection — the openbao_install check-mode idempotency test
# runs the role against localhost with `connection: local`, so no SSH, no remote
# host, and no Proxmox/LXC is required. This keeps the test OFFLINE and
# deterministic (documentation-testing steering: no live infra => runs offline
# or skips cleanly, never a requires_infra dependency).
[local]
localhost ansible_connection=local
