# Task 9.2 fixture inventory (spec: svc-07-secrets-manager).
#
# A single local connection — the openbao_project_onboard idempotency test runs
# the role against localhost with `connection: local`. The role reaches the live
# throwaway OpenBao via the `docker` CLI (`docker exec` against the primary
# container), not via SSH, so no remote host is needed here. The test is
# `requires_infra`-gated (it needs a live OpenBao + docker), NOT offline — see
# the runner's module docstring.
[local]
localhost ansible_connection=local
