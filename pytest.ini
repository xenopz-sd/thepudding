[pytest]
# Root pytest configuration for the Developer Services Platform test suite.
#
# WHY THIS FILE EXISTS — offline-by-construction live-test separation
# -------------------------------------------------------------------
# The live / requires-infra test classes (full ephemeral apply, destroy
# isolation, missing-SDN.Allocate negative auth, live applier-commit failure)
# are gated by class-level `@pytest.mark.skipif(<gate_reason> is not None, ...)`
# checks on the PROXMOX_* env vars. Those skipif gates give informative skip
# reasons — but when an operator has a live-test `.env` loaded in the ambient
# shell, the gate reason is None (creds present), so skipif is FALSE and those
# tests RUN. That silently turns the documented "offline" pytest command into a
# LIVE run: it hangs on unroutable endpoints, or worse, hits a real cluster.
#
# `addopts = -m "not requires_infra"` below makes the offline command offline
# BY CONSTRUCTION: the requires_infra-marked live tests are DESELECTED by
# default, regardless of ambient shell environment. Running the live tier is an
# explicit opt-in (`-m requires_infra`, which overrides this default). The
# existing skipif gates are kept ALONGSIDE the marker so that, once a user opts
# into the live tier, skip-vs-run is still governed by actual credential
# presence with an informative skip reason.
#
# `requires_terraform` is registered too so the shared skipif-idiom name is a
# known marker and never triggers an "unregistered marker" warning.
markers =
    requires_infra: test needs a live Proxmox SDN cluster + credentials (see TESTING.md); deselected by default.
    requires_terraform: test needs a terraform/tofu binary on PATH; skipped (not deselected) when absent.

# Deselect the live tier by default so the canonical offline command is safe
# even with a live-test .env loaded. Opt into the live tier with `-m requires_infra`.
addopts = -m "not requires_infra"
