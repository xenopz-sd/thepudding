# Repository-root Ansible configuration.
#
# Sole purpose today: put this repo's `ansible/roles/` directory on the role
# search path so playbooks that reference a role by name — notably the `common`
# role's offline dry-run smoke test at ansible/roles/common/tests/test.yml (spec
# lxc-docker-base-template, task 4.2, requirement 7.2) — resolve `- role: common`
# regardless of the directory a tool is invoked from. Both `ansible-playbook` and
# `ansible-lint` honor this file when run from the repo root, so the offline lint
# gate (`ansible-lint ansible/roles/common/`) and the dry-run both find the role
# without a per-invocation ANSIBLE_ROLES_PATH.
#
# Symlinks (the classic `tests/roles/<name>` role-test skeleton) are not usable
# on this working tree's filesystem, so a search-path entry is used instead.
[defaults]
roles_path = ansible/roles
