---
# svc-17-18-bootstrap.yml — SVC-17/18 (Observability: Prometheus + Grafana + Loki)
# Automated Service Installer.
# Spec: .kiro/specs/svc-17-18-observability/ (requirements.md, design.md, tasks.md).
#
# THIN ORCHESTRATOR: a Day-0 orchestrator that drives five focused roles, each
# behind its own per-phase block/rescue that preserves a phase-named `fail`
# diagnostic:
#   * obs_clean_slate — the destructive reset branch (clean_slate | bool),
#                       across ALL THREE Terraform-managed guests.
#   * obs_preflight   — Phase 1: env resolve/validate, Proxmox reachability/
#                       auth, VLAN-20 p20 bridge, datastore autodetect, SSH-key
#                       injection, promtool presence, agent-live throwaway-guard
#                       consult.
#   * obs_provision   — Phase 2: backend swap-gate, terraform init/apply (three
#                       guests), generate_inventory.py, add_host, known_hosts.
#   * obs_bootstrap   — Phase 3: common baseline + observability_stack per guest
#                       + fleet exporter roles + scrape-target render + OpenBao
#                       secret reads.
#   * obs_handoff     — Phase 4: svc-17-18-health.yml child gate + completion
#                       banner (three guests, four built-service up==1 check).
# The role internals hold the tasks; this play only sequences and phase-names.
#
# DUAL ROLE OF ANSIBLE (integration-boundaries.md §4): this play runs as the
# Day-0 Workflow ORCHESTRATOR on hosts: localhost. Its roles drive Terraform,
# generate_inventory.py, and child ansible-playbook runs of the CONFIGURATOR
# plays (common.yml, observability.yml, svc-17-18-health.yml) against the three
# VLAN-20 guests. It never parses .tfstate or queries Proxmox for host discovery.
#
# Developer B entry point (service-installer.md §2):
#   ~/venv/devinfra/bin/ansible-playbook \
#     -i ansible/inventory/localhost.yml \
#     ansible/playbooks/svc-17-18-bootstrap.yml \
#     -e cluster_env_file=cluster.dev.env
#
# Clean-slate reset:
#   ~/venv/devinfra/bin/ansible-playbook \
#     -i ansible/inventory/localhost.yml \
#     ansible/playbooks/svc-17-18-bootstrap.yml \
#     -e clean_slate=true -e clean_slate_confirm=force
- name: SVC-17/18 (Observability) automated installer — Day-0 orchestrator
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true
  vars:
    # --- PlayLevelVars — cross-phase constants only (phase-specific vars live
    #     in each obs_* role's defaults/main.yml). ---

    # The gitignored KEY=VALUE .env the installer reads Proxmox/provider
    # parameters from. Overridable with -e cluster_env_file=...
    cluster_env_file: cluster.env
    # Repository root (two levels up from .../ansible/playbooks/).
    obs_repo_root: "{{ playbook_dir | dirname | dirname }}"
    # Project venv python (dev-workflow.md invocation rule).
    obs_venv_python: "{{ ansible_env.HOME }}/venv/devinfra/bin/python"
    # The generated inventory path (repo-relative), written by provision and
    # consumed by bootstrap's + handoff's child ansible-playbook runs as `-i`.
    obs_generated_inventory: ansible/inventory/svc-17-18-observability.generated.yml
    # Fixed SVC-17/18 guest VMIDs (the installer assigns these, not operator-
    # supplied). Read by provision (apply -var) and referenced across phases.
    # Chosen non-colliding with every existing service root: SVC-07 uses
    # 1070/1071, SVC-09 uses 1090, SVC-06 uses 1103, SVC-01 uses 1101 (per-
    # project). 1170/1171/1180 are unused.
    obs_prometheus_vmid: 1170
    obs_grafana_vmid: 1171
    obs_loki_vmid: 1180
    # The three SVC-17/18 guest IPs, computed by NET-00 (cidrhost 10.0.20.0/24,
    # host_index 8/9/10 -> +18/+19/+20). Non-secret; read by provision
    # (known_hosts) and handoff.
    obs_guest_ips:
      - "10.0.20.18"
      - "10.0.20.19"
      - "10.0.20.20"
    # Clean-slate reset controls (off by default).
    clean_slate: false
    clean_slate_confirm: ""
    # Platform domain for the Grafana Traefik Host() rule + dashboard URL banner.
    # observability_platform_domain is the handoff/banner name; platform_domain
    # is the generic alias the configurator roles also read.
    observability_platform_domain: platform.example.test
    platform_domain: "{{ observability_platform_domain }}"
    # --- Mock stand-in flags (mock-stand-ins.md) — DEFAULT OFF/deferred,
    #     bridged to the observability.yml child run by obs_bootstrap. Opt in
    #     with -e for a CA-less / OIDC-less / GPU-less Day-0 bring-up. ---
    grafana_oidc_enabled: false
    obs_tls_self_signed: false
    obs_tls_real_ca_available: false
    dcgm_metrics_deferred: true
    # Agent Live-Test Authorization: truthy ONLY when AGENT_LIVE_AUTHORIZED is set
    # (non-empty) in the process environment. Gates the throwaway-guard consult in
    # obs_preflight and obs_clean_slate. Read from the ENVIRONMENT, never a
    # committed default.
    agent_live_run: "{{ (lookup('ansible.builtin.env', 'AGENT_LIVE_AUTHORIZED', default='') | trim) | length > 0 }}"
    # Throwaway-cluster guard + allowlist paths (repo-relative), read by both the
    # preflight and clean_slate guard consults.
    obs_throwaway_guard: scripts/installer/throwaway_guard.py
    obs_throwaway_allowlist: scripts/installer/throwaway-clusters.yml
    # --- OpenBao wiring passthrough (FR-15) — bridged to the grafana.yml child
    #     run by obs_bootstrap for the delegated bao-CLI secret reads. The
    #     OPENBAO_ADMIN_TOKEN itself is NEVER a var here; it is read from the
    #     process ENV in obs_bootstrap and bridged in the child ENV (no_log).
    #     obs_openbao_addr empty => dev/offline: secret reads skipped. ---
    obs_openbao_addr: ""
    obs_openbao_cli_host: "10.0.20.10"

  tasks:
    # === Clean-Slate branch — runs ONLY when clean_slate is truthy. ===
    - name: Clean-Slate reset
      when: clean_slate | default(false) | bool
      block:
        - name: "Clean-Slate | Run the obs_clean_slate role"
          ansible.builtin.import_role:
            name: obs_clean_slate
      rescue:
        - name: Report Clean-Slate reset failure and exit non-zero
          ansible.builtin.fail:
            msg: >-
              SVC-17/18 installer FAILED during the Clean-Slate reset:
              {{ ansible_failed_task.name | default('unknown step') }}
              — {{ ansible_failed_result.msg | default('see the failing task above') }}

    # === Normal install path — Phases 1→4, skipped entirely on clean_slate. ===

    - name: "Phase 1 — Preflight & environment validation"
      when: not (clean_slate | default(false) | bool)
      block:
        - name: "Preflight | Run the obs_preflight role"
          ansible.builtin.import_role:
            name: obs_preflight
      rescue:
        - name: Report Phase 1 (Preflight) failure and exit non-zero
          ansible.builtin.fail:
            msg: >-
              SVC-17/18 installer FAILED in Phase 1 (Preflight & environment validation):
              {{ ansible_failed_task.name | default('unknown step') }}
              — {{ ansible_failed_result.msg | default('see the failing task above') }}

    - name: "Phase 2 — Infrastructure provisioning"
      when: not (clean_slate | default(false) | bool)
      block:
        - name: "Provisioning | Run the obs_provision role"
          ansible.builtin.import_role:
            name: obs_provision
      rescue:
        - name: Report Phase 2 (Provisioning) failure and exit non-zero
          ansible.builtin.fail:
            msg: >-
              SVC-17/18 installer FAILED in Phase 2 (Infrastructure provisioning):
              {{ ansible_failed_task.name | default('unknown step') }}
              — {{ ansible_failed_result.msg | default('see the failing task above') }}

    - name: "Phase 3 — Host hardening & service bootstrap"
      when: not (clean_slate | default(false) | bool)
      block:
        - name: "Bootstrap | Run the obs_bootstrap role"
          ansible.builtin.import_role:
            name: obs_bootstrap
      rescue:
        - name: Report Phase 3 (Bootstrap) failure and exit non-zero
          ansible.builtin.fail:
            msg: >-
              SVC-17/18 installer FAILED in Phase 3 (Host hardening & service bootstrap):
              {{ ansible_failed_task.name | default('unknown step') }}
              — {{ ansible_failed_result.msg | default('see the failing task above') }}

    - name: "Phase 4 — Health sanity & Developer B handoff"
      when: not (clean_slate | default(false) | bool)
      block:
        - name: "Handoff | Run the obs_handoff role"
          ansible.builtin.import_role:
            name: obs_handoff
      rescue:
        - name: Report Phase 4 (Handoff) failure and exit non-zero
          ansible.builtin.fail:
            msg: >-
              SVC-17/18 installer FAILED in Phase 4 (Health sanity & handoff):
              {{ ansible_failed_task.name | default('unknown step') }}
              — {{ ansible_failed_result.msg | default('see the failing task above') }}
