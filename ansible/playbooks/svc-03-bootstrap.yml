---
# SVC-03 Object Storage (Garage) automated installer — Day-0 orchestrator.
# Spec: .kiro/specs/svc-03-object-storage. Single approved entry point
# (service-installer.md §2): Ansible only.
#
#   ~/venv/devinfra/bin/ansible-playbook \
#     -i ansible/inventory/localhost.yml \
#     ansible/playbooks/svc-03-bootstrap.yml \
#     -e cluster_env_file=cluster.dev.env
#
# Four phases (preflight -> provision -> bootstrap -> handoff) as thin
# block/rescue-wrapped import_role calls; no task logic here. Clean-slate reset
# (DESTROYS all object data):
#     -e clean_slate=true -e clean_slate_confirm=force -e svc03_proxmox_host=<proxmox-lan-ip>
# Requires SVC-07 (OpenBao, cluster secrets) and SVC-09 (Traefik, S3 route).
- name: SVC-03 Object Storage (Garage) automated installer — Day-0 orchestrator
  hosts: localhost
  connection: local
  gather_facts: true
  any_errors_fatal: true
  vars:
    # The gitignored KEY=VALUE .env the installer reads Proxmox/provider params from.
    cluster_env_file: cluster.env
    svc03_repo_root: "{{ playbook_dir | dirname | dirname }}"
    svc03_venv_python: "{{ ansible_env.HOME }}/venv/devinfra/bin/python"
    # Generated inventory path (repo-relative), written by provision, consumed by
    # the bootstrap + handoff child runs as `-i`.
    svc03_generated_inventory: ansible/inventory/svc-03-object-storage.generated.yml
    # Deterministic VMIDs = vlan_id * 1000 + host_index (ADR-0022), ledger indices
    # 12/13/14. Passed to Terraform as explicit overrides (equal to the computed
    # values, so no drift) and used by the clean-slate. Non-secret.
    svc03_vmids: [20012, 20013, 20014]
    # cidrhost("10.0.20.0/24", 10 + 12/13/14), in node order.
    svc03_guest_ips:
      - "10.0.20.22"
      - "10.0.20.23"
      - "10.0.20.24"
    # Size in GB of each node's dedicated data volume (Terraform garage_data_disk_gb);
    # the layout assigns 80 % of it as node capacity.
    svc03_data_disk_gb: 20
    clean_slate: false
    clean_slate_confirm: ""
    # Platform domain for the S3 Host() rule (s3.<domain>).
    svc03_platform_domain: platform.example.test
    # Write the S3 Route_Fragment onto the Traefik guest (R5). Set false only when
    # Traefik is deliberately absent; direct VLAN-20 S3 access still works.
    svc03_traefik_route_enabled: true
    # Agent Live-Test Authorization: truthy ONLY when AGENT_LIVE_AUTHORIZED is set
    # in the process environment; gates the throwaway-guard consult.
    agent_live_run: "{{ (lookup('ansible.builtin.env', 'AGENT_LIVE_AUTHORIZED', default='') | trim) | length > 0 }}"
    svc03_throwaway_guard: scripts/installer/throwaway_guard.py
    svc03_throwaway_allowlist: scripts/installer/throwaway-clusters.yml
  tasks:
    # PLATFORM_DOMAIN in the cluster env file is the default platform domain
    # (SVC-10 design D5); an explicit -e still wins. Runs first, also on clean-slate.
    - name: Resolve PLATFORM_DOMAIN from the cluster env file
      ansible.builtin.import_role:
        name: platform_domain
      vars:
        platform_domain_var: svc03_platform_domain
    # === Clean-Slate branch — runs ONLY when clean_slate is truthy. ===
    - name: Clean-Slate reset
      when: clean_slate | default(false) | bool
      block:
        - name: "Clean-Slate | Run the svc03_clean_slate role"
          ansible.builtin.import_role:
            name: svc03_clean_slate
      rescue:
        - name: Report Clean-Slate reset failure and exit non-zero
          ansible.builtin.fail:
            msg: >-
              SVC-03 Garage installer FAILED during the Clean-Slate reset:
              {{ ansible_failed_task.name | default('unknown step') }}
              — {{ ansible_failed_result.msg | default('see the failing task above') }}

    # === Normal install path — Phases 1→4, skipped entirely on clean_slate. ===
    - name: "Phase 1 — Preflight & environment validation"
      when: not (clean_slate | default(false) | bool)
      block:
        - name: "Preflight | Run the svc03_preflight role"
          ansible.builtin.import_role:
            name: svc03_preflight
      rescue:
        - name: Report Phase 1 (Preflight) failure and exit non-zero
          ansible.builtin.fail:
            msg: >-
              SVC-03 Garage installer FAILED in Phase 1 (Preflight & environment validation):
              {{ ansible_failed_task.name | default('unknown step') }}
              — {{ ansible_failed_result.msg | default('see the failing task above') }}

    - name: "Phase 2 — Infrastructure provisioning"
      when: not (clean_slate | default(false) | bool)
      block:
        - name: "Provisioning | Run the svc03_provision role"
          ansible.builtin.import_role:
            name: svc03_provision
      rescue:
        - name: Report Phase 2 (Provisioning) failure and exit non-zero
          ansible.builtin.fail:
            msg: >-
              SVC-03 Garage installer FAILED in Phase 2 (Infrastructure provisioning):
              {{ ansible_failed_task.name | default('unknown step') }}
              — {{ ansible_failed_result.msg | default('see the failing task above') }}

    - name: "Phase 3 — Host hardening & service bootstrap"
      when: not (clean_slate | default(false) | bool)
      block:
        - name: "Bootstrap | Run the svc03_bootstrap role"
          ansible.builtin.import_role:
            name: svc03_bootstrap
      rescue:
        - name: Report Phase 3 (Bootstrap) failure and exit non-zero
          ansible.builtin.fail:
            msg: >-
              SVC-03 Garage installer FAILED in Phase 3 (Host hardening & service bootstrap):
              {{ ansible_failed_task.name | default('unknown step') }}
              — {{ ansible_failed_result.msg | default('see the failing task above') }}

    - name: "Phase 4 — Health sanity & Developer B handoff"
      when: not (clean_slate | default(false) | bool)
      block:
        - name: "Handoff | Run the svc03_handoff role"
          ansible.builtin.import_role:
            name: svc03_handoff
      rescue:
        - name: Report Phase 4 (Handoff) failure and exit non-zero
          ansible.builtin.fail:
            msg: >-
              SVC-03 Garage installer FAILED in Phase 4 (Health sanity & handoff):
              {{ ansible_failed_task.name | default('unknown step') }}
              — {{ ansible_failed_result.msg | default('see the failing task above') }}
