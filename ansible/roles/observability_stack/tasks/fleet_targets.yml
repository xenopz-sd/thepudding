---
# tasks/fleet_targets.yml — observability_stack (SVC-17/18, WS-C58)
#
# One file_sd target file per guest for the `node` (node_exporter) and `cadvisor` jobs, generated from the merged
# generated inventories (integration-boundaries §4: inventory only, no tfstate, no Proxmox). Files for guests that
# are no longer in any inventory are removed, so a torn-down guest stops being scraped. Non-secret.
- name: "Observability (fleet) | Compute the fleet guest list (every inventory host with an address)"
  ansible.builtin.set_fact:
    _obs_fleet_hosts: >-
      {{ groups['all'] | map('extract', hostvars) | selectattr('ansible_host', 'defined')
         | map(attribute='inventory_hostname') | unique | sort | list }}
- name: "Observability (fleet) | Render node and cAdvisor target files per guest"
  ansible.builtin.copy:
    dest: "{{ observability_prometheus_targets_dir }}/{{ item.0 }}-{{ item.1 }}.yaml"
    content: |
      # GENERATED BY ANSIBLE (observability_stack / fleet_targets.yml, WS-C58) — DO NOT EDIT BY HAND.
      ---
      - targets: ["{{ hostvars[item.1].ansible_host }}:{{ observability_fleet_ports[item.0] }}"]
        labels:
          host: "{{ item.1 }}"
          project: "{{ 'shared' if ('shared' in hostvars[item.1].group_names)
                       else ((hostvars[item.1].group_names | intersect(_obs_project_slugs) | sort | first)
                             | default('shared', true)) }}"
          service: "{{ item.0 | replace('node', 'node-exporter') }}"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ ['node', 'cadvisor'] | product(_obs_fleet_hosts) | list }}"
  loop_control:
    label: "{{ item.0 }}-{{ item.1 }}"
  vars:
    # Project label: `shared` for shared-service guests, else the host's group that is a registered project slug
    # (infra/platform-foundation/projects.yaml, the VLAN-ID authority). Deterministic across runs (WS-C58).
    _obs_project_slugs: >-
      {{ (lookup('ansible.builtin.file', observability_projects_registry) | from_yaml).projects
         | map(attribute='slug') | list }}
  notify: Restart prometheus
- name: "Observability (fleet) | Find existing fleet target files"
  ansible.builtin.find:
    paths: "{{ observability_prometheus_targets_dir }}"
    patterns: ["node-*.yaml", "cadvisor-*.yaml"]
    file_type: file
  register: _obs_fleet_existing
- name: "Observability (fleet) | Remove target files of guests no longer in any inventory"
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ _obs_fleet_existing.files | default([]) }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: >-
    (item.path | basename | regex_replace('^(node|cadvisor)-(.*)\\.yaml$', '\\2')) not in _obs_fleet_hosts
  notify: Restart prometheus
