---
# tasks/main.yml — svc06_clean_slate (SVC-06 installer — clean-slate branch)
#
# Clone of svc01_clean_slate, EXTENDED to tear down BOTH the ZITADEL guest AND
# the backing SVC-01 DB (design.md §3.5). Order: agent-live guard consult FIRST
# (gated), confirmation gate, independent node-name resolve, then:
#   A. tear down the ZITADEL guest (terraform_clean_slate, single target);
#   B. orchestrate the SVC-01 backing-DB clean-slate as a CHILD svc-01-bootstrap
#      run (-e clean_slate=true), so each service's own clean-slate contract
#      owns its state (not reached across a state boundary);
# then an empty-baseline verify over BOTH guests.

- name: "Clean-Slate | Consult the throwaway-cluster authorization guard (Agent_Live_Run only)"
  ansible.builtin.command:
    argv:
      - "{{ svc06_venv_python }}"
      - "{{ svc06_throwaway_guard }}"
      - --service
      - svc06
      - --env-file
      - "{{ cluster_env_file }}"
      - --allowlist
      - "{{ svc06_throwaway_allowlist }}"
  args:
    chdir: "{{ svc06_repo_root }}"
  register: svc06_throwaway_decision
  changed_when: false
  failed_when: false
  when: agent_live_run | default(false) | bool

- name: "Clean-Slate | INFO — agent-live authorization decision"
  ansible.builtin.debug:
    msg: >-
      INFO: agent-live authorization:
      {{ (svc06_throwaway_decision.stdout | default('{}') | from_json).reason | default('no decision') }}
  when: agent_live_run | default(false) | bool

- name: "Clean-Slate | Refuse the reset unless the throwaway guard AUTHORIZED it"
  ansible.builtin.assert:
    that:
      - "svc06_throwaway_decision.rc == 0"
    fail_msg: >-
      Agent-live clean-slate REFUSED by the throwaway-cluster guard:
      {{ (svc06_throwaway_decision.stdout | default('{}') | from_json).reason
         | default('guard produced no decision') }}.
      No container was destroyed and no Terraform state was modified.
    success_msg: "Throwaway-cluster guard AUTHORIZED the agent-live clean-slate."
  when: agent_live_run | default(false) | bool

- name: "Clean-Slate | Prompt for explicit confirmation (300s timeout; skipped on force)"
  ansible.builtin.pause:
    prompt: >-
      DESTRUCTIVE Clean-Slate reset of SVC-06 (ZITADEL) requested. This will
      pct-destroy the ZITADEL container {{ svc06_zitadel_vmid }} AND the backing
      DB container {{ svc06_db_vmid }}, and remove both from Terraform state.
      Type 'yes' to proceed, anything else to abort
  register: svc06_clean_slate_prompt
  when: (clean_slate_confirm | default('')) != 'force'

- name: "Clean-Slate | Resolve whether the reset is confirmed"
  ansible.builtin.set_fact:
    svc06_clean_slate_confirmed: >-
      {{ (clean_slate_confirm | default('')) == 'force'
         or ((svc06_clean_slate_prompt.user_input | default('') | trim | lower) in ['yes', 'y']) }}

- name: "Clean-Slate | Abort with non-zero exit when not confirmed (destroys nothing)"
  ansible.builtin.fail:
    msg: >-
      Clean-Slate reset ABORTED — confirmation not given. Nothing destroyed.
      Re-run with 'yes' at the prompt, or -e clean_slate_confirm=force.
  when: not (svc06_clean_slate_confirmed | bool)

- name: "Clean-Slate | Resolve cluster env for the Proxmox node name"
  ansible.builtin.command:
    argv:
      - "{{ svc06_venv_python }}"
      - "{{ svc06_cluster_env_helper | default('scripts/installer/cluster_env.py') }}"
      - "--env-file"
      - "{{ cluster_env_file }}"
  args:
    chdir: "{{ svc06_repo_root }}"
  register: svc06_cs_env_resolve
  changed_when: false
  no_log: true

- name: "Clean-Slate | Bind the resolved Proxmox node name (no_log)"
  ansible.builtin.set_fact:
    proxmox_node_name: "{{ (svc06_cs_env_resolve.stdout | from_json)['TF_VAR_proxmox_node_name'] }}"
  no_log: true

- name: "Clean-Slate | Assert the Proxmox host SSH address was supplied"
  ansible.builtin.assert:
    that:
      - "svc06_proxmox_host is defined"
      - "(svc06_proxmox_host | trim | length) > 0"
    fail_msg: >-
      The reset delegates to clean-slate.yml against the Proxmox-host inventory
      (runs `pct` on the node). Supply -e svc06_proxmox_host=<real-proxmox-lan-ip>.
      Nothing was destroyed.
    success_msg: "Proxmox host SSH address supplied for the reset."

# --- A. Tear down the ZITADEL guest (single target) --------------------------
- name: "Clean-Slate | Assemble the single ZITADEL clean_slate_target"
  ansible.builtin.set_fact:
    svc06_clean_slate_targets:
      - name: "svc06-20-01"
        terraform_root: infra/projects/svc-06-identity-provider
        resource_address: proxmox_virtual_environment_container.zitadel
        node: "{{ proxmox_node_name }}"
        vmid: "{{ svc06_zitadel_vmid }}"

- name: "Clean-Slate | Delegate the ZITADEL reset to clean-slate.yml"
  ansible.builtin.command:
    argv:
      - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible-playbook"
      - -i
      - "{{ svc06_proxmox_host_inventory }}"
      - ansible/playbooks/clean-slate.yml
      - --extra-vars
      - "ansible_host={{ svc06_proxmox_host }}"
      - -e
      - clean_slate_enabled=true
      - -e
      - "clean_slate_confirm={{ item.vmid }}"
      - -e
      - "{{ {'clean_slate_targets': [item]} | to_json }}"
  args:
    chdir: "{{ svc06_repo_root }}"
  loop: "{{ svc06_clean_slate_targets }}"
  loop_control:
    label: "{{ item.name }} (vmid {{ item.vmid }})"
  register: svc06_clean_slate_runs
  changed_when: "'changed=0' not in (svc06_clean_slate_runs.stdout | default(''))"

# --- B. Orchestrate the backing-DB clean-slate (child svc-01-bootstrap) ------
# The DB is an SVC-01 instance with its OWN state; invoke ITS clean-slate
# contract (not a reach across the state boundary). Mirrors the platform
# clean-slate "orchestrate each service's own clean-slate" rule (ADR-0011).
- name: "Clean-Slate | Orchestrate the backing-DB clean-slate (child svc-01-bootstrap, no_log)"
  ansible.builtin.command:
    argv:
      - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible-playbook"
      - -i
      - ansible/inventory/localhost.yml
      - ansible/playbooks/svc-01-bootstrap.yml
      - -e
      - "cluster_env_file={{ cluster_env_file }}"
      - -e
      - clean_slate=true
      - -e
      - "clean_slate_confirm={{ clean_slate_confirm | default('') }}"
      - -e
      - "project_slug={{ svc06_db_project_slug }}"
      - -e
      - "vlan_id={{ svc06_db_vlan_id }}"
      - -e
      - "svc01_vmid={{ svc06_db_vmid }}"
      - -e
      - "svc01_proxmox_host={{ svc06_proxmox_host }}"
  args:
    chdir: "{{ svc06_repo_root }}"
  environment:
    AGENT_LIVE_AUTHORIZED: "{{ lookup('ansible.builtin.env', 'AGENT_LIVE_AUTHORIZED') | default('', true) }}"
  register: svc06_db_clean_slate
  changed_when: "'changed=0' not in (svc06_db_clean_slate.stdout | default(''))"
  no_log: true

# ---- Remove the delegated ZITADEL cross-guest Route_Fragment ----------------
# The ZITADEL guest is now destroyed (section A above). The Route_Fragment
# ZITADEL delegated onto the Traefik_Guest's watched file-provider dir
# (zitadel-route.yml) must ALSO be removed, or Traefik keeps a dangling route
# pointing at the now-freed VLAN-20 IP (10.0.20.15). This is a
# TRAEFIK-GUEST-SIDE cleanup, not a guest destroy — delegated to the
# Traefik_Guest, and the watched file provider hot-reloads the route's removal
# with no Traefik restart. Spec svc-06-cross-guest-ingress R4.1-R4.4; mirrors
# the FIXED svc07_clean_slate / obs_clean_slate pattern EXACTLY.
#
# ORCHESTRATOR-CONTEXT CONNECTION SETUP. The clean-slate branch runs in the
# `hosts: localhost` orchestrator play (localhost.yml, ansible_connection:
# local) — NOT the configurator play (zitadel.yml + the generated inventory).
# In that orchestrator context there is NO add_host for the Traefik_Guest and NO
# known_hosts entry for it, so a bare `delegate_to: 10.0.20.12` has no working
# SSH connection. A naive `failed_when: false` would swallow the connection
# failure as a FALSE "already absent", silently leaving a dangling route. The
# fix mirrors svc07_clean_slate / obs_clean_slate EXACTLY: before delegating
# from the orchestrator play, reconcile known_hosts (ssh-keygen -R +
# ssh-keyscan) and add_host the guest with connection vars, so the removal
# actually connects — and a de-masked failure condition makes a silent
# false-success impossible.
- name: "Clean-Slate | Ensure ~/.ssh exists (0700) for the Traefik_Guest known_hosts reconcile"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: "Clean-Slate | Remove any stale known_hosts fingerprint for the Traefik_Guest"
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -R
      - "{{ svc06_traefik_guest_host }}"
      - -f
      - "{{ ansible_env.HOME }}/.ssh/known_hosts"
  register: svc06_traefik_knownhosts_purge
  changed_when: "'updated' in (svc06_traefik_knownhosts_purge.stderr | default(''))"
  failed_when: false

# failed_when:false on the KEYSCAN — during a FULL teardown the Traefik_Guest
# itself may already be gone/unreachable (it is a separate guest, torn down by
# its own SVC-09 clean-slate). A missing Traefik_Guest must NOT block the SVC-06
# empty-baseline gate (the fragment dies with that guest anyway). So the keyscan
# does not fail the play; instead we compute svc06_traefik_reachable from
# (rc == 0 AND non-empty stdout) and GATE the append + the removal on it.
- name: "Clean-Slate | ssh-keyscan the Traefik_Guest (30s; tolerant of a torn-down guest)"
  ansible.builtin.command:
    argv:
      - ssh-keyscan
      - -T
      - "30"
      - "{{ svc06_traefik_guest_host }}"
  register: svc06_traefik_keyscan
  changed_when: false
  failed_when: false

- name: "Clean-Slate | Resolve whether the Traefik_Guest is reachable (keyscan succeeded)"
  ansible.builtin.set_fact:
    svc06_traefik_reachable: >-
      {{ (svc06_traefik_keyscan.rc | default(1)) == 0
         and ((svc06_traefik_keyscan.stdout | default('') | trim | length) > 0) }}

- name: "Clean-Slate | Append the Traefik_Guest host key to known_hosts (only when reachable)"
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.ssh/known_hosts"
    create: true
    mode: "0600"
    marker: "# {mark} SVC-06 clean-slate Traefik_Guest key for {{ svc06_traefik_guest_host }}"
    block: "{{ svc06_traefik_keyscan.stdout }}"
  when: svc06_traefik_reachable | bool

# Scope: ONLY this feature's zitadel-route.yml — NOT SVC-09's shared default
# cert, which is out of scope for this teardown. `state: absent` is naturally
# idempotent — a no-op when the fragment is already gone. The add_host supplies
# the orchestrator-context SSH connection (the configurator play's add_host is
# absent here); delegate_to that host so the file module runs ON the Traefik_Guest.
- name: "Clean-Slate | Register the Traefik_Guest for the orchestrator-context delegation"
  ansible.builtin.add_host:
    name: svc06-traefik-cross-guest-cleanup
    ansible_host: "{{ svc06_traefik_guest_host }}"
    ansible_user: "{{ svc06_traefik_guest_user | default('root') }}"
    ansible_python_interpreter: "{{ svc06_traefik_guest_python | default('/usr/bin/python3') }}"
    ansible_ssh_private_key_file: >-
      {{ (svc06_traefik_guest_ssh_key | default('') | trim | length > 0)
         | ternary(svc06_traefik_guest_ssh_key, omit) }}
    ansible_connection: ssh
  changed_when: false
  when: svc06_traefik_reachable | bool

# De-masked removal. Gated on reachability: a full teardown (Traefik gone) SKIPS
# this cleanly (the INFO task below reports "unreachable on full teardown"),
# rather than the old silent false-success. When the guest IS reachable, the
# removal runs with a REAL failure condition — it fails only if the `file` module
# errored for a reason OTHER than the host being unreachable. A genuine "fragment
# still there, removal errored" is no longer masked.
- name: "Clean-Slate | Remove the delegated ZITADEL Route_Fragment from the Traefik_Guest"
  ansible.builtin.file:
    path: "{{ svc06_zitadel_route_fragment }}"
    state: absent
  delegate_to: svc06-traefik-cross-guest-cleanup
  register: svc06_zitadel_route_removed
  when: svc06_traefik_reachable | default(true) | bool
  failed_when:
    - svc06_zitadel_route_removed is failed
    - "'unreachable' not in (svc06_zitadel_route_removed.msg | default('') | lower)"

- name: "Clean-Slate | INFO — ZITADEL Route_Fragment removal outcome"
  ansible.builtin.debug:
    msg: >-
      {{
        ('ZITADEL Route_Fragment removal SKIPPED: the Traefik_Guest '
          ~ svc06_traefik_guest_host ~ ' was unreachable during a full teardown '
          ~ '(ssh-keyscan found no host) — the fragment ' ~ svc06_zitadel_route_fragment
          ~ ' dies with the guest, no dangling route is possible. No action needed.')
        if (not (svc06_traefik_reachable | default(true) | bool))
        else (('Removed the dangling ZITADEL Route_Fragment '
          ~ svc06_zitadel_route_fragment ~ ' from the reachable Traefik_Guest '
          ~ svc06_traefik_guest_host ~ ' (no dangling route left pointing at the '
          ~ 'freed ZITADEL VLAN-20 IP).')
        if (svc06_zitadel_route_removed is changed)
        else ('No ZITADEL Route_Fragment to remove at ' ~ svc06_zitadel_route_fragment
          ~ ' on the reachable Traefik_Guest ' ~ svc06_traefik_guest_host
          ~ ' (already absent — verified over a working SSH connection, NOT a '
          ~ 'connection failure). No action needed.'))
      }}
  changed_when: false

# --- Empty-baseline verify over BOTH guests ----------------------------------
- name: "Clean-Slate | VERIFY — list surviving SVC-06 containers on the host (pct list)"
  ansible.builtin.command:
    argv:
      - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible"
      - proxmox
      - -i
      - "{{ svc06_proxmox_host_inventory }}"
      - --extra-vars
      - "ansible_host={{ svc06_proxmox_host }}"
      - -m
      - ansible.builtin.command
      - -a
      - "pct list"
  args:
    chdir: "{{ svc06_repo_root }}"
  register: svc06_pct_list
  changed_when: false
  failed_when: false

- name: "Clean-Slate | Compute the set of surviving SVC-06 container VMIDs"
  ansible.builtin.set_fact:
    svc06_surviving_vmids: >-
      {{ [svc06_zitadel_vmid | string, svc06_db_vmid | string]
         | select('in', (svc06_pct_list.stdout | default(''))) | list }}

# Zero RESOURCES of ANY kind in the SVC-06 (ZITADEL) Terraform state. The
# ZITADEL child clean-slate.yml run above destroyed the ZITADEL guest and
# state-rm'd its container address; the backing-DB clean-slate (child
# svc-01-bootstrap) empties the SVC-01 state via ITS own now-fixed sweep. But
# the SVC-06 root still carries the non-guest `module.*.terraform_data.input_guards`
# anchor (via proxmox-compute), which the container-only state rm leaves behind
# (the residue bug, spec fix-svc07-clean-slate-terraform-data-residue). A correct
# clean-slate must leave the ZITADEL `terraform state list` EMPTY, so enumerate
# every remaining ADDRESS and `terraform state rm` it PROVIDER-FREE (NOT
# `terraform destroy`, Req 2.5). All ops run on the CONTROL NODE.
- name: "Clean-Slate | List ALL remaining addresses in the SVC-06 Terraform state (residue sweep)"
  ansible.builtin.command:
    argv: [terraform, state, list]
  args:
    chdir: "{{ svc06_tf_root }}"
  register: svc06_residual_state_list
  changed_when: false
  failed_when: false

- name: "Clean-Slate | Compute the residual (non-guest terraform_data) addresses to remove"
  ansible.builtin.set_fact:
    svc06_residual_state_addrs: >-
      {{ (svc06_residual_state_list.stdout | default('')).splitlines()
         | map('trim') | select('ne', '') | list }}

- name: "Clean-Slate | Remove ALL remaining state addresses provider-free (terraform state rm)"
  ansible.builtin.command:
    argv: [terraform, state, rm, "{{ item }}"]
  args:
    chdir: "{{ svc06_tf_root }}"
  loop: "{{ svc06_residual_state_addrs }}"
  loop_control:
    label: "{{ item }}"
  register: svc06_residual_state_rm
  changed_when: "'Removed' in (svc06_residual_state_rm.stdout | default(''))"
  failed_when:
    - (svc06_residual_state_rm.rc | default(1)) != 0
    - "'No matching objects' not in (svc06_residual_state_rm.stdout | default(''))"
    - "'No matching objects' not in (svc06_residual_state_rm.stderr | default(''))"

- name: "Clean-Slate | VERIFY — list the FULL SVC-06 Terraform state after the residue sweep"
  ansible.builtin.command:
    argv: [terraform, state, list]
  args:
    chdir: "{{ svc06_tf_root }}"
  register: svc06_state_list
  changed_when: false
  failed_when: false

- name: "Clean-Slate | Compute the set of surviving SVC-06 state addresses (FULL state)"
  ansible.builtin.set_fact:
    svc06_surviving_state_addrs: >-
      {{ (svc06_state_list.stdout | default('')).splitlines()
         | map('trim') | select('ne', '') | list }}

- name: "Clean-Slate | GATE — assert an empty baseline (0 containers, 0 ZITADEL state), Req 2.2"
  ansible.builtin.assert:
    that:
      - "(svc06_surviving_vmids | length) == 0"
      - "(svc06_surviving_state_addrs | length) == 0"
    fail_msg: >-
      Clean-Slate reset did NOT reach an empty baseline. Surviving container(s):
      {{ svc06_surviving_vmids | default([]) | join(', ') | default('none', true) }};
      surviving ZITADEL state address(es):
      {{ svc06_surviving_state_addrs | default([]) | join(', ') | default('none', true) }}.
    success_msg: "Clean-Slate reset complete — zero SVC-06 containers + EMPTY ZITADEL state."
