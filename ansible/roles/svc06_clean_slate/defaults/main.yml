---
# defaults/main.yml — svc06_clean_slate (SVC-06 installer — clean-slate branch)
#
# Cross-phase constants (clean_slate, clean_slate_confirm, cluster_env_file,
# svc06_repo_root, svc06_venv_python, svc06_tf_root, svc06_zitadel_vmid,
# svc06_db_* from svc06_provision defaults) stay play-level / provision-role.
# NO secret here.

# Proxmox host SSH address for the reset path (pct runs on the node). Supply the
# real LAN IP with -e svc06_proxmox_host=<real-proxmox-lan-ip>. Fail-fast if a
# reset is requested without it. Not needed on the normal install path.
svc06_proxmox_host: ""
svc06_proxmox_host_inventory: ansible/inventory/proxmox-hosts.yml

# --- ZITADEL cross-guest Route_Fragment removal (svc-06-cross-guest-ingress) ---
# When the ZITADEL guest is torn down, the delegated Traefik Route_Fragment it
# wrote onto the Traefik_Guest's watched file-provider dir must ALSO be removed,
# so a destroyed ZITADEL leaves no dangling route pointing at a freed VLAN-20 IP
# (10.0.20.15). Spec .kiro/specs/svc-06-cross-guest-ingress/ (R4.1-R4.4); mirrors
# the FIXED svc07_clean_slate / obs_clean_slate Route_Fragment-removal pattern.
# svc06_clean_slate is a SEPARATE role from zitadel-server, so it does not see
# that role's traefik_* defaults; these mirror svc07_clean_slate's svc07_traefik_*
# set (SAME values, ZITADEL-named) so the removal targets exactly the file the
# traefik_route role wrote. A Route_Fragment is PUBLIC, non-secret; no secret
# value ever lives here, and no private key is involved.
#   * svc06_traefik_guest_host — the Traefik (SVC-09) guest the fragment lives on
#     (the file-provider owner, delegate target). Default is the SVC-09 VLAN-20
#     IP (10.0.20.12 per ADR-0015), matching zitadel-server's default.
svc06_traefik_guest_host: "10.0.20.12"
svc06_traefik_guest_user: "root"
svc06_traefik_guest_python: "/usr/bin/python3"
# SSH private key used to reach the Traefik_Guest when the removal delegates from
# the localhost orchestrator play. Empty by default → `| default(omit)` so the
# ambient SSH key is used, exactly as the svc06_provision role relies on the
# ambient key. Overridable with -e svc06_traefik_guest_ssh_key=<path> if the
# orchestrator runs under an account whose default key does not reach the guest.
#
# THE FIXED ORCHESTRATOR-CONTEXT CONNECTION PATTERN (why these vars exist). The
# clean-slate branch runs in the `hosts: localhost` orchestrator play
# (ansible_connection: local) — NOT the configurator play + generated inventory.
# In that orchestrator context there is NO add_host for the Traefik_Guest and NO
# known_hosts entry, so a bare `delegate_to: 10.0.20.12` has no working SSH
# connection and a naive `failed_when: false` would swallow the connection
# failure as a FALSE "already absent", silently leaving a dangling route. These
# connection vars feed the add_host that reconciles known_hosts + supplies the
# SSH connection before the delegated removal runs.
svc06_traefik_guest_ssh_key: ""
# SVC-09's Traefik file-provider directory on the Traefik guest (watched, :ro
# mount). Matches zitadel-server's traefik_dynamic_config_dir and
# traefik_install's with no SVC-09 edit.
svc06_traefik_dynamic_config_dir: "/etc/traefik/dynamic"
# The delegated ZITADEL Route_Fragment the traefik_route role renders as
# "{{ route_name }}-route.yml" with route_name=zitadel. Removed on clean-slate.
svc06_zitadel_route_fragment: "{{ svc06_traefik_dynamic_config_dir }}/zitadel-route.yml"
