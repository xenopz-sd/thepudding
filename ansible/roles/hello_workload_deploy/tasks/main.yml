---
# tasks/main.yml — hello_workload_deploy
# (consumer-last-mile-hello-workload §A, task 4.2)
#
# STAND UP the reference "hello-workload" via the EXISTING `openbao-agent` role —
# COMPOSITION, not new agent wiring. Two steps:
#   STEP 1 — stage the task-4.1 reference entrypoint (files/healthz-entrypoint.sh
#            from the `hello_workload` role) onto the TARGET host, read-only.
#   STEP 2 — include `openbao-agent`, threading the `hello_workload_*` reference
#            var set into that role's EXISTING inputs (its optional, additive
#            workload-service pass-throughs + the default DB secret mapping).
#
# The Agent sidecar, AppRole auto_auth, Rendered_Secret_File, and the
# `depends_on … service_healthy` swap-gate come from `openbao-agent` UNCHANGED —
# this role adds NO credential/auth logic. The workload reads DATABASE_URL ONLY
# from the Agent-rendered Rendered_Secret_File at container start (the v0.11.3
# {db, database_url, DATABASE_URL} bridge), never a committed/templated value.
# No secret value appears here; the composed role's `no_log` covers the
# secret-bearing tasks.

# ============================================================================
# STEP 0 — Guard: a project slug is required (openbao-agent asserts it too)
# ============================================================================
- name: "Hello-workload | Assert project_slug is supplied"
  ansible.builtin.assert:
    that:
      - project_slug is defined
      - project_slug | string | length > 0
    fail_msg: >-
      project_slug is required to stand up the reference hello-workload — it
      selects the KV subtree (secret/data/<slug>/db) the Agent renders
      DATABASE_URL from. Supply it as an extra-var or play var.
    success_msg: "Standing up the reference hello-workload for project '{{ project_slug }}'."
    quiet: true

# ============================================================================
# STEP 0b (WS-C6, part B) — Resolve the dev TLS posture for the Agent -> Primary hop
# ============================================================================
# explicit -e openbao_tls_self_signed > OPENBAO_TLS_SELF_SIGNED in the cluster env
# file > false (verify). Read-only; control-node lookup; a missing file is "unset".
# The env text is never logged (no_log) and only the boolean verdict is kept.
- name: "Hello-workload | Read the cluster env file text (control node, read-only, WS-C6)"
  ansible.builtin.set_fact:
    hello_workload_envfile_text: >-
      {{ lookup('ansible.builtin.file', hello_workload_cluster_env_path, errors='ignore')
         | default('', true) }}
  no_log: true
- name: "Hello-workload | Resolve the dev TLS posture (explicit -e > env file > verify, WS-C6)"
  ansible.builtin.set_fact:
    hello_workload_tls_self_signed: >-
      {{ (openbao_tls_self_signed | bool) if openbao_tls_self_signed is defined
         else (hello_workload_envfile_text | string
               is search(hello_workload_tls_optin_regex)) }}
# ============================================================================
# STEP 1 — Stage the reference entrypoint onto the target host (service-owned)
# ============================================================================
# The reference image is STOCK (busybox); the /healthz-iff-secret behaviour is
# delivered by MOUNTING this entrypoint read-only into the container (NOT a
# bespoke image). Stage it under the project's workload stack dir so the mount
# source is stable and service-owned. Non-secret artifact (the script logs only
# the boolean presence of DATABASE_URL, never its value — task 4.1).
- name: "Hello-workload | Ensure the entrypoint stage dir exists (service-owned)"
  ansible.builtin.file:
    path: "{{ hello_workload_entrypoint_host_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0750"

- name: "Hello-workload | Stage the reference /healthz entrypoint (read-only mount source)"
  ansible.builtin.copy:
    src: "{{ hello_workload_entrypoint_src }}"
    dest: "{{ hello_workload_entrypoint_host_path }}"
    owner: root
    group: root
    mode: "0755"

# ============================================================================
# STEP 2 — Stage the workload AppRole creds onto the GUEST (BEFORE the agent)
# ============================================================================
# (fix-workload-guest-creds-staging) The openbao-agent sidecar (composed in
# STEP 3) bind-mounts role-id/secret-id READ-ONLY from host paths ON THIS GUEST
# (openbao_agent_role_id_host_path / openbao_agent_secret_id_host_path). The
# control-plane openbao_workload_approle role (consumer_bootstrap STEP 3) minted
# those creds and handed them to the CONTROL NODE
# (hello_workload_creds_src_dir = consumer_workload_creds_dir =
# $HOME/.openbao-workload/<slug>), NOT this guest. On a dedicated workload guest
# the two are different hosts, so without this step the mount sources are absent,
# Docker auto-creates empty DIRECTORIES at them, and the Agent reads a directory
# where a file must be ("read /openbao/agent/role-id: is a directory") ->
# AppRole auto-auth crash-loops -> the workload never becomes healthy.
#
# This step COPIES the 0600 creds from the control node onto this guest at
# EXACTLY the two paths openbao-agent mounts (0600 root:root, parent dir 0700
# root:root). `ansible.builtin.copy` reads the local src on the control node and
# writes it to the remote guest over the Ansible SSH connection — the secret_id
# value never touches a repo file or stdout (no_log on that task). It adds NO
# agent/auth logic: it only places the files the EXISTING openbao-agent mounts
# expect. Fail-closed if the source creds are absent (clear remedy).

- name: "Hello-workload | Assert the workload AppRole creds exist on the control node (fail-closed)"
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - "{{ hello_workload_role_id_src_path }}"
    - "{{ hello_workload_secret_id_src_path }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  run_once: true
  register: hello_workload_cred_src_stat

- name: "Hello-workload | Fail closed if the workload AppRole creds were never handed off"
  ansible.builtin.assert:
    that:
      - hello_workload_cred_src_stat.results | selectattr('stat.exists') | list | length
        == hello_workload_cred_src_stat.results | length
    fail_msg: >-
      The workload AppRole role_id/secret_id were not found on the control node at
      {{ hello_workload_creds_src_dir }} (expected
      {{ project_slug }}-workload-role-id and {{ project_slug }}-workload-secret-id).
      Nothing can be staged onto the workload guest. REMEDY: run the consumer
      bootstrap for '{{ project_slug }}' first to mint + hand off the workload
      AppRole (it writes the 0600 creds to that dir), then re-run this deploy. If
      the handoff used a different dir, override hello_workload_creds_src_dir.
    success_msg: >-
      Workload AppRole creds present on the control node — staging them onto the
      guest for project '{{ project_slug }}'.
    quiet: true
  delegate_to: localhost
  run_once: true

- name: "Hello-workload | Ensure the guest cred dir exists (service-owned, 0700 root:root)"
  ansible.builtin.file:
    # The dest-path vars are THIS role's own defaults (in scope here, at STEP 2,
    # unlike the openbao_agent_* defaults which enter scope only at the STEP 3
    # include). Same canonical value; threaded INTO openbao-agent at STEP 3.
    path: "{{ hello_workload_role_id_dest_path | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: "Hello-workload | Stage the role_id onto the guest (0600 root:root, non-secret)"
  ansible.builtin.copy:
    src: "{{ hello_workload_role_id_src_path }}"
    dest: "{{ hello_workload_role_id_dest_path }}"
    owner: root
    group: root
    mode: "0600"

- name: "Hello-workload | Stage the secret_id onto the guest (0600 root:root, sensitive)"
  ansible.builtin.copy:
    src: "{{ hello_workload_secret_id_src_path }}"
    dest: "{{ hello_workload_secret_id_dest_path }}"
    owner: root
    group: root
    mode: "0600"
  # The secret_id is sensitive: the value crosses control-node -> guest over SSH
  # only, and the task output is suppressed by DEFAULT (openbao_no_log resolves to
  # true unless the dev-only expose opt-in is set). NEVER committed/templated/echoed.
  no_log: "{{ openbao_no_log }}"

# ============================================================================
# STEP 3 — Stand up the Agent sidecar + reference workload via openbao-agent
# ============================================================================
# COMPOSE the EXISTING `openbao-agent` role (no new agent wiring). Thread the
# task-4.1 `hello_workload_*` reference var set into its inputs:
#   * openbao_agent_secret_mappings  <- hello_workload_secret_mappings
#       the v0.11.3 default DB mapping {db, database_url, DATABASE_URL}, so the
#       Agent renders DATABASE_URL into the Rendered_Secret_File (Req 1.2).
#   * workload_image                 <- hello_workload_image  (stock busybox)
#   * openbao_agent_workload_command <- hello_workload_command
#       runs the MOUNTED entrypoint on the stock image.
#   * openbao_agent_workload_volumes <- the read-only entrypoint mount
#       (host staged path : hello_workload_entrypoint_container_path : ro).
#   * openbao_agent_workload_environment <- hello_workload_env
#       NON-secret config only (port/webroot/secret-env-name); NEVER the secret.
#   * openbao_agent_workload_healthcheck <- hello_workload_healthcheck
#       the workload-layer /healthz probe (healthy only once DATABASE_URL is
#       present) — ON TOP OF the Agent sidecar's own RSF-presence healthcheck.
# The RSF `extra_env_files` layering, the `depends_on … service_healthy`
# swap-gate, the Traefik label, and the no-host-port posture are all provided by
# `openbao-agent` UNCHANGED (its FIXED wiring) — not re-stated here (Req 1.1/1.6).
- name: "Hello-workload | Stand up the reference workload via the existing openbao-agent role"
  ansible.builtin.include_role:
    name: openbao-agent
  vars:
    # Thread the guest DEST paths STEP 2 staged to INTO the agent as its mount
    # sources, so what was staged is EXACTLY what the sidecar bind-mounts
    # read-only (staged == mounted, no drift). THIS role is the single source of
    # truth for the dest paths; passing them via the include `vars:` is in scope
    # inside the include (unlike referencing the agent defaults before it, which
    # was the bug). A direct openbao-agent caller that omits these still gets the
    # agent role's own default (the standalone fallback, unchanged).
    openbao_agent_role_id_host_path: "{{ hello_workload_role_id_dest_path }}"
    openbao_agent_secret_id_host_path: "{{ hello_workload_secret_id_dest_path }}"
    # The default DB mapping {db, database_url, DATABASE_URL} (Req 1.2). Only the
    # KV reference + env key — no secret value.
    openbao_agent_secret_mappings: "{{ hello_workload_secret_mappings }}"
    # Stock reference image (task 4.1).
    workload_image: "{{ hello_workload_image }}"
    # Run the MOUNTED entrypoint on the stock image.
    openbao_agent_workload_command: "{{ hello_workload_command }}"
    # Mount the staged entrypoint read-only at the in-container path the command
    # runs (host:container:ro). This is the only reason the workload needs a
    # volume — a non-secret script, never a credential.
    openbao_agent_workload_volumes:
      - "{{ hello_workload_entrypoint_host_path }}:{{ hello_workload_entrypoint_container_path }}:ro"
    # NON-secret per-container env (port/webroot/secret-env-NAME). The DB secret
    # itself arrives via the Rendered_Secret_File, never here.
    openbao_agent_workload_environment: "{{ hello_workload_env }}"
    # The workload-layer /healthz healthcheck (Req 1.1) — distinct from, and on
    # top of, the Agent sidecar's RSF-presence healthcheck + the swap-gate.
    openbao_agent_workload_healthcheck: "{{ hello_workload_healthcheck }}"
    # Dev TLS posture (WS-C6): the resolved explicit-opt-in verdict (default FALSE =
    # verify). Never a committed production default (platform-runtime-patterns P4).
    openbao_primary_tls_skip_verify: "{{ hello_workload_tls_self_signed }}"

- name: "Hello-workload | INFO — reference workload stood up via openbao-agent (secret by name only)"
  ansible.builtin.debug:
    msg: >-
      INFO: reference hello-workload stood up for '{{ project_slug }}' on target
      '{{ hello_workload_target }}' via the EXISTING openbao-agent role
      (image={{ hello_workload_image }}). DATABASE_URL is rendered by the Agent
      into the Rendered_Secret_File and read at container start; /healthz returns
      200 only once it is present (swap-gate observable at the workload layer).
      No new agent wiring; no secret value shown.
