---
# defaults/main.yml — hello_workload_deploy
# (consumer-last-mile-hello-workload §A, task 4.2)
#
# The thin COMPOSITION role that STANDS UP the reference "hello-workload" via the
# EXISTING `openbao-agent` role — no new agent/auth wiring (task 4.2). It owns
# exactly two responsibilities:
#   (1) stage the reference entrypoint (the task-4.1 `hello_workload` role's
#       files/healthz-entrypoint.sh) onto the TARGET host at a service-owned
#       path, read-only; and
#   (2) include `openbao-agent`, threading the task-4.1 `hello_workload_*`
#       reference var set into that role's EXISTING inputs (its optional,
#       additive workload-service pass-throughs + the default DB secret mapping).
#
# It introduces NO agent/credential logic of its own: the Agent sidecar, the
# AppRole auto_auth, the Rendered_Secret_File, and the swap-gate all come from
# `openbao-agent` UNCHANGED. The reference var set lives in the `hello_workload`
# role (defaults/main.yml + files/healthz-entrypoint.sh); this role depends on it
# (meta/main.yml) so those `hello_workload_*` vars are in scope here.
#
# NO secret value appears anywhere in this role. The workload reads DATABASE_URL
# ONLY from the Agent-rendered Rendered_Secret_File at container start (the
# v0.11.3 {db, database_url, DATABASE_URL} bridge), never a committed/templated
# value; every secret-bearing task inherits openbao-agent's `no_log`.

# =============================================================================
# REQUIRED input (no default): the project whose KV subtree the Agent reads
# =============================================================================
# project_slug is forwarded to openbao-agent (which asserts it). Left UNDEFINED
# so a run without an explicit slug fails loudly in the composed role.
# project_slug: "<slug>"   # REQUIRED — supplied by the caller / consumer flow.

# =============================================================================
# PLACEMENT — target-aware (workload guest when enabled, else co-locate target)
# =============================================================================
# The Ansible inventory GROUP (or host) the reference workload is stood up on.
# The per-project workload guest's `service_role` is `workload` (the module's
# service_name), and generate_inventory.py groups hosts by service_role — so the
# provisioned workload guest lands in the `workload` inventory group. When the
# manifest declares `workload.enabled: true` (task 2.2/3.1), that group exists
# and is the default target. When NO workload guest is provisioned, an operator
# co-locates the stand-up on the DB guest (or a bring-your-own host) by
# overriding this to that target group/host (the documented topologies, task 8).
# The composition playbook sets this from `hello_workload_enabled`; a direct
# invocation overrides with `-e hello_workload_target=<group-or-host>`.
hello_workload_target: workload

# Whether a dedicated workload guest was provisioned (manifest workload.enabled).
# Only used to DOCUMENT/choose the default target in the composition playbook;
# this role itself always targets `hello_workload_target`.
hello_workload_enabled: false

# =============================================================================
# Entrypoint staging (service-owned, read-only mount source)
# =============================================================================
# Source path of the reference entrypoint shipped by the `hello_workload` role
# (task 4.1). Resolved relative to this role so the copy finds it regardless of
# the invoking playbook's location. `role_path` is this role's own dir; the
# sibling `hello_workload` role's files/ is one level up.
hello_workload_entrypoint_src: "{{ role_path }}/../hello_workload/files/healthz-entrypoint.sh"

# Host-side dir the entrypoint is staged into (service-owned, 0750). Anchored
# under the SAME Compose stack dir openbao-agent/docker-compose-app use for this
# project's workload stack (reproducing docker-compose-app's default expression
# EXACTLY, as openbao-agent's own default does), so the mount source is stable.
hello_workload_stack_dir: >-
  {{ dca_stack_dir | default((dca_base_dir | default('/opt/compose')) ~ '/' ~ (project_slug ~ '-workload')) }}
hello_workload_entrypoint_host_dir: "{{ hello_workload_stack_dir }}/bin"
# The host path the entrypoint is staged to and the read-only mount built from
# it (host:container:ro) threaded as openbao_agent_workload_volumes.
hello_workload_entrypoint_host_path: "{{ hello_workload_entrypoint_host_dir }}/healthz-entrypoint.sh"

# =============================================================================
# Workload AppRole credential STAGING — control node -> workload guest
# (fix-workload-guest-creds-staging)
# =============================================================================
# The openbao-agent sidecar bind-mounts its AppRole role-id/secret-id READ-ONLY
# from host paths ON THE GUEST (openbao_agent_role_id_host_path /
# openbao_agent_secret_id_host_path, default /etc/openbao-workload/<slug>/...).
# But the control-plane openbao_workload_approle role (composed by
# consumer_bootstrap STEP 3) hands the minted 0600 creds to the CONTROL NODE
# (consumer_workload_creds_dir = $HOME/.openbao-workload/<slug>), never the
# guest. On a DEDICATED workload guest (a separate host from the control node)
# nothing bridges that gap: the sidecar's mount sources are absent, Docker
# auto-creates empty DIRECTORIES at them, and the Agent reads a directory where a
# file must be ("read /openbao/agent/role-id: is a directory") -> auth crash-loop
# -> workload never healthy. STEP 2 of tasks/main.yml stages these creds onto the
# guest BEFORE composing openbao-agent.
#
# SOURCE dir on the CONTROL NODE — where consumer_bootstrap -> openbao_workload_
# approle wrote the 0600 creds. Default MATCHES consumer_workload_creds_dir
# ($HOME/.openbao-workload/<slug>) so it finds them with no override on the
# consumer path; overridable for the standalone / bring-your-own topologies (e.g.
# a run where the handoff used the role default /etc/openbao-workload/<slug>).
hello_workload_creds_src_dir: >-
  {{ lookup('ansible.builtin.env', 'HOME') }}/.openbao-workload/{{ project_slug }}

# The two SOURCE file paths on the control node. Filenames match the control
# role's handoff pattern <slug>-workload-{role,secret}-id
# (openbao_workload_approle: {{ openbao_workload_role_name }}-{role,secret}-id
# where openbao_workload_role_name = <slug>-workload). The role_id is non-secret;
# the secret_id is sensitive (staged under no_log).
hello_workload_role_id_src_path: "{{ hello_workload_creds_src_dir }}/{{ project_slug }}-workload-role-id"
hello_workload_secret_id_src_path: "{{ hello_workload_creds_src_dir }}/{{ project_slug }}-workload-secret-id"

# The two DESTINATION file paths ON THE GUEST that STEP 2 stages the creds to,
# and that STEP 3 threads INTO openbao-agent as its mount sources
# (openbao_agent_role_id_host_path / openbao_agent_secret_id_host_path). These
# are defined HERE, in THIS role's own defaults, so they are IN SCOPE at STEP 2
# — the openbao-agent defaults that also compute these do NOT enter scope until
# the STEP 3 `include_role: openbao-agent` (an included role's defaults are
# scoped at the point of inclusion). The VALUE is byte-identical to the
# openbao-agent default expression (/etc/openbao-workload/<slug>/<slug>-workload-
# {role,secret}-id), so the staged path and the agent's mount source are the
# SAME location. Threading these two vars into the include (STEP 3) makes THIS
# role the single source of truth for the dest paths and guarantees
# staged == mounted (no drift). A caller that invokes openbao-agent DIRECTLY,
# without threading these, still gets the agent role's own default
# (unchanged) — the standalone-caller fallback.
hello_workload_role_id_dest_path: "/etc/openbao-workload/{{ project_slug }}/{{ project_slug }}-workload-role-id"
hello_workload_secret_id_dest_path: "/etc/openbao-workload/{{ project_slug }}/{{ project_slug }}-workload-secret-id"

# =============================================================================
# DEV-ONLY secret-exposure opt-in (security-standards.md "Secrets handling")
# =============================================================================
# Mirrors the sibling openbao-agent / openbao_workload_approle convention so the
# secret_id staging task can reference `openbao_no_log` in THIS role's own scope
# (the composed openbao-agent role's default is not in scope for a task that runs
# BEFORE the include). Default FALSE -> openbao_no_log TRUE -> the secret_id copy
# is no_log. NON-NEGOTIABLE acceptance/production default; a developer debugging a
# THROWAWAY cluster MAY expose output for a SINGLE run with
# `-e openbao_dev_expose_secrets=true` — never committed, never in CI/acc/prod.
openbao_dev_expose_secrets: false
openbao_no_log: "{{ not (openbao_dev_expose_secrets | bool) }}"
