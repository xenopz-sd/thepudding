---
# tasks/main.yml — mailcatcher_clean_slate (Mail catcher installer — clean-slate branch)
#
# Clone of svc07_clean_slate adapted for the single mailcatcher guest. The enclosing
# `when: clean_slate` gate and the block/rescue phase-naming stay in the thin
# orchestrator play; this role owns the branch BODY only:
#   - agent-live throwaway-guard consult (FIRST, gated, fail-closed),
#   - confirmation gating (pause 300s unless clean_slate_confirm=force),
#   - independent cluster_env.py node-name resolution (no_log),
#   - Proxmox-host-address assertion,
#   - single-target assembly (the mailcatcher LXC vmid),
#   - child clean-slate.yml run (invoking the generic terraform_clean_slate role
#     — does NOT reimplement destroy logic),
#   - two-way empty-baseline verification gate (pct list + terraform state list).

# --- Agent-live throwaway-cluster authorization gate (FIRST, gated) ----------
- name: "Clean-Slate | Consult the throwaway-cluster authorization guard (Agent_Live_Run only)"
  ansible.builtin.command:
    argv:
      - "{{ mailcatcher_venv_python }}"
      - "{{ mailcatcher_throwaway_guard }}"
      - --service
      - mailcatcher
      - --env-file
      - "{{ cluster_env_file }}"
      - --allowlist
      - "{{ mailcatcher_throwaway_allowlist }}"
  args:
    chdir: "{{ mailcatcher_repo_root }}"
  register: mailcatcher_throwaway_decision
  changed_when: false
  failed_when: false
  when: agent_live_run | default(false) | bool

- name: "Clean-Slate | INFO — agent-live authorization decision"
  ansible.builtin.debug:
    msg: >-
      INFO: agent-live authorization:
      {{ (mailcatcher_throwaway_decision.stdout | default('{}') | from_json).reason | default('no decision') }}
  when: agent_live_run | default(false) | bool

- name: "Clean-Slate | Refuse the reset unless the throwaway guard AUTHORIZED it"
  ansible.builtin.assert:
    that:
      - "mailcatcher_throwaway_decision.rc == 0"
    fail_msg: >-
      Agent-live clean-slate REFUSED by the throwaway-cluster guard:
      {{ (mailcatcher_throwaway_decision.stdout | default('{}') | from_json).reason
         | default('guard produced no decision') }}.
      No container was destroyed and no Terraform state was modified. Arm the run
      only against a throwaway cluster listed in throwaway-clusters.yml with
      AGENT_LIVE_AUTHORIZED set.
    success_msg: "Throwaway-cluster guard AUTHORIZED the agent-live clean-slate."
  when: agent_live_run | default(false) | bool

# --- Confirmation gating -----------------------------------------------------
- name: "Clean-Slate | Prompt for explicit confirmation (300s timeout; skipped on force)"
  ansible.builtin.pause:
    prompt: >-
      DESTRUCTIVE Clean-Slate reset of Mail catcher requested. This will pct-destroy
      the mailcatcher container ({{ mailcatcher_vmid }}) and remove it from
      Terraform state. Type 'yes' to proceed, anything else to abort
  register: mailcatcher_clean_slate_prompt
  when: (clean_slate_confirm | default('')) != 'force'

- name: "Clean-Slate | Resolve whether the reset is confirmed"
  ansible.builtin.set_fact:
    mailcatcher_clean_slate_confirmed: >-
      {{ (clean_slate_confirm | default('')) == 'force'
         or ((mailcatcher_clean_slate_prompt.user_input | default('') | trim | lower) in ['yes', 'y']) }}

- name: "Clean-Slate | Abort with non-zero exit when not confirmed (destroys nothing)"
  ansible.builtin.fail:
    msg: >-
      Clean-Slate reset ABORTED — confirmation was not given (received a
      non-affirmative or empty/timed-out response). No container was destroyed
      and no Terraform state was modified. Re-run with an affirmative 'yes' at the
      prompt, or pass -e clean_slate_confirm=force to skip the prompt.
  when: not (mailcatcher_clean_slate_confirmed | bool)

# --- Delegated reset + verification gate -------------------------------------
# Phase 1 does NOT run on a clean-slate invocation, so proxmox_node_name is not
# resolved by preflight. Resolve it independently from the same cluster env.
- name: "Clean-Slate | Resolve cluster env for the Proxmox node name ({{ cluster_env_file }})"
  ansible.builtin.command:
    argv:
      - "{{ mailcatcher_venv_python }}"
      - "{{ mailcatcher_cluster_env_helper }}"
      - "--env-file"
      - "{{ cluster_env_file }}"
  args:
    chdir: "{{ mailcatcher_repo_root }}"
  register: mailcatcher_cs_env_resolve
  changed_when: false
  no_log: true

- name: "Clean-Slate | Bind the resolved Proxmox node name (no_log)"
  ansible.builtin.set_fact:
    proxmox_node_name: "{{ (mailcatcher_cs_env_resolve.stdout | from_json)['TF_VAR_proxmox_node_name'] }}"
  no_log: true

- name: "Clean-Slate | Assert the Proxmox host SSH address was supplied"
  ansible.builtin.assert:
    that:
      - "mailcatcher_proxmox_host is defined"
      - "(mailcatcher_proxmox_host | trim | length) > 0"
    fail_msg: >-
      The Clean-Slate reset delegates to clean-slate.yml against the Proxmox-host
      inventory ({{ mailcatcher_proxmox_host_inventory }}), which runs `pct` on the node
      over SSH. Supply the real Proxmox LAN IP with
      -e mailcatcher_proxmox_host=<real-proxmox-lan-ip>. Nothing was destroyed.
    success_msg: "Proxmox host SSH address supplied for the reset."

- name: "Clean-Slate | Assemble the single Mail catcher clean_slate_target"
  ansible.builtin.set_fact:
    mailcatcher_clean_slate_targets:
      - name: mailcatcher-20-01
        terraform_root: infra/projects/mailcatcher
        resource_address: proxmox_virtual_environment_container.mailcatcher
        node: "{{ proxmox_node_name }}"
        vmid: "{{ mailcatcher_vmid }}"

- name: "Clean-Slate | Delegate the reset to clean-slate.yml (one child run per target)"
  ansible.builtin.command:
    argv:
      - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible-playbook"
      - -i
      - "{{ mailcatcher_proxmox_host_inventory }}"
      - ansible/playbooks/clean-slate.yml
      - --extra-vars
      - "ansible_host={{ mailcatcher_proxmox_host }}"
      - -e
      - clean_slate_enabled=true
      - -e
      - "clean_slate_confirm={{ item.vmid }}"
      - -e
      - "{{ {'clean_slate_targets': [item]} | to_json }}"
  args:
    chdir: "{{ mailcatcher_repo_root }}"
  loop: "{{ mailcatcher_clean_slate_targets }}"
  loop_control:
    label: "{{ item.name }} (vmid {{ item.vmid }})"
  register: mailcatcher_clean_slate_runs
  changed_when: "'changed=0' not in (mailcatcher_clean_slate_runs.stdout | default(''))"

# ---- Remove the delegated web-UI Route_Fragment from the Traefik guest ---------
# The catcher guest is now destroyed. The Route_Fragment it delegated onto the
# Traefik guest's watched file-provider dir (mailcatcher-route.yml) must ALSO be
# removed, or Traefik keeps a dangling route to the freed VLAN-20 IP (10.0.20.21).
# This is a TRAEFIK-GUEST-SIDE cleanup (P1/P2): the clean-slate runs in the
# `hosts: localhost` orchestrator play, which has NO add_host and NO known_hosts
# entry for the Traefik guest, so a bare delegate_to an IP would have no working SSH
# connection and a `failed_when: false` would report a FALSE "already absent". So:
# reconcile known_hosts, add_host with connection vars, gate on reachability (a full
# teardown may have removed Traefik already), and keep a REAL failure condition.
- name: "Clean-Slate | Ensure ~/.ssh exists (0700) for the Traefik guest known_hosts reconcile"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"
- name: "Clean-Slate | Remove any stale known_hosts fingerprint for the Traefik guest"
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -R
      - "{{ mailcatcher_traefik_guest_host }}"
      - -f
      - "{{ ansible_env.HOME }}/.ssh/known_hosts"
  register: mailcatcher_traefik_knownhosts_purge
  changed_when: "'updated' in (mailcatcher_traefik_knownhosts_purge.stderr | default(''))"
  failed_when: false
- name: "Clean-Slate | ssh-keyscan the Traefik guest (30s; tolerant of a torn-down guest)"
  ansible.builtin.command:
    argv:
      - ssh-keyscan
      - -T
      - "30"
      - "{{ mailcatcher_traefik_guest_host }}"
  register: mailcatcher_traefik_keyscan
  changed_when: false
  failed_when: false
- name: "Clean-Slate | Resolve whether the Traefik guest is reachable (keyscan succeeded)"
  ansible.builtin.set_fact:
    mailcatcher_traefik_reachable: >-
      {{ (mailcatcher_traefik_keyscan.rc | default(1)) == 0
         and ((mailcatcher_traefik_keyscan.stdout | default('') | trim | length) > 0) }}
- name: "Clean-Slate | Append the Traefik guest host key to known_hosts (only when reachable)"
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.ssh/known_hosts"
    create: true
    mode: "0600"
    marker: "# {mark} mailcatcher clean-slate Traefik guest key for {{ mailcatcher_traefik_guest_host }}"
    block: "{{ mailcatcher_traefik_keyscan.stdout }}"
  when: mailcatcher_traefik_reachable | bool
- name: "Clean-Slate | Register the Traefik guest for the orchestrator-context delegation"
  ansible.builtin.add_host:
    name: mailcatcher-traefik-route-cleanup
    ansible_host: "{{ mailcatcher_traefik_guest_host }}"
    ansible_user: "{{ mailcatcher_traefik_guest_user | default('root') }}"
    ansible_python_interpreter: "{{ mailcatcher_traefik_guest_python | default('/usr/bin/python3') }}"
    ansible_connection: ssh
  changed_when: false
  when: mailcatcher_traefik_reachable | bool
- name: "Clean-Slate | Remove the delegated web-UI Route_Fragment from the Traefik guest"
  ansible.builtin.file:
    path: "{{ mailcatcher_traefik_dynamic_config_dir }}/mailcatcher-route.yml"
    state: absent
  delegate_to: mailcatcher-traefik-route-cleanup
  register: mailcatcher_route_removed
  when: mailcatcher_traefik_reachable | default(true) | bool
  failed_when:
    - mailcatcher_route_removed is failed
    - "'unreachable' not in (mailcatcher_route_removed.msg | default('') | lower)"
- name: "Clean-Slate | INFO — web-UI Route_Fragment removal outcome"
  ansible.builtin.debug:
    msg: >-
      {{ ('mailcatcher Route_Fragment removal SKIPPED: the Traefik guest is unreachable '
          ~ '(full teardown — the fragment dies with that guest).')
         if not (mailcatcher_traefik_reachable | bool)
         else 'mailcatcher Route_Fragment removed (or already absent) from the Traefik guest.' }}
  changed_when: false

# ---- Verification gate (empty baseline, two ways) ---------------------------
- name: "Clean-Slate | VERIFY — list any surviving Mail catcher container on the host (pct list)"
  ansible.builtin.command:
    argv:
      - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible"
      - proxmox
      - -i
      - "{{ mailcatcher_proxmox_host_inventory }}"
      - --extra-vars
      - "ansible_host={{ mailcatcher_proxmox_host }}"
      - -m
      - ansible.builtin.command
      - -a
      - "pct list"
  args:
    chdir: "{{ mailcatcher_repo_root }}"
  register: mailcatcher_pct_list
  changed_when: false
  failed_when: false

- name: "Clean-Slate | Compute the set of surviving Mail catcher container VMIDs"
  ansible.builtin.set_fact:
    mailcatcher_surviving_vmids: >-
      {{ [mailcatcher_vmid | string]
         | select('in', (mailcatcher_pct_list.stdout | default('')))
         | list }}

# Zero RESOURCES of ANY kind in the Mail catcher Terraform state. The child
# clean-slate.yml run above already `pct destroy`'d the mailcatcher guest and
# `terraform state rm`'d its container address. But the Mail catcher root also carries
# NON-guest `terraform_data` book-keeping resources that manage no live Proxmox
# object — the root-level ledger-drift guard (`terraform_data.ledger_index_assert`)
# and `module.mailcatcher.terraform_data.input_guards` — which the container-only
# state rm leaves behind (the residue bug, spec
# fix-svc07-clean-slate-terraform-data-residue). A correct clean-slate must leave
# `terraform state list` EMPTY. So, PROVIDER-FREE, enumerate every remaining
# ADDRESS and `terraform state rm` it (NOT `terraform destroy` — that would
# contact the provider and risk a hang / stale lock, Req 2.5). All ops run on
# the CONTROL NODE (state lives there).
- name: "Clean-Slate | List ALL remaining addresses in the Mail catcher Terraform state (residue sweep)"
  ansible.builtin.command:
    argv:
      - terraform
      - state
      - list
  args:
    chdir: "{{ mailcatcher_tf_root }}"
  register: mailcatcher_residual_state_list
  changed_when: false
  failed_when: false

- name: "Clean-Slate | Compute the residual (non-guest terraform_data) addresses to remove"
  ansible.builtin.set_fact:
    mailcatcher_residual_state_addrs: >-
      {{ (mailcatcher_residual_state_list.stdout | default('')).splitlines()
         | map('trim') | select('ne', '') | list }}

- name: "Clean-Slate | Remove ALL remaining state addresses provider-free (terraform state rm)"
  ansible.builtin.command:
    argv:
      - terraform
      - state
      - rm
      - "{{ item }}"
  args:
    chdir: "{{ mailcatcher_tf_root }}"
  loop: "{{ mailcatcher_residual_state_addrs }}"
  loop_control:
    label: "{{ item }}"
  register: mailcatcher_residual_state_rm
  changed_when: "'Removed' in (mailcatcher_residual_state_rm.stdout | default(''))"
  failed_when:
    - (mailcatcher_residual_state_rm.rc | default(1)) != 0
    - "'No matching objects' not in (mailcatcher_residual_state_rm.stdout | default(''))"
    - "'No matching objects' not in (mailcatcher_residual_state_rm.stderr | default(''))"

- name: "Clean-Slate | VERIFY — list the FULL Mail catcher Terraform state after the residue sweep"
  ansible.builtin.command:
    argv:
      - terraform
      - state
      - list
  args:
    chdir: "{{ mailcatcher_tf_root }}"
  register: mailcatcher_state_list
  changed_when: false
  failed_when: false

- name: "Clean-Slate | Compute the set of surviving Mail catcher state addresses (FULL state)"
  ansible.builtin.set_fact:
    mailcatcher_surviving_state_addrs: >-
      {{ (mailcatcher_state_list.stdout | default('')).splitlines()
         | map('trim') | select('ne', '') | list }}

- name: "Clean-Slate | GATE — assert an empty baseline (0 containers, 0 state), Req 2.2"
  ansible.builtin.assert:
    that:
      - "(mailcatcher_surviving_vmids | length) == 0"
      - "(mailcatcher_surviving_state_addrs | length) == 0"
    fail_msg: >-
      Clean-Slate reset did NOT reach an empty baseline. Surviving Mail catcher
      container(s): {{ mailcatcher_surviving_vmids | default([]) | join(', ') | default('none', true) }};
      surviving Terraform state address(es):
      {{ mailcatcher_surviving_state_addrs | default([]) | join(', ') | default('none', true) }}.
      Investigate on the Proxmox host / in Terraform state and re-run the reset
      until both are empty before re-installing.
    success_msg: >-
      Clean-Slate reset complete — zero Mail catcher containers on the host and an
      EMPTY Mail catcher Terraform state (guest + non-guest terraform_data resources
      all removed).

- name: "Clean-Slate | Report the reset completed to an empty baseline"
  ansible.builtin.debug:
    msg: >-
      Mail catcher Clean-Slate reset complete: the mailcatcher container
      ({{ mailcatcher_vmid }}) destroyed (or already absent) and removed from
      Terraform state. The baseline is empty; a fresh install can now run.
