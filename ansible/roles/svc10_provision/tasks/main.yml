---
# tasks/main.yml — svc10_provision (SVC-10 DNS installer — Phase 2: Provision)
#
# Clone of svc07_provision adapted for the svc10 single-guest root:
#   - backend swap-gate (GitLab HTTP when all three CI keys present, else
#     local_backend_override.tf) with its single INFO decision log,
#   - terraform init / apply (Proxmox creds via TF_VAR_* env, no_log),
#   - generate_inventory.py + existence assert,
#   - add_host of the single svc10 guest,
#   - ssh-keygen -R + ssh-keyscan known_hosts reconciliation.
#
# NOTE (agent-live meta-guard): this role runs `terraform apply` (a destructive
# marker) but is LEAF-EXEMPT in test_agent_live_wiring_coverage.py exactly like
# svc07_provision — the throwaway-guard consult is carried UPSTREAM by
# svc10_preflight (Phase 1 runs before Phase 2 in the same play).

# --- Backend swap-gate selection --------------------------------------------
- name: "Provisioning | Read the cluster env file to detect the state-backend signal"
  ansible.builtin.slurp:
    src: "{{ svc10_repo_root }}/{{ cluster_env_file }}"
  register: svc10_env_slurp
  no_log: true

- name: "Provisioning | Reduce the env file to KEY=VALUE lines"
  ansible.builtin.set_fact:
    svc10_env_pairs: >-
      {{ (svc10_env_slurp.content | b64decode).splitlines()
         | map('trim')
         | reject('match', '^\s*#')
         | select('search', '=')
         | list }}
  no_log: true

- name: "Provisioning | Extract the set of env keys (names only, no values)"
  ansible.builtin.set_fact:
    svc10_env_keys: >-
      {{ svc10_env_pairs
         | map('regex_replace', '^\s*([^=]+?)\s*=.*$', '\1')
         | list }}

- name: "Provisioning | Decide the Terraform backend (swap gate)"
  ansible.builtin.set_fact:
    svc10_use_gitlab_backend: >-
      {{ ('CI_API_V4_URL' in svc10_env_keys)
         and ('CI_PROJECT_ID' in svc10_env_keys)
         and ('CI_JOB_TOKEN' in svc10_env_keys) }}

- name: "Provisioning | Extract GitLab CI state-backend values (GitLab backend only)"
  ansible.builtin.set_fact:
    svc10_env_ci_values: >-
      {{ dict(svc10_env_keys | zip(
           svc10_env_pairs
           | map('regex_replace', '^[^=]+=\s*(.*?)\s*$', '\1')
           | map('regex_replace', '^"(.*)"$', '\1')
           | list
         )) }}
  when: svc10_use_gitlab_backend | bool
  no_log: true

- name: "Provisioning | Derive the GitLab state address + job token (GitLab backend only)"
  ansible.builtin.set_fact:
    svc10_env_gitlab_state_address: >-
      {{ svc10_env_ci_values['CI_API_V4_URL'] }}/projects/{{
         svc10_env_ci_values['CI_PROJECT_ID'] }}/terraform/state/svc-10-internal-dns
    svc10_env_ci_job_token: "{{ svc10_env_ci_values['CI_JOB_TOKEN'] }}"
  when: svc10_use_gitlab_backend | bool
  no_log: true

- name: "Provisioning | Log the Terraform backend selection (INFO)"
  ansible.builtin.debug:
    msg: >-
      INFO: Terraform backend:
      {{ 'GitLab HTTP state (svc-10-internal-dns) — the Cluster_Env_File '
         ~ 'configures the GitLab CI state-backend variables'
         if (svc10_use_gitlab_backend | bool)
         else 'LOCAL (local_backend_override.tf) — the Cluster_Env_File does not '
              ~ 'configure the GitLab HTTP backend (solo/offline Developer-B default)' }}

- name: "Provisioning | Ensure local_backend_override.tf is present (local backend)"
  ansible.builtin.copy:
    dest: "{{ svc10_tf_root }}/local_backend_override.tf"
    mode: "0644"
    content: |
      # Local, gitignored state backend for a solo/offline apply — overrides the
      # root's partial backend "http" {}. Never committed (.gitignore: *_override.tf).
      terraform {
        backend "local" {}
      }
  when: not (svc10_use_gitlab_backend | bool)

- name: "Provisioning | Remove any local_backend_override.tf (GitLab HTTP backend)"
  ansible.builtin.file:
    path: "{{ svc10_tf_root }}/local_backend_override.tf"
    state: absent
  when: svc10_use_gitlab_backend | bool

- name: "Provisioning | terraform init (local backend)"
  ansible.builtin.command:
    argv:
      - terraform
      - init
      - -input=false
      - -reconfigure
  args:
    chdir: "{{ svc10_tf_root }}"
  environment: "{{ svc10_tf_env }}"
  register: svc10_tf_init_local
  changed_when: "'Installing ' in (svc10_tf_init_local.stdout | default(''))"
  when: not (svc10_use_gitlab_backend | bool)
  no_log: true

- name: "Provisioning | terraform init (GitLab HTTP backend)"
  ansible.builtin.command:
    argv:
      - terraform
      - init
      - -input=false
      - -reconfigure
      - "-backend-config=address={{ svc10_env_gitlab_state_address }}"
      - "-backend-config=lock_address={{ svc10_env_gitlab_state_address }}/lock"
      - "-backend-config=unlock_address={{ svc10_env_gitlab_state_address }}/lock"
      - -backend-config=username=gitlab-ci-token
      - "-backend-config=password={{ svc10_env_ci_job_token }}"
      - -backend-config=lock_method=POST
      - -backend-config=unlock_method=DELETE
      - -backend-config=retry_wait_min=5
  args:
    chdir: "{{ svc10_tf_root }}"
  environment: "{{ svc10_tf_env }}"
  register: svc10_tf_init_gitlab
  changed_when: "'Installing ' in (svc10_tf_init_gitlab.stdout | default(''))"
  when: svc10_use_gitlab_backend | bool
  no_log: true

# --- guest-variable assembly + non-interactive apply ------------------------
- name: "Provisioning | Assert all required guest variables are present (before apply)"
  ansible.builtin.assert:
    that:
      - "svc10_proxmox_node_name is defined and (svc10_proxmox_node_name | trim | length > 0)"
      - "svc10_template_file_id is defined and (svc10_template_file_id | trim | length > 0)"
      - "svc10_datastore_id is defined and (svc10_datastore_id | trim | length > 0)"
      - "svc10_datastore_id != svc10_autodetect_sentinel"
      - "svc10_vmid is defined"
    fail_msg: >-
      A required guest variable is absent or empty; refusing to run
      `terraform apply` so no Proxmox resource is created. Required:
      proxmox_node_name, svc10_template_file_id, a resolved
      svc10_datastore_id (not the auto-detect sentinel), svc10_vmid.
    success_msg: "All required guest variables are present; proceeding to terraform apply."

- name: "Provisioning | terraform apply (non-interactive, auto-approve)"
  ansible.builtin.command:
    argv:
      - terraform
      - apply
      - -input=false
      - -auto-approve
      - "-var=proxmox_node_name={{ svc10_proxmox_node_name }}"
      - "-var=svc10_vmid={{ svc10_vmid }}"
      - "-var=svc10_template_file_id={{ svc10_template_file_id }}"
      - "-var=svc10_datastore_id={{ svc10_datastore_id }}"
  args:
    chdir: "{{ svc10_tf_root }}"
  environment: "{{ svc10_tf_env }}"
  register: svc10_tf_apply
  changed_when: "'0 added, 0 changed, 0 destroyed' not in svc10_tf_apply.stdout"
  no_log: true

# --- inventory generation + refresh handoff ---------------------------------
- name: "Provisioning | Generate the Ansible inventory from Terraform outputs"
  ansible.builtin.command:
    argv:
      - "{{ svc10_venv_python }}"
      - ansible/inventory/generate_inventory.py
      - --root
      - infra/projects/svc-10-internal-dns
      - --out
      - "{{ svc10_generated_inventory }}"
  args:
    chdir: "{{ svc10_repo_root }}"
  register: svc10_gen_inventory
  changed_when: "'inventory unchanged' not in (svc10_gen_inventory.stderr | default(''))"

- name: "Provisioning | Confirm the generated inventory file was written"
  ansible.builtin.stat:
    path: "{{ svc10_repo_root }}/{{ svc10_generated_inventory }}"
  register: svc10_generated_inventory_stat

- name: "Provisioning | Assert the generated inventory exists (else halt before Bootstrap)"
  ansible.builtin.assert:
    that:
      - "svc10_generated_inventory_stat.stat.exists"
    fail_msg: >-
      generate_inventory.py did not produce {{ svc10_generated_inventory }};
      halting before the Bootstrap phase and leaving the provisioned guest in
      place.
    success_msg: "Generated inventory present: {{ svc10_generated_inventory }}."

- name: "Provisioning | add_host the svc10 guest into the in-memory inventory"
  ansible.builtin.add_host:
    name: svc10-20-01
    groups:
      - dns
    # cidrhost("10.0.20.0/24", 10 + 15) = 10.0.20.25 — host_index 15 per the
    # ADR-0015 host-index ledger (infra/platform-foundation/host-indices.yaml).
    # Carried as a literal here, matching the sibling bootstraps (the Terraform
    # root derives it; the Ansible layer carries the computed IP as a constant).
    ansible_host: "10.0.20.25"
    ansible_user: root
    ansible_connection: ssh
  changed_when: false

# --- SSH known_hosts reconciliation -----------------------------------------
- name: "Provisioning | Ensure ~/.ssh exists (0700)"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: "Provisioning | ssh-keyscan the guest IP and refresh known_hosts (known_hosts_refresh)"
  ansible.builtin.include_role:
    name: known_hosts_refresh
  vars:
    khr_ips: "{{ svc10_guest_ips }}"
    khr_marker_prefix: "# {mark} SVC-10 DNS installer host keys for "
