---
# tasks/main.yml — svc10_preflight (SVC-10 DNS installer — Phase 1: Preflight)
#
# Phase-1 "Preflight & environment validation". A failure here leaves ZERO
# Proxmox resources and unmodified TF state. Clone of svc07_preflight adapted for
# the svc10 single-guest root (one guest IP, svc10 TF_VAR names).
#
# Owns: cluster_env.py resolve + validate (no_log), TF_VAR_* binding, endpoint
# canonical-base normalization, agent-live throwaway-guard consult (gated),
# operator SSH-public-key injection + INFO decision log, Proxmox /version
# reachability + auth, VLAN-20 `p20` SDN VNet check, datastore autodetect, local
# prereq/version checks. Publishes the facts consumed by svc10_provision.

# --- Env-file load + validation (delegates to cluster_env.py) ---------------
- name: "Preflight | Control-node route to the platform VLAN(s) goes via the Proxmox host (WS-C64)"
  ansible.builtin.include_role:
    name: control_route_check
  vars:
    crc_vlans: [20]
- name: "Preflight | Resolve + validate the cluster env file ({{ cluster_env_file }})"
  ansible.builtin.command:
    argv:
      - "{{ svc10_venv_python }}"
      - "{{ svc10_cluster_env_helper }}"
      - "--env-file"
      - "{{ cluster_env_file }}"
  args:
    chdir: "{{ svc10_repo_root }}"
  register: svc10_env_resolve
  changed_when: false
  no_log: true

- name: "Preflight | Capture the resolved TF_VAR_* mapping for Phase 2"
  ansible.builtin.set_fact:
    svc10_tfvars: "{{ svc10_env_resolve.stdout | from_json }}"
  no_log: true

# The LXC template + datastore are CLUSTER-WIDE facts (every service boots the
# same stock Debian template on the same datastore), so cluster_env.py resolves
# them under the shared canonical keys TF_VAR_openbao_template_file_id /
# TF_VAR_openbao_datastore_id (the schema's generic "LXC template" / "Datastore"
# rows — not OpenBao-specific despite the historical key name). svc10 consumes
# those shared keys here and remaps them onto the svc10 root's own var names
# (svc10_template_file_id / svc10_datastore_id) in svc10_tf_env. This keeps
# the shared cluster_env.py contract UNCHANGED (no per-service key added).
- name: "Preflight | Bind resolved cluster parameters to named facts"
  ansible.builtin.set_fact:
    svc10_proxmox_endpoint: "{{ svc10_tfvars['TF_VAR_proxmox_endpoint'] }}"
    svc10_proxmox_api_token: "{{ svc10_tfvars['TF_VAR_proxmox_api_token'] }}"
    svc10_proxmox_node_name: "{{ svc10_tfvars['TF_VAR_proxmox_node_name'] }}"
    svc10_template_file_id: "{{ svc10_tfvars['TF_VAR_openbao_template_file_id'] }}"
    svc10_datastore_id: "{{ svc10_tfvars['TF_VAR_openbao_datastore_id'] }}"
  no_log: true

# The operator's admin CIDR (ADMIN_SOURCE_CIDR, optional) may also reach the pdns API
# (FR-5: the control node). Non-secret; an explicit -e svc10_admin_source_cidr wins.
- name: "Preflight | Bind the optional admin source CIDR for the API firewall"
  ansible.builtin.set_fact:
    svc10_admin_source_cidr: "{{ svc10_tfvars['TF_VAR_sdn_gateway_admin_source_cidr'] | default('') | trim }}"
  when: svc10_admin_source_cidr is not defined or (svc10_admin_source_cidr | trim | length) == 0

- name: "Preflight | Assert the admin source CIDR is a CIDR when set"
  ansible.builtin.assert:
    that:
      - >-
        (svc10_admin_source_cidr | length) == 0
        or svc10_admin_source_cidr is match('^([0-9]{1,3}\.){3}[0-9]{1,3}(/[0-9]{1,2})?$')
    fail_msg: >-
      ADMIN_SOURCE_CIDR in {{ cluster_env_file }} ('{{ svc10_admin_source_cidr }}') is not
      a CIDR (e.g. 192.0.2.0/24). Fix it or remove it; nothing was provisioned.
    quiet: true

# Normalize the resolved endpoint to a canonical base URL ONCE, before the
# preflight uri tasks append /api2/json and before Phase 2 hands it to the
# bpg/proxmox provider. Mirrors scripts/installer/endpoint.py::canonical_base
# (pinned by tests/installer/test_endpoint.py) — keep the chain in sync.
- name: "Preflight | Normalize Proxmox endpoint to a canonical base"
  ansible.builtin.set_fact:
    svc10_proxmox_endpoint_base: >-
      {{ svc10_proxmox_endpoint | trim
         | regex_replace('/+$', '')
         | regex_replace('/api2/json$', '')
         | regex_replace('/+$', '') }}

# --- OpenBao admin token (R6): the cluster secrets live ONLY in OpenBao -------
# Resolved from the process environment first, else the cluster env file (the
# WS-C45 convention). There is no offline mode: without OpenBao the API key could not be
# persisted, and a re-run would rotate it under SVC-08's DNS-01 client.
- name: "Preflight | Slurp the cluster env file for the OpenBao admin token (no_log)"
  ansible.builtin.slurp:
    src: >-
      {{ (svc10_repo_root ~ '/' ~ cluster_env_file)
         if (cluster_env_file is not match('^/')) else cluster_env_file }}
  register: svc10_cluster_env_slurp
  no_log: true

- name: "Preflight | Resolve the OpenBao admin token (process env first, else the cluster env file) (no_log)"
  ansible.builtin.set_fact:
    svc10_openbao_admin_token: >-
      {{ (lookup('ansible.builtin.env', 'OPENBAO_ADMIN_TOKEN') | default('', true) | trim)
         if ((lookup('ansible.builtin.env', 'OPENBAO_ADMIN_TOKEN') | default('', true) | trim) | length > 0)
         else ((svc10_cluster_env_slurp.content | b64decode
                 | regex_findall('(?m)^[ \t]*OPENBAO_ADMIN_TOKEN[ \t]*=[ \t]*[\"\']?([^\"\'\r\n]*?)[\"\']?[ \t]*$')
                 | first | default('') | trim)) }}
    svc10_openbao_token_from_env: >-
      {{ (lookup('ansible.builtin.env', 'OPENBAO_ADMIN_TOKEN') | default('', true) | trim | length) > 0 }}
  no_log: true

- name: "Preflight | Project the admin-token presence + source (non-secret, no value)"
  ansible.builtin.set_fact:
    svc10_openbao_token_present: "{{ (svc10_openbao_admin_token | default('') | trim | length) > 0 }}"
    svc10_openbao_token_source: >-
      {{ 'none'
         if ((svc10_openbao_admin_token | default('') | trim | length) == 0)
         else ('process-env' if (svc10_openbao_token_from_env | bool) else 'cluster-env-file') }}
  no_log: true
  changed_when: false

- name: "Preflight | INFO — OpenBao admin-token resolution source (never the value)"
  ansible.builtin.debug:
    msg: >-
      INFO: OpenBao admin-token resolution source = {{ svc10_openbao_token_source }}
      — the token value is never echoed.

- name: "Preflight | Fail closed when no OpenBao admin token is resolvable (R6)"
  ansible.builtin.assert:
    that:
      - svc10_openbao_token_present | bool
    fail_msg: >-
      SVC-10 stores the PowerDNS API key in OpenBao
      (secret/proj-shared-dns/pdns) and needs the OpenBao admin token to read
      or seed it. None was found in the environment or in {{ cluster_env_file }}.
      Remedy: bring SVC-07 up (ansible/playbooks/svc-07-bootstrap.yml, which writes
      OPENBAO_ADMIN_TOKEN to the cluster env file) or set OPENBAO_ADMIN_TOKEN in
      {{ cluster_env_file }}. Nothing was provisioned.
    success_msg: "OpenBao admin token resolved for the PowerDNS API-key seed/read."
    quiet: true

# =========================================================== #
# Agent Live-Test Authorization guard consult (gated).         #
# ----------------------------------------------------------- #
# All three tasks are `when: agent_live_run` — an ordinary      #
# operator run (AGENT_LIVE_AUTHORIZED unset) skips them and is  #
# byte-for-byte unchanged. FAIL-CLOSED, BEFORE ANY PROXMOX CALL:#
# positioned after the cluster-env resolve but before the first #
# /version call, so an armed from-scratch run against a NON-    #
# allowlisted identity is REFUSED before any Proxmox resource   #
# is touched or queried. Same three-task consult pattern as     #
# svc07_preflight / svc07_clean_slate (the reference wiring the  #
# agent-live meta-drift-guard enforces for every service).     #
# =========================================================== #
- name: "Preflight | Consult the throwaway-cluster authorization guard (Agent_Live_Run only)"
  ansible.builtin.command:
    argv:
      - "{{ svc10_venv_python }}"
      - "{{ svc10_throwaway_guard }}"
      - --service
      - svc10
      - --env-file
      - "{{ cluster_env_file }}"
      - --allowlist
      - "{{ svc10_throwaway_allowlist }}"
  args:
    chdir: "{{ svc10_repo_root }}"
  register: svc10_throwaway_decision
  changed_when: false
  failed_when: false
  when: agent_live_run | default(false) | bool

- name: "Preflight | INFO — agent-live authorization decision"
  ansible.builtin.debug:
    msg: >-
      INFO: agent-live authorization:
      {{ (svc10_throwaway_decision.stdout | default('{}') | from_json).reason
         | default('guard produced no decision') }}
  when: agent_live_run | default(false) | bool

- name: "Preflight | Refuse the from-scratch run unless the throwaway guard AUTHORIZED it"
  ansible.builtin.assert:
    that:
      - "svc10_throwaway_decision.rc == 0"
    fail_msg: >-
      Agent-live from-scratch run REFUSED by the throwaway-cluster guard:
      {{ (svc10_throwaway_decision.stdout | default('{}') | from_json).reason
         | default('guard produced no decision') }}.
      Nothing was provisioned and no Proxmox resource was touched or queried.
      Arm the run only against a throwaway cluster listed in
      throwaway-clusters.yml with AGENT_LIVE_AUTHORIZED set.
    success_msg: "Throwaway-cluster guard AUTHORIZED the agent-live from-scratch run."
  when: agent_live_run | default(false) | bool

# --- Operator SSH public-key injection (feed TF_VAR_operator_ssh_public_keys) -
- name: "Preflight | Bind + expanduser the operator SSH public-key file path (may be absent)"
  ansible.builtin.set_fact:
    svc10_ssh_public_key_file: >-
      {{ (svc10_tfvars['TF_VAR_operator_ssh_public_key_file'] | default('') | trim) | expanduser }}

- name: "Preflight | Stat the operator SSH public-key file (only when a path is set)"
  ansible.builtin.stat:
    path: "{{ svc10_ssh_public_key_file }}"
  register: svc10_ssh_public_key_stat
  when: (svc10_ssh_public_key_file | length) > 0

- name: "Preflight | Assert the operator SSH public-key file exists + is readable (fail-fast)"
  ansible.builtin.assert:
    that:
      - "svc10_ssh_public_key_stat.stat.exists | default(false)"
      - "svc10_ssh_public_key_stat.stat.readable | default(false)"
    fail_msg: >-
      The operator SSH public-key file '{{ svc10_ssh_public_key_file }}'
      (PROXMOX_SSH_PUBLIC_KEY_FILE / TF_VAR_operator_ssh_public_key_file in
      {{ cluster_env_file }}) does not exist or is not readable. Supply a path to
      your PUBLIC key file (e.g. ~/.ssh/id_ed25519.pub) — PUBLIC key only, never a
      private key — or leave it unset to provision the svc10 LXC without an
      authorized key (it will be SSH-unreachable).
    success_msg: "Operator SSH public-key file present + readable: {{ svc10_ssh_public_key_file }}"
  when: (svc10_ssh_public_key_file | length) > 0

- name: "Preflight | Read + JSON-encode the operator SSH public key into a 1-element list"
  ansible.builtin.set_fact:
    svc10_operator_ssh_public_keys_json: >-
      {{ [lookup('ansible.builtin.file', svc10_ssh_public_key_file) | trim] | to_json }}
  when: (svc10_ssh_public_key_file | length) > 0

- name: "Preflight | Default the operator SSH public-key list to empty when no path is set"
  ansible.builtin.set_fact:
    svc10_operator_ssh_public_keys_json: "[]"
  when: (svc10_ssh_public_key_file | length) == 0

- name: "Preflight | Log the SSH public-key injection decision (INFO)"
  ansible.builtin.debug:
    msg: >-
      INFO: operator SSH public-key injection:
      {{ 'WIRED from ' ~ svc10_ssh_public_key_file
         ~ ' -> TF_VAR_operator_ssh_public_keys (1 key; applied at guest CREATION only)'
         if (svc10_ssh_public_key_file | length) > 0
         else 'NONE (PROXMOX_SSH_PUBLIC_KEY_FILE unset -> empty [] list -> the svc10 LXC will be '
              ~ 'SSH-unreachable; supply a .pub path to enable Ansible reachability)' }}

# --- Proxmox reachability, auth, p20 bridge, datastore autodetect ------------
- name: "Preflight | Verify Proxmox API reachability + authentication (/version)"
  ansible.builtin.uri:
    url: "{{ svc10_proxmox_endpoint_base }}/api2/json/version"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ svc10_proxmox_api_token }}"
    timeout: 30
    validate_certs: "{{ svc10_proxmox_validate_certs }}"
    status_code: [200]
  register: svc10_proxmox_version
  changed_when: false
  no_log: true

- name: "Preflight | List Proxmox SDN VNets (verify VLAN-20 fabric)"
  ansible.builtin.uri:
    url: "{{ svc10_proxmox_endpoint_base }}/api2/json/cluster/sdn/vnets"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ svc10_proxmox_api_token }}"
    timeout: 30
    validate_certs: "{{ svc10_proxmox_validate_certs }}"
    status_code: [200]
  register: svc10_sdn_vnets
  changed_when: false
  no_log: true

- name: "Preflight | Extract the set of SDN VNet ids (non-secret)"
  ansible.builtin.set_fact:
    svc10_vnet_ids: >-
      {{ svc10_sdn_vnets.json.data | map(attribute='vnet') | list }}

- name: "Preflight | Assert the p20 VLAN-20 bridge exists"
  ansible.builtin.assert:
    that:
      - "'p20' in svc10_vnet_ids"
    fail_msg: >-
      The VLAN-20 bridge 'p20' is absent from the Proxmox SDN VNets
      ({{ svc10_vnet_ids }}). Apply the platform-foundation root first to create
      the VLAN-20 fabric, then re-run this installer.
    success_msg: "VLAN-20 bridge 'p20' is present."

# WS-C10 (P3, committed != realized): the assert above only proves the VNet is in the SDN CONFIG.
# Verify it is REALIZED as a live bridge on the target node before any guest is placed on it.
- name: "Preflight | Verify the VNet is REALIZED as a live bridge on the node (WS-C10)"
  ansible.builtin.include_role:
    name: sdn_vnet_realized
  vars:
    sdn_vnet_realized_endpoint: "{{ svc10_proxmox_endpoint_base }}"
    sdn_vnet_realized_token: "{{ svc10_proxmox_api_token }}"
    sdn_vnet_realized_validate_certs: "{{ svc10_proxmox_validate_certs }}"
    sdn_vnet_realized_node: "{{ svc10_proxmox_node_name }}"
    sdn_vnet_realized_vnet: "p20"
    sdn_vnet_realized_vnets: "{{ svc10_sdn_vnets.json.data }}"
- name: "Preflight | Query target-node storage (only when datastore unset)"
  ansible.builtin.uri:
    url: >-
      {{ svc10_proxmox_endpoint_base }}/api2/json/nodes/{{ svc10_proxmox_node_name }}/storage
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ svc10_proxmox_api_token }}"
    timeout: 30
    validate_certs: "{{ svc10_proxmox_validate_certs }}"
    status_code: [200]
  register: svc10_node_storage
  changed_when: false
  no_log: true
  when: svc10_datastore_id == svc10_autodetect_sentinel

- name: "Preflight | Extract available storage ids on the target node (non-secret)"
  ansible.builtin.set_fact:
    svc10_node_storage_ids: >-
      {{ svc10_node_storage.json.data | map(attribute='storage') | list }}
  when: svc10_datastore_id == svc10_autodetect_sentinel

- name: "Preflight | Auto-select datastore (local-zfs preferred, else local-lvm)"
  ansible.builtin.set_fact:
    svc10_datastore_id: >-
      {{ 'local-zfs' if 'local-zfs' in svc10_node_storage_ids
         else ('local-lvm' if 'local-lvm' in svc10_node_storage_ids
         else svc10_autodetect_sentinel) }}
  when: svc10_datastore_id == svc10_autodetect_sentinel

- name: "Preflight | Assert a datastore was resolved or auto-detected"
  ansible.builtin.assert:
    that:
      - "svc10_datastore_id != svc10_autodetect_sentinel"
    fail_msg: >-
      No datastore was configured and neither 'local-zfs' nor 'local-lvm' is
      available on node '{{ svc10_proxmox_node_name }}' (found:
      {{ svc10_node_storage_ids | default([]) }}). Set the datastore variable
      explicitly (PROXMOX_DATASTORE_ID or TF_VAR_svc10_datastore_id) in
      {{ cluster_env_file }} and re-run this installer.
    success_msg: "Datastore resolved to '{{ svc10_datastore_id }}'."

# --- Local control-node prerequisite + version checks ------------------------
- name: "Preflight | Locate the terraform binary on PATH"
  ansible.builtin.command:
    cmd: terraform version
  register: svc10_terraform_version
  changed_when: false
  failed_when: svc10_terraform_version.rc != 0

- name: "Preflight | List installed Ansible collections"
  ansible.builtin.command:
    cmd: ansible-galaxy collection list --format json
  register: svc10_galaxy_list
  changed_when: false
  failed_when: svc10_galaxy_list.rc != 0

- name: "Preflight | Compute the set of installed collection names"
  ansible.builtin.set_fact:
    svc10_installed_collections: >-
      {{ (svc10_galaxy_list.stdout | from_json).values()
         | map('list') | flatten | unique | list }}

- name: "Preflight | Assert the required Ansible collections are installed"
  ansible.builtin.assert:
    that:
      - "item in svc10_installed_collections"
    fail_msg: >-
      Required Ansible collection '{{ item }}' is not installed. Install the
      platform collections with:
      ansible-galaxy collection install -r ansible/requirements.yml
    success_msg: "Ansible collection '{{ item }}' is installed."
  loop: "{{ svc10_required_collections }}"

- name: "Preflight | Assert the project venv binaries are present"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: svc10_venv_bin_stat
  loop: "{{ svc10_required_venv_binaries }}"

- name: "Preflight | Fail naming any missing venv binary"
  ansible.builtin.assert:
    that:
      - "item.stat.exists"
      - "item.stat.executable | default(false)"
    fail_msg: >-
      Required project venv binary is missing or not executable: {{ item.item }}.
      Create/repair the devinfra virtualenv (~/venv/devinfra/) before running
      this installer.
    success_msg: "venv binary present: {{ item.item }}"
  loop: "{{ svc10_venv_bin_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: "Preflight | Assert Python >= 3.10 on the control node"
  ansible.builtin.assert:
    that:
      - "ansible_python_version is version('3.10', '>=')"
    fail_msg: >-
      Detected Python {{ ansible_python_version }}, but this installer requires
      Python 3.10 or later.
    success_msg: "Python {{ ansible_python_version }} satisfies >= 3.10."

- name: "Preflight | Assert Ansible >= 2.15 on the control node"
  ansible.builtin.assert:
    that:
      - "ansible_version.full is version('2.15', '>=')"
    fail_msg: >-
      Detected Ansible {{ ansible_version.full }}, but this installer requires
      Ansible 2.15 or later.
    success_msg: "Ansible {{ ansible_version.full }} satisfies >= 2.15."
