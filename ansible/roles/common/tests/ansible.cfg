# Ansible config for the `common` role's offline dry-run smoke test
# (spec lxc-docker-base-template, task 4.2, requirement 7.2).
#
# Sole purpose: put the repository's `ansible/roles/` directory on the role
# search path so `tests/test.yml` can resolve `- role: common` when run from this
# tests/ directory. `../..` from ansible/roles/common/tests/ is ansible/roles/.
# This keeps the smoke test self-contained (no need to pass ANSIBLE_ROLES_PATH on
# the command line) without touching any repo-wide Ansible configuration.
[defaults]
roles_path = ../..
