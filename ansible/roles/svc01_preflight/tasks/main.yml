---
# tasks/main.yml — svc01_preflight (SVC-01 installer — Phase 1: Preflight)
#
# Phase-1 "Preflight & environment validation" for a dedicated-per-project DB.
# A failure here leaves ZERO Proxmox resources. Clone of svc09_preflight, adapted
# for the per-project DB: asserts the PROJECT's SDN VNet p<vlan> exists (not just
# p20), and remaps the shared cluster template/datastore keys onto the SVC-01
# root's var names.

# --- Env-file load + validation (cluster_env.py) ----------------------------
- name: "Preflight | Resolve + validate the cluster env file ({{ cluster_env_file }})"
  ansible.builtin.command:
    argv:
      - "{{ svc01_venv_python }}"
      - "{{ svc01_cluster_env_helper }}"
      - "--env-file"
      - "{{ cluster_env_file }}"
  args:
    chdir: "{{ svc01_repo_root }}"
  register: svc01_env_resolve
  changed_when: false
  no_log: true

- name: "Preflight | Capture the resolved TF_VAR_* mapping for Phase 2"
  ansible.builtin.set_fact:
    svc01_tfvars: "{{ svc01_env_resolve.stdout | from_json }}"
  no_log: true

# The LXC template + datastore are CLUSTER-WIDE facts (shared keys
# TF_VAR_openbao_template_file_id / TF_VAR_openbao_datastore_id — the generic
# schema rows, not OpenBao-specific). svc01 remaps them onto the SVC-01 root's
# var names (svc01_template_file_id / svc01_datastore_id) in svc01_tf_env. Keeps
# cluster_env.py UNCHANGED (no per-service key added).
- name: "Preflight | Bind resolved cluster parameters to named facts"
  ansible.builtin.set_fact:
    svc01_proxmox_endpoint: "{{ svc01_tfvars['TF_VAR_proxmox_endpoint'] }}"
    svc01_proxmox_api_token: "{{ svc01_tfvars['TF_VAR_proxmox_api_token'] }}"
    svc01_proxmox_node_name: "{{ svc01_tfvars['TF_VAR_proxmox_node_name'] }}"
    svc01_template_file_id: "{{ svc01_tfvars['TF_VAR_openbao_template_file_id'] }}"
    svc01_datastore_id: "{{ svc01_tfvars['TF_VAR_openbao_datastore_id'] }}"
  no_log: true

- name: "Preflight | Normalize Proxmox endpoint to a canonical base"
  ansible.builtin.set_fact:
    svc01_proxmox_endpoint_base: >-
      {{ svc01_proxmox_endpoint | trim
         | regex_replace('/+$', '')
         | regex_replace('/api2/json$', '')
         | regex_replace('/+$', '') }}

# --- Agent-live throwaway-guard consult (gated, fail-closed, before 1st API) --
- name: "Preflight | Consult the throwaway-cluster authorization guard (Agent_Live_Run only)"
  ansible.builtin.command:
    argv:
      - "{{ svc01_venv_python }}"
      - "{{ svc01_throwaway_guard }}"
      - --service
      - svc01
      - --env-file
      - "{{ cluster_env_file }}"
      - --allowlist
      - "{{ svc01_throwaway_allowlist }}"
  args:
    chdir: "{{ svc01_repo_root }}"
  register: svc01_throwaway_decision
  changed_when: false
  failed_when: false
  when: agent_live_run | default(false) | bool

- name: "Preflight | INFO — agent-live authorization decision"
  ansible.builtin.debug:
    msg: >-
      INFO: agent-live authorization:
      {{ (svc01_throwaway_decision.stdout | default('{}') | from_json).reason
         | default('guard produced no decision') }}
  when: agent_live_run | default(false) | bool

- name: "Preflight | Refuse the from-scratch run unless the throwaway guard AUTHORIZED it"
  ansible.builtin.assert:
    that:
      - "svc01_throwaway_decision.rc == 0"
    fail_msg: >-
      Agent-live from-scratch run REFUSED by the throwaway-cluster guard:
      {{ (svc01_throwaway_decision.stdout | default('{}') | from_json).reason
         | default('guard produced no decision') }}.
      Nothing was provisioned and no Proxmox resource was touched or queried.
    success_msg: "Throwaway-cluster guard AUTHORIZED the agent-live from-scratch run."
  when: agent_live_run | default(false) | bool

# --- Operator SSH public-key injection ---------------------------------------
- name: "Preflight | Bind + expanduser the operator SSH public-key file path (may be absent)"
  ansible.builtin.set_fact:
    svc01_ssh_public_key_file: >-
      {{ (svc01_tfvars['TF_VAR_operator_ssh_public_key_file'] | default('') | trim) | expanduser }}

- name: "Preflight | Stat the operator SSH public-key file (only when a path is set)"
  ansible.builtin.stat:
    path: "{{ svc01_ssh_public_key_file }}"
  register: svc01_ssh_public_key_stat
  when: (svc01_ssh_public_key_file | length) > 0

- name: "Preflight | Assert the operator SSH public-key file exists + is readable (fail-fast)"
  ansible.builtin.assert:
    that:
      - "svc01_ssh_public_key_stat.stat.exists | default(false)"
      - "svc01_ssh_public_key_stat.stat.readable | default(false)"
    fail_msg: >-
      The operator SSH public-key file '{{ svc01_ssh_public_key_file }}' does not
      exist or is not readable. Supply a PUBLIC key file path, or leave it unset
      to provision the DB LXC SSH-unreachable.
    success_msg: "Operator SSH public-key file present + readable."
  when: (svc01_ssh_public_key_file | length) > 0

- name: "Preflight | Read + JSON-encode the operator SSH public key into a 1-element list"
  ansible.builtin.set_fact:
    svc01_operator_ssh_public_keys_json: >-
      {{ [lookup('ansible.builtin.file', svc01_ssh_public_key_file) | trim] | to_json }}
  when: (svc01_ssh_public_key_file | length) > 0

- name: "Preflight | Default the operator SSH public-key list to empty when no path is set"
  ansible.builtin.set_fact:
    svc01_operator_ssh_public_keys_json: "[]"
  when: (svc01_ssh_public_key_file | length) == 0

- name: "Preflight | Log the SSH public-key injection decision (INFO)"
  ansible.builtin.debug:
    msg: >-
      INFO: operator SSH public-key injection:
      {{ 'WIRED from ' ~ svc01_ssh_public_key_file
         if (svc01_ssh_public_key_file | length) > 0
         else 'NONE (DB LXC will be SSH-unreachable until a key is supplied)' }}

# --- Proxmox reachability, auth, PROJECT VNet p<vlan>, datastore autodetect ---
- name: "Preflight | Verify Proxmox API reachability + authentication (/version)"
  ansible.builtin.uri:
    url: "{{ svc01_proxmox_endpoint_base }}/api2/json/version"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ svc01_proxmox_api_token }}"
    timeout: 30
    validate_certs: "{{ svc01_proxmox_validate_certs }}"
    status_code: [200]
  register: svc01_proxmox_version
  changed_when: false
  no_log: true

- name: "Preflight | List Proxmox SDN VNets (verify the project VLAN fabric)"
  ansible.builtin.uri:
    url: "{{ svc01_proxmox_endpoint_base }}/api2/json/cluster/sdn/vnets"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ svc01_proxmox_api_token }}"
    timeout: 30
    validate_certs: "{{ svc01_proxmox_validate_certs }}"
    status_code: [200]
  register: svc01_sdn_vnets
  changed_when: false
  no_log: true

- name: "Preflight | Extract the set of SDN VNet ids (non-secret)"
  ansible.builtin.set_fact:
    svc01_vnet_ids: >-
      {{ svc01_sdn_vnets.json.data | map(attribute='vnet') | list }}

# The DB attaches to the PROJECT's VNet p<vlan> — assert it exists. For a
# per-project DB (vlan 100+) the project's own root must have created it; for the
# shared tier (vlan 20) p20 is platform-foundation-owned. Either way, fail closed
# naming the missing VNet rather than provisioning a guest with a dangling NIC.
- name: "Preflight | Assert the project VNet p{{ vlan_id }} exists"
  ansible.builtin.assert:
    that:
      - "('p' ~ vlan_id) in svc01_vnet_ids"
    fail_msg: >-
      The project VNet 'p{{ vlan_id }}' is absent from the Proxmox SDN VNets
      ({{ svc01_vnet_ids }}). For a per-project DB (VLAN 100-254) apply the
      project's own Terraform root first (which creates its VNet); for the shared
      tier (VLAN 20) apply the platform-foundation root. Then re-run this installer.
    success_msg: "Project VNet 'p{{ vlan_id }}' is present."

- name: "Preflight | Query target-node storage (only when datastore unset)"
  ansible.builtin.uri:
    url: "{{ svc01_proxmox_endpoint_base }}/api2/json/nodes/{{ svc01_proxmox_node_name }}/storage"
    method: GET
    headers:
      Authorization: "PVEAPIToken={{ svc01_proxmox_api_token }}"
    timeout: 30
    validate_certs: "{{ svc01_proxmox_validate_certs }}"
    status_code: [200]
  register: svc01_node_storage
  changed_when: false
  no_log: true
  when: svc01_datastore_id == svc01_autodetect_sentinel

- name: "Preflight | Extract available storage ids on the target node (non-secret)"
  ansible.builtin.set_fact:
    svc01_node_storage_ids: >-
      {{ svc01_node_storage.json.data | map(attribute='storage') | list }}
  when: svc01_datastore_id == svc01_autodetect_sentinel

- name: "Preflight | Auto-select datastore (local-zfs preferred, else local-lvm)"
  ansible.builtin.set_fact:
    svc01_datastore_id: >-
      {{ 'local-zfs' if 'local-zfs' in svc01_node_storage_ids
         else ('local-lvm' if 'local-lvm' in svc01_node_storage_ids
         else svc01_autodetect_sentinel) }}
  when: svc01_datastore_id == svc01_autodetect_sentinel

- name: "Preflight | Assert a datastore was resolved or auto-detected"
  ansible.builtin.assert:
    that:
      - "svc01_datastore_id != svc01_autodetect_sentinel"
    fail_msg: >-
      No datastore configured and neither 'local-zfs' nor 'local-lvm' is available
      on node '{{ svc01_proxmox_node_name }}'. Set PROXMOX_DATASTORE_ID in
      {{ cluster_env_file }} and re-run.
    success_msg: "Datastore resolved to '{{ svc01_datastore_id }}'."

# --- Local control-node prerequisite + version checks ------------------------
- name: "Preflight | Locate the terraform binary on PATH"
  ansible.builtin.command:
    cmd: terraform version
  register: svc01_terraform_version
  changed_when: false
  failed_when: svc01_terraform_version.rc != 0

- name: "Preflight | List installed Ansible collections"
  ansible.builtin.command:
    cmd: ansible-galaxy collection list --format json
  register: svc01_galaxy_list
  changed_when: false
  failed_when: svc01_galaxy_list.rc != 0

- name: "Preflight | Compute the set of installed collection names"
  ansible.builtin.set_fact:
    svc01_installed_collections: >-
      {{ (svc01_galaxy_list.stdout | from_json).values()
         | map('list') | flatten | unique | list }}

- name: "Preflight | Assert the required Ansible collections are installed"
  ansible.builtin.assert:
    that:
      - "item in svc01_installed_collections"
    fail_msg: >-
      Required Ansible collection '{{ item }}' is not installed. Install with:
      ansible-galaxy collection install -r ansible/requirements.yml
    success_msg: "Ansible collection '{{ item }}' is installed."
  loop: "{{ svc01_required_collections }}"

- name: "Preflight | Assert the project venv binaries are present"
  ansible.builtin.stat:
    path: "{{ item }}"
  register: svc01_venv_bin_stat
  loop: "{{ svc01_required_venv_binaries }}"

- name: "Preflight | Fail naming any missing venv binary"
  ansible.builtin.assert:
    that:
      - "item.stat.exists"
      - "item.stat.executable | default(false)"
    fail_msg: "Required project venv binary missing or not executable: {{ item.item }}."
    success_msg: "venv binary present: {{ item.item }}"
  loop: "{{ svc01_venv_bin_stat.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: "Preflight | Assert Python >= 3.10"
  ansible.builtin.assert:
    that:
      - "ansible_python_version is version('3.10', '>=')"
    fail_msg: "Requires Python 3.10+; detected {{ ansible_python_version }}."
    success_msg: "Python {{ ansible_python_version }} satisfies >= 3.10."

- name: "Preflight | Assert Ansible >= 2.15"
  ansible.builtin.assert:
    that:
      - "ansible_version.full is version('2.15', '>=')"
    fail_msg: "Requires Ansible 2.15+; detected {{ ansible_version.full }}."
    success_msg: "Ansible {{ ansible_version.full }} satisfies >= 2.15."

# =========================================================== #
# Fail-fast diagnosability gates (fix-svc01-db-install-first-  #
# run-transient). Placed at the END of preflight so they run   #
# BEFORE Phase 3 (the postgres.yml child run) for BOTH engine  #
# paths — a gate here covers postgres-server AND mariadb-server #
# automatically. The Task-1 clean repro DISPROVED a race: the   #
# real defect is that a wired-but-EMPTY OPENBAO_ADMIN_TOKEN     #
# (or a wrong-var empty project_slug) fails deep inside the     #
# Phase-3 no_log OpenBao read/write, surfacing only a generic   #
# censored "non-zero return code". These gates fail CLOSED with #
# an explicit, NON-SECRET diagnostic instead. Mirrors the       #
# merged obs-precedent fix-obs-bootstrap-first-run-transient.   #
# =========================================================== #

# --- Gate A: empty project_slug (the wrong-var operator error) --------------
# A standalone `postgres.yml -e project_slug=...` run (instead of the sanctioned
# svc-01-bootstrap.yml, which maps project_slug -> postgres_project_slug) leaves
# postgres_db_name empty -> a malformed pg_hba.conf crash-loop. Fail CLOSED here
# naming the var + the sanctioned entry point. Non-secret; visible.
- name: "Preflight | Fail closed if project_slug resolves empty (wrong-var operator error)"
  ansible.builtin.assert:
    that:
      - "(project_slug | default('') | trim) | length > 0"
    fail_msg: >-
      SVC-01 bootstrap: project_slug resolved EMPTY. The DB name / app role are
      derived from it, so an empty value produces a malformed pg_hba.conf that
      crash-loops the database. Pass it via the SANCTIONED entry point
      `ansible/playbooks/svc-01-bootstrap.yml -e project_slug=<slug>` (which maps
      project_slug -> postgres_project_slug / mariadb_project_slug) — do NOT hand-run
      the standalone postgres.yml with `-e project_slug=...`. Then re-run.
    success_msg: "project_slug is present ('{{ project_slug }}')."
    quiet: true

# --- OpenBao admin-token resolution (process-env first, else cluster env file) #
# The postgres-server OpenBao read/write authenticates the delegated bao-CLI with
# OPENBAO_ADMIN_TOKEN, bridged into the Phase-3 child ENV (no_log). Historically
# the orchestrator bridged it ONLY from the process environment (lookup('env',...)),
# so the one-command bring-up — whose token lives in the cluster env file (loaded
# into a fact by cluster_env.py, which does NOT pass the token through) — sent an
# EMPTY token to the child and the delegated `bao kv put` failed (masked by no_log).
# Resolve it ONCE here, precedence process-env -> cluster env file (the single
# source of truth, service-installer.md I1), into a no_log fact consumed by
# svc01_bootstrap's child-run ENV and the fail-closed gate below. The VALUE is
# never echoed — only the resolution SOURCE is logged.
- name: "Preflight | Slurp the cluster env file for the OpenBao admin token (no_log)"
  ansible.builtin.slurp:
    src: >-
      {{ (svc01_repo_root ~ '/' ~ cluster_env_file)
         if (cluster_env_file is not match('^/'))
         else cluster_env_file }}
  register: svc01_cluster_env_slurp
  no_log: true

- name: "Preflight | Resolve the OpenBao admin token (process-env first, else the cluster env file) (no_log)"
  ansible.builtin.set_fact:
    # Secret VALUE fact (no_log). Captures, in the SAME no_log task, the non-secret
    # boolean the diagnostics below consume, so those diagnostics never name the
    # token env var themselves (they reference only these derived facts).
    svc01_openbao_admin_token: >-
      {{ (lookup('ansible.builtin.env', 'OPENBAO_ADMIN_TOKEN') | default('', true) | trim)
         if ((lookup('ansible.builtin.env', 'OPENBAO_ADMIN_TOKEN') | default('', true) | trim) | length > 0)
         else ((svc01_cluster_env_slurp.content | b64decode
                 | regex_findall('(?m)^[ \t]*OPENBAO_ADMIN_TOKEN[ \t]*=[ \t]*["\']?([^"\'\r\n]*?)["\']?[ \t]*$')
                 | first | default('') | trim)) }}
    svc01_openbao_token_from_env: >-
      {{ (lookup('ansible.builtin.env', 'OPENBAO_ADMIN_TOKEN') | default('', true) | trim | length) > 0 }}
  no_log: true

- name: "Preflight | Project the admin-token presence + source (non-secret, no value)"
  ansible.builtin.set_fact:
    svc01_openbao_token_present: "{{ (svc01_openbao_admin_token | default('') | trim | length) > 0 }}"
    svc01_openbao_token_source: >-
      {{ 'none'
         if ((svc01_openbao_admin_token | default('') | trim | length) == 0)
         else ('process-env' if (svc01_openbao_token_from_env | bool) else 'cluster-env-file') }}
  no_log: true
  changed_when: false

- name: "Preflight | INFO — OpenBao admin-token resolution source (never the value)"
  ansible.builtin.debug:
    msg: >-
      INFO: OpenBao admin-token resolution source = {{ svc01_openbao_token_source }}
      {{ '(' ~ cluster_env_file ~ ')' if svc01_openbao_token_source == 'cluster-env-file' else '' }}
      — the token value is never echoed.

# --- Gate B: OpenBao wired but no admin token resolvable (the real defect) ----
# Runs ONLY when OpenBao is wired (openbao_addr non-empty). A dev/offline run with
# openbao_addr empty skips this entirely (no behavior change). Non-secret; visible.
- name: "Preflight | Fail closed if OpenBao is wired but no admin token is resolvable"
  ansible.builtin.assert:
    that:
      - svc01_openbao_token_present | bool
    fail_msg: >-
      SVC-01 bootstrap: OpenBao is wired (openbao_addr='{{ openbao_addr }}') but
      OPENBAO_ADMIN_TOKEN resolved EMPTY (from both the process env and the cluster
      env file). The DB credential write to secret/proj-{{ project_slug }}/postgres
      will fail inside the no_log Phase-3 OpenBao read/write, surfacing only a
      generic censored error. Remedy: export OPENBAO_ADMIN_TOKEN into the process
      environment (e.g. `set -a; . ./.env.throwaway; set +a`) or ensure it is
      present in the cluster env file ({{ cluster_env_file }}) — the single source
      of truth — then re-run. (Run dev/offline with openbao_addr empty to skip the
      OpenBao credential write entirely.) The token value is never echoed.
    success_msg: "OpenBao admin token resolved for the DB credential write."
    quiet: true
  when: (openbao_addr | default('') | trim) | length > 0
