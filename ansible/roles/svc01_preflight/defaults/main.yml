---
# defaults/main.yml — svc01_preflight (SVC-01 installer — Phase 1)
#
# Phase-1 phase-specific defaults. Cross-phase constants (cluster_env_file,
# svc01_repo_root, svc01_venv_python, project_slug, vlan_id, etc.) are play-level
# vars on svc-01-bootstrap.yml. NO secret here.

svc01_cluster_env_helper: scripts/installer/cluster_env.py
svc01_autodetect_sentinel: "__AUTODETECT__"

# Homelab Proxmox self-signed cert tolerance (governs both preflight uri + the
# bpg/proxmox provider insecure setting via svc01_tf_env).
svc01_proxmox_validate_certs: false

svc01_required_collections:
  - community.docker
  - community.general
  - ansible.posix
  - community.crypto

svc01_required_venv_binaries:
  - "{{ ansible_env.HOME }}/venv/devinfra/bin/python"
  - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible-playbook"
  - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible-galaxy"
