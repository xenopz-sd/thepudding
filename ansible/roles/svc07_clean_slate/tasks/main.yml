---
# tasks/main.yml — svc07_clean_slate (SVC-07 installer — clean-slate branch)
#
# Extracted VERBATIM (spec task 8.1) from the baseline clean_slate branch in
# ansible/playbooks/svc-07-bootstrap.yml. The enclosing `when: clean_slate`
# gate and the per-phase `block`/`rescue` phase-naming wrapper stay in the thin
# orchestrator play (spec task 10) — this role owns the branch BODY only:
#   - confirmation gating (pause 300s unless clean_slate_confirm=force),
#   - independent cluster_env.py node-name resolution (no_log),
#   - Proxmox-host-address assertion,
#   - two-target assembly (1070 primary, 1071 unsealer),
#   - per-target child clean-slate.yml runs (invoking the existing
#     terraform_clean_slate role — does NOT reimplement destroy logic),
#   - two-way empty-baseline verification gate (pct list + terraform state list)
#     that HALTS naming each survivor.
# See design.md "Role 5: svc07_clean_slate". Cross-phase constants
# (clean_slate_confirm, cluster_env_file, svc07_tf_root, svc07_venv_python,
# svc07_cluster_env_helper) remain play-level vars; svc07_proxmox_host and
# svc07_proxmox_host_inventory are role defaults (defaults/main.yml).

# ============================================================ #
# Task 5.2 — Agent-live throwaway-cluster authorization gate     #
# (spec agent-live-test-authorization, Req 5.1-5.5 / Property 5).#
# ------------------------------------------------------------ #
# These THREE tasks run FIRST in the clean-slate branch — BEFORE  #
# the confirmation pause, the node-name resolution, and every     #
# per-target destroy — so a REFUSED decision halts before ANY     #
# prompt, destroy, or Terraform-state mutation (Req 5.1, 5.2).    #
# All three are gated `when: agent_live_run` (truthy only when     #
# the AGENT_LIVE_AUTHORIZED interlock is armed), so an ORDINARY    #
# operator run (interlock unset) SKIPS them entirely and keeps     #
# the existing pause-confirm path byte-for-byte unchanged          #
# (Req 5.5). The gate is FAIL-CLOSED: the guard consult never       #
# fails the task itself (failed_when: false) — the rc is the       #
# signal, and the assert HALTS unless the guard AUTHORIZED         #
# (rc == 0), naming the guard's own non-secret reason (Req 5.4).   #
# ============================================================ #

- name: "Clean-Slate | Consult the throwaway-cluster authorization guard (Agent_Live_Run only)"
  ansible.builtin.command:
    argv:
      - "{{ svc07_venv_python }}"
      - "{{ svc07_throwaway_guard }}"
      - --service
      - svc07
      - --env-file
      - "{{ cluster_env_file }}"
      - --allowlist
      - "{{ svc07_throwaway_allowlist }}"
  args:
    chdir: "{{ svc07_repo_root }}"
  register: svc07_throwaway_decision
  changed_when: false
  failed_when: false
  when: agent_live_run | default(false) | bool

- name: "Clean-Slate | INFO — agent-live authorization decision"
  ansible.builtin.debug:
    msg: >-
      INFO: agent-live authorization:
      {{ (svc07_throwaway_decision.stdout | default('{}') | from_json).reason | default('no decision') }}
  when: agent_live_run | default(false) | bool

- name: "Clean-Slate | Refuse the reset unless the throwaway guard AUTHORIZED it"
  ansible.builtin.assert:
    that:
      - "svc07_throwaway_decision.rc == 0"
    fail_msg: >-
      Agent-live clean-slate REFUSED by the throwaway-cluster guard:
      {{ (svc07_throwaway_decision.stdout | default('{}') | from_json).reason
         | default('guard produced no decision') }}.
      No container was destroyed and no Terraform state was modified. Arm the run
      only against a throwaway cluster listed in throwaway-clusters.yml with
      AGENT_LIVE_AUTHORIZED set.
    success_msg: "Throwaway-cluster guard AUTHORIZED the agent-live clean-slate."
  when: agent_live_run | default(false) | bool

# ============================================================ #
# Task 11.1 — Confirmation gating (Req 7.1, 7.2, 7.3).          #
# ------------------------------------------------------------ #
# The Clean_Slate_Reset is DESTRUCTIVE (pct destroy + terraform  #
# state rm on both SVC-07 guests). Before delegating any destroy #
# we require an affirmative confirmation UNLESS the operator      #
# already asserted intent with clean_slate_confirm=force:         #
#   * clean_slate_confirm == 'force'  -> skip the prompt (7.3).   #
#   * otherwise -> ansible.builtin.pause prompts for explicit     #
#     confirmation, bounded at 300 s (7.1). A non-affirmative     #
#     response, or no response within the timeout, aborts the     #
#     reset destroying NOTHING and returns non-zero (7.2).        #
# The prompt runs BEFORE proxmox_node_name resolution and before  #
# any child clean-slate.yml run, so a declined/timed-out prompt   #
# cannot have touched Proxmox or Terraform state.                 #
# ============================================================ #

- name: "Clean-Slate | Prompt for explicit confirmation (300s timeout; skipped on force)"
  ansible.builtin.pause:
    prompt: >-
      DESTRUCTIVE Clean-Slate reset of SVC-07 requested. This will
      pct-destroy containers 1070 (primary) and 1071 (unsealer) and
      remove them from Terraform state. Type 'yes' to proceed, anything
      else to abort
    seconds: 300
  register: svc07_clean_slate_prompt
  when: (clean_slate_confirm | default('')) != 'force'

# Decide affirmation. On force, no prompt ran -> proceed. Otherwise the
# response must be an affirmative ('yes'/'y', case-insensitive, trimmed);
# anything else — including an empty/timed-out response (pause returns an
# empty user_input on timeout) — is a non-affirmative abort (Req 7.2).
- name: "Clean-Slate | Resolve whether the reset is confirmed"
  ansible.builtin.set_fact:
    svc07_clean_slate_confirmed: >-
      {{ (clean_slate_confirm | default('')) == 'force'
         or ((svc07_clean_slate_prompt.user_input | default('') | trim | lower) in ['yes', 'y']) }}

# A non-affirmative / absent response aborts the reset, destroying
# nothing, with a non-zero exit (Req 7.2). This runs before any node
# resolution or delegated destroy, so no state was touched.
- name: "Clean-Slate | Abort with non-zero exit when not confirmed (destroys nothing, Req 7.2)"
  ansible.builtin.fail:
    msg: >-
      Clean-Slate reset ABORTED — confirmation was not given (received a
      non-affirmative or empty/timed-out response). No container was
      destroyed and no Terraform state was modified. Re-run with an
      affirmative 'yes' at the prompt, or pass -e clean_slate_confirm=force
      to skip the prompt.
  when: not (svc07_clean_slate_confirmed | bool)

# ============================================================ #
# Task 11.2 — Delegated reset + verification gate               #
# (Req 7.4, 7.5, 7.6, 7.7, 7.8).                                #
# ------------------------------------------------------------ #
# Phase 1 does NOT run on a clean-slate invocation (every phase   #
# is gated `when: not clean_slate`), so proxmox_node_name is NOT  #
# resolved by preflight. The terraform_clean_slate role needs     #
# each target's `node`, so we resolve the node name INDEPENDENTLY #
# here by invoking cluster_env.py against the same Cluster_Env_   #
# File (its TF_VAR_proxmox_node_name), exactly as Phase 1 would.  #
# ============================================================ #

# Resolve proxmox_node_name from the cluster env (independent of Phase 1).
# no_log — the helper's JSON stdout carries the API token by key.
- name: "Clean-Slate | Resolve cluster env for the Proxmox node name ({{ cluster_env_file }})"
  ansible.builtin.command:
    argv:
      - "{{ svc07_venv_python }}"
      - "{{ svc07_cluster_env_helper }}"
      - "--env-file"
      - "{{ cluster_env_file }}"
  args:
    chdir: "{{ svc07_repo_root }}"
  register: svc07_cs_env_resolve
  changed_when: false
  no_log: true

- name: "Clean-Slate | Bind the resolved Proxmox node name (no_log)"
  ansible.builtin.set_fact:
    proxmox_node_name: "{{ (svc07_cs_env_resolve.stdout | from_json)['TF_VAR_proxmox_node_name'] }}"
  no_log: true

# The delegated clean-slate.yml runs `pct` ON THE NODE, so it targets the
# Proxmox-host inventory whose ansible_host is a committed placeholder —
# the operator MUST supply the real LAN IP. Fail fast (naming the var) if
# a reset was requested without it, before any destroy runs (Req 7.4).
- name: "Clean-Slate | Assert the Proxmox host SSH address was supplied"
  ansible.builtin.assert:
    that:
      - "svc07_proxmox_host is defined"
      - "(svc07_proxmox_host | trim | length) > 0"
    fail_msg: >-
      The Clean-Slate reset delegates to clean-slate.yml against the
      Proxmox-host inventory ({{ svc07_proxmox_host_inventory }}), which
      runs `pct` on the node over SSH. Supply the real Proxmox LAN IP with
      -e svc07_proxmox_host=<real-proxmox-lan-ip>. Nothing was destroyed.
    success_msg: "Proxmox host SSH address supplied for the reset."

# The two SVC-07 clean_slate_targets (design "Clean-slate component"),
# node computed from the independently-resolved proxmox_node_name.
- name: "Clean-Slate | Assemble the two SVC-07 clean_slate_targets"
  ansible.builtin.set_fact:
    svc07_clean_slate_targets:
      - name: svc07-20-01
        terraform_root: infra/projects/svc-07-secrets-manager
        resource_address: proxmox_virtual_environment_container.primary
        node: "{{ proxmox_node_name }}"
        vmid: 1070
      - name: svc07-unsealer-20-01
        terraform_root: infra/projects/svc-07-secrets-manager
        resource_address: proxmox_virtual_environment_container.unsealer
        node: "{{ proxmox_node_name }}"
        vmid: 1071

# Child clean-slate.yml run, ONCE PER TARGET. The role requires the single
# per-run clean_slate_confirm token to match the target's vmid, so the two
# targets (1070, 1071) cannot share one run — each is destroyed by its own
# child invocation whose confirm == that target's vmid (Req 7.4, 7.6). The
# role tolerates an already-absent container and an already-absent state
# entry (Req 7.5). ansible_host is overridden to the real Proxmox LAN IP.
# A child non-zero exit is caught by this branch's rescue (Req 1.7).
- name: "Clean-Slate | Delegate the reset to clean-slate.yml (one child run per target)"
  ansible.builtin.command:
    argv:
      - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible-playbook"
      - -i
      - "{{ svc07_proxmox_host_inventory }}"
      - ansible/playbooks/clean-slate.yml
      - --extra-vars
      - "ansible_host={{ svc07_proxmox_host }}"
      - -e
      - clean_slate_enabled=true
      - -e
      - "clean_slate_confirm={{ item.vmid }}"
      - -e
      - "{{ {'clean_slate_targets': [item]} | to_json }}"
  args:
    chdir: "{{ svc07_repo_root }}"
  loop: "{{ svc07_clean_slate_targets }}"
  loop_control:
    label: "{{ item.name }} (vmid {{ item.vmid }})"
  register: svc07_clean_slate_runs
  changed_when: "'changed=0' not in (svc07_clean_slate_runs.stdout | default(''))"

# ---- Remove the delegated OpenBao cross-guest Route_Fragment ----------------
# The OpenBao primary guest is now destroyed (loop above). The Route_Fragment
# OpenBao delegated onto the Traefik_Guest's watched file-provider dir
# (openbao-route.yml) must ALSO be removed, or Traefik keeps a dangling route
# pointing at the now-freed VLAN-20 IP (10.0.20.10). This is a
# TRAEFIK-GUEST-SIDE cleanup, not a guest destroy — delegated to the
# Traefik_Guest, and the watched file provider hot-reloads the route's removal
# with no Traefik restart. Spec svc-07-cross-guest-ingress R4.1-R4.4; mirrors
# the FIXED obs_clean_slate pattern EXACTLY.
#
# ORCHESTRATOR-CONTEXT CONNECTION SETUP (the bug fix). The clean-slate branch
# runs in the `hosts: localhost` orchestrator play (localhost.yml,
# ansible_connection: local) — NOT the configurator play (openbao.yml + the
# generated inventory). In that orchestrator context there is NO add_host for
# the Traefik_Guest and NO known_hosts entry for it, so a bare
# `delegate_to: 10.0.20.12` has no working SSH connection. A naive
# `failed_when: false` would swallow the connection failure as a FALSE
# "already absent", silently leaving a dangling route. The fix mirrors
# svc07_provision / obs_clean_slate EXACTLY: before delegating from the
# orchestrator play, reconcile known_hosts (ssh-keygen -R + ssh-keyscan) and
# add_host the guest with connection vars, so the removal actually connects —
# and a de-masked failure condition makes a silent false-success impossible.
- name: "Clean-Slate | Ensure ~/.ssh exists (0700) for the Traefik_Guest known_hosts reconcile"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"

- name: "Clean-Slate | Remove any stale known_hosts fingerprint for the Traefik_Guest"
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -R
      - "{{ svc07_traefik_guest_host }}"
      - -f
      - "{{ ansible_env.HOME }}/.ssh/known_hosts"
  register: svc07_traefik_knownhosts_purge
  changed_when: "'updated' in (svc07_traefik_knownhosts_purge.stderr | default(''))"
  failed_when: false

# failed_when:false on the KEYSCAN — during a FULL teardown the Traefik_Guest
# itself may already be gone/unreachable (it is a separate guest, torn down by
# its own SVC-09 clean-slate). A missing Traefik_Guest must NOT block the SVC-07
# empty-baseline gate (the fragment dies with that guest anyway). So the keyscan
# does not fail the play; instead we compute svc07_traefik_reachable from
# (rc == 0 AND non-empty stdout) and GATE the append + the removal on it.
- name: "Clean-Slate | ssh-keyscan the Traefik_Guest (30s; tolerant of a torn-down guest)"
  ansible.builtin.command:
    argv:
      - ssh-keyscan
      - -T
      - "30"
      - "{{ svc07_traefik_guest_host }}"
  register: svc07_traefik_keyscan
  changed_when: false
  failed_when: false

- name: "Clean-Slate | Resolve whether the Traefik_Guest is reachable (keyscan succeeded)"
  ansible.builtin.set_fact:
    svc07_traefik_reachable: >-
      {{ (svc07_traefik_keyscan.rc | default(1)) == 0
         and ((svc07_traefik_keyscan.stdout | default('') | trim | length) > 0) }}

- name: "Clean-Slate | Append the Traefik_Guest host key to known_hosts (only when reachable)"
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.ssh/known_hosts"
    create: true
    mode: "0600"
    marker: "# {mark} SVC-07 clean-slate Traefik_Guest key for {{ svc07_traefik_guest_host }}"
    block: "{{ svc07_traefik_keyscan.stdout }}"
  when: svc07_traefik_reachable | bool

# Scope: ONLY this feature's openbao-route.yml — NOT SVC-09's shared default
# cert, which is out of scope for this teardown. `state: absent` is naturally
# idempotent — a no-op when the fragment is already gone. The add_host supplies
# the orchestrator-context SSH connection (the configurator play's add_host is
# absent here); delegate_to that host so the file module runs ON the Traefik_Guest.
- name: "Clean-Slate | Register the Traefik_Guest for the orchestrator-context delegation"
  ansible.builtin.add_host:
    name: svc07-traefik-cross-guest-cleanup
    ansible_host: "{{ svc07_traefik_guest_host }}"
    ansible_user: "{{ svc07_traefik_guest_user | default('root') }}"
    ansible_python_interpreter: "{{ svc07_traefik_guest_python | default('/usr/bin/python3') }}"
    ansible_ssh_private_key_file: >-
      {{ (svc07_traefik_guest_ssh_key | default('') | trim | length > 0)
         | ternary(svc07_traefik_guest_ssh_key, omit) }}
    ansible_connection: ssh
  changed_when: false
  when: svc07_traefik_reachable | bool

# De-masked removal. Gated on reachability: a full teardown (Traefik gone) SKIPS
# this cleanly (the INFO task below reports "unreachable on full teardown"),
# rather than the old silent false-success. When the guest IS reachable, the
# removal runs with a REAL failure condition — it fails only if the `file` module
# errored for a reason OTHER than the host being unreachable. A genuine "fragment
# still there, removal errored" is no longer masked.
- name: "Clean-Slate | Remove the delegated OpenBao Route_Fragment from the Traefik_Guest"
  ansible.builtin.file:
    path: "{{ svc07_openbao_route_fragment }}"
    state: absent
  delegate_to: svc07-traefik-cross-guest-cleanup
  register: svc07_openbao_route_removed
  when: svc07_traefik_reachable | default(true) | bool
  failed_when:
    - svc07_openbao_route_removed is failed
    - "'unreachable' not in (svc07_openbao_route_removed.msg | default('') | lower)"

- name: "Clean-Slate | INFO — OpenBao Route_Fragment removal outcome"
  ansible.builtin.debug:
    msg: >-
      {{
        ('OpenBao Route_Fragment removal SKIPPED: the Traefik_Guest '
          ~ svc07_traefik_guest_host ~ ' was unreachable during a full teardown '
          ~ '(ssh-keyscan found no host) — the fragment ' ~ svc07_openbao_route_fragment
          ~ ' dies with the guest, no dangling route is possible. No action needed.')
        if (not (svc07_traefik_reachable | default(true) | bool))
        else (('Removed the dangling OpenBao Route_Fragment '
          ~ svc07_openbao_route_fragment ~ ' from the reachable Traefik_Guest '
          ~ svc07_traefik_guest_host ~ ' (no dangling route left pointing at the '
          ~ 'freed OpenBao VLAN-20 IP).')
        if (svc07_openbao_route_removed is changed)
        else ('No OpenBao Route_Fragment to remove at ' ~ svc07_openbao_route_fragment
          ~ ' on the reachable Traefik_Guest ' ~ svc07_traefik_guest_host
          ~ ' (already absent — verified over a working SSH connection, NOT a '
          ~ 'connection failure). No action needed.'))
      }}
  changed_when: false

# ---- Verification gate (Req 7.7, 7.8) ---------------------------- #
# After the reset, verify an EMPTY baseline two ways, and fail naming
# every survivor if either check finds one.

# (a) Zero SVC-07 CONTAINERS on the host. `pct` runs on the node, so the
# check is a child `ansible` ad-hoc `command` against the Proxmox-host
# inventory (same inventory clean-slate.yml uses). We filter `pct list`
# to the two SVC-07 VMIDs; a non-zero grep (no match) means clean. rc is
# tolerated (grep exits 1 on no match) — the survivor set is parsed from
# stdout, not the exit code.
- name: "Clean-Slate | VERIFY — list any surviving SVC-07 containers on the host (pct list)"
  ansible.builtin.command:
    argv:
      - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible"
      - proxmox
      - -i
      - "{{ svc07_proxmox_host_inventory }}"
      - --extra-vars
      - "ansible_host={{ svc07_proxmox_host }}"
      - -m
      - ansible.builtin.command
      - -a
      - "pct list"
  args:
    chdir: "{{ svc07_repo_root }}"
  register: svc07_pct_list
  changed_when: false
  failed_when: false

# Extract surviving SVC-07 VMIDs (1070/1071) from the pct list output.
# `pct list` prints one guest per line beginning with the VMID; a
# word-boundary match on either id yields the survivor set.
- name: "Clean-Slate | Compute the set of surviving SVC-07 container VMIDs"
  ansible.builtin.set_fact:
    svc07_surviving_vmids: >-
      {{ ['1070', '1071']
         | select('in', (svc07_pct_list.stdout | default('')))
         | list }}

# (b) Zero RESOURCES of ANY kind in the SVC-07 Terraform state. The child
# clean-slate.yml runs above already `pct destroy`'d the two guests and
# `terraform state rm`'d their container addresses. But the SVC-07 root also
# carries NON-guest `terraform_data` book-keeping resources that manage no live
# Proxmox object — the root-level ledger-check
# (`terraform_data.svc07_host_index_ledger_check`) and the per-module
# `module.{primary,unsealer}.terraform_data.input_guards` anchors — which the
# container-only state rm leaves behind (the residue bug, spec
# fix-svc07-clean-slate-terraform-data-residue). A correct clean-slate must
# leave `terraform state list` EMPTY so a from-scratch re-install and the
# platform fabric teardown both proceed with no manual `terraform state rm`.
#
# So, PROVIDER-FREE, enumerate every ADDRESS that remains in state and
# `terraform state rm` each one. `terraform state rm` of a `terraform_data`
# address does NOT contact the Proxmox provider (no plan/refresh), so this
# avoids the provider-hang / stale-state-lock hazard a `terraform destroy`
# would cause (design root cause #4, Req 2.5). These are inert anchors that a
# normal `terraform apply` recreates, so removing them changes nothing at
# apply time (Req 3.5). All ops run on the CONTROL NODE (state lives there).
- name: "Clean-Slate | List ALL remaining addresses in the SVC-07 Terraform state (residue sweep)"
  ansible.builtin.command:
    argv:
      - terraform
      - state
      - list
  args:
    chdir: "{{ svc07_tf_root }}"
  register: svc07_residual_state_list
  changed_when: false
  failed_when: false

- name: "Clean-Slate | Compute the residual (non-guest terraform_data) addresses to remove"
  ansible.builtin.set_fact:
    svc07_residual_state_addrs: >-
      {{ (svc07_residual_state_list.stdout | default('')).splitlines()
         | map('trim') | select('ne', '') | list }}

# Provider-free `terraform state rm` of every remaining address (idempotent —
# tolerates an already-absent address / an empty residual set on a re-run). No
# `terraform destroy`, no provider contact (Req 2.5, 3.4).
- name: "Clean-Slate | Remove ALL remaining state addresses provider-free (terraform state rm)"
  ansible.builtin.command:
    argv:
      - terraform
      - state
      - rm
      - "{{ item }}"
  args:
    chdir: "{{ svc07_tf_root }}"
  loop: "{{ svc07_residual_state_addrs }}"
  loop_control:
    label: "{{ item }}"
  register: svc07_residual_state_rm
  changed_when: "'Removed' in (svc07_residual_state_rm.stdout | default(''))"
  failed_when:
    - (svc07_residual_state_rm.rc | default(1)) != 0
    - "'No matching objects' not in (svc07_residual_state_rm.stdout | default(''))"
    - "'No matching objects' not in (svc07_residual_state_rm.stderr | default(''))"

# Re-list the FULL state AFTER the sweep: the gate judges emptiness by the
# WHOLE `terraform state list` (zero addresses), not merely by whether the two
# container addresses are absent (Req 2.2 — the tightened gate).
- name: "Clean-Slate | VERIFY — list the FULL SVC-07 Terraform state after the residue sweep"
  ansible.builtin.command:
    argv:
      - terraform
      - state
      - list
  args:
    chdir: "{{ svc07_tf_root }}"
  register: svc07_state_list
  changed_when: false
  failed_when: false

- name: "Clean-Slate | Compute the set of surviving SVC-07 state addresses (FULL state)"
  ansible.builtin.set_fact:
    svc07_surviving_state_addrs: >-
      {{ (svc07_state_list.stdout | default('')).splitlines()
         | map('trim') | select('ne', '') | list }}

# Final gate (Req 7.7, 7.8, 2.2): both survivor sets MUST be empty. The state
# survivor set is now the FULL state list, so a reported-clean reset is a
# genuinely empty state. If either is non-empty the installer halts with a
# non-zero exit, naming each surviving resource by container ID or state address.
- name: "Clean-Slate | GATE — assert an empty baseline (0 containers, 0 state), Req 7.7/7.8/2.2"
  ansible.builtin.assert:
    that:
      - "(svc07_surviving_vmids | length) == 0"
      - "(svc07_surviving_state_addrs | length) == 0"
    fail_msg: >-
      Clean-Slate reset did NOT reach an empty baseline. Surviving SVC-07
      container(s): {{ svc07_surviving_vmids | default([]) | join(', ') | default('none', true) }};
      surviving Terraform state address(es):
      {{ svc07_surviving_state_addrs | default([]) | join(', ') | default('none', true) }}.
      Investigate on the Proxmox host / in Terraform state and re-run the
      reset until both are empty before re-installing.
    success_msg: >-
      Clean-Slate reset complete — zero SVC-07 containers on the host and
      an EMPTY SVC-07 Terraform state (guests + non-guest terraform_data
      book-keeping resources all removed).

- name: "Clean-Slate | Report the reset completed to an empty baseline"
  ansible.builtin.debug:
    msg: >-
