---
# defaults/main.yml — zitadel-org-provision (SVC-06)
#
# Idempotently onboards a platform project to ZITADEL SSO: create its
# organization, default roles, and an OIDC application registration, via the
# scripts/installer/zitadel_provision.py management-API helper (design.md §3.4,
# FR-3). The helper is pure-Python/stdlib and idempotent (already-exists =
# success); this role invokes it through the project venv python, captures the
# returned OIDC client secrets, and writes them to OpenBao (SVC-07) via the `bao`
# CLI docker-exec pattern — never a committed .env (integration-boundaries §2).

# --- The project being onboarded ---
# The platform project slug -> ZITADEL organization name `proj-<slug>`
# (requirements §4). Supplied per onboarding run.
zop_project_slug: ""
zop_org_name: "proj-{{ zop_project_slug }}"
zop_project_name: "{{ zop_project_slug }}"
# The OIDC application registered for the project. Historically this role
# registered exactly ONE confidential-web app named `<slug>-webapp`; that remains
# the default when no `zop_app_registrations` list is supplied (see below). The
# two-client onboarding (spec: zitadel-spa-pkce-onboarding) adds the
# `zop_app_registrations` list so a project can onboard multiple apps of multiple
# types (public SPA + API resource server) in ONE run.
zop_app_name: "{{ zop_project_slug }}-webapp"
zop_redirect_uris:
  - "https://{{ zop_project_slug }}.{{ zop_platform_domain }}/oauth/callback"
zop_roles:
  - admin
  - member
  - viewer

# --- Two-client onboarding: the list of apps to register this run -----------
# (spec: zitadel-spa-pkce-onboarding, design Component 5 + Variables table.)
# Each entry is an App_Registration:
#   - name:          OIDC/API app name, unique within the project.
#   - app_type:      one of zop_valid_app_types (spa|web|api).
#   - auth_method:   optional; derived from zop_app_type_default_auth_method when
#                    omitted (spa->none, web->basic, api->jwt).
#   - redirect_uris: list; required for spa/web, empty for api.
# EMPTY (the default) means: synthesize exactly the pre-existing single
# confidential-web `<slug>-webapp` entry, so a no-list run is byte-for-byte the
# legacy behavior (R4.3/R6.1).
zop_app_registrations: []

# The synthesized legacy-default entry fields (used only when the list is empty).
zop_default_app_name: "{{ zop_project_slug }}-webapp"
zop_default_app_type: "web"
zop_default_auth_method: "basic"

# Accepted entry `app_type` values (the R4.5 assertion source) and the per-type
# default auth method when an entry omits `auth_method`.
zop_valid_app_types:
  - spa
  - web
  - api
zop_app_type_default_auth_method:
  spa: none
  web: basic
  api: jwt

# Per-app OpenBao KV path template — unique per application within the project so
# two apps never resolve to the same path (R5.1). `{app_name}` is substituted
# per entry (a Python str.format token, NOT a Jinja var, so it survives the
# `zop_openbao_app_secret_path_tmpl` default being rendered once).
zop_openbao_app_secret_path_tmpl: "{{ zop_openbao_kv_mount }}/proj-{{ zop_project_slug }}/zitadel/oidc/{app_name}"

# --- ZITADEL endpoint ---
zop_platform_domain: "platform.example.test"
zop_base_url: "https://auth.{{ zop_platform_domain }}"

# --- Production-path (control node -> Traefik HTTPS) TLS verification knob ----
# The production path reaches ZITADEL through Traefik (SVC-09) at zop_base_url
# (https://auth.<domain>). Traefik serves a self-signed cert by default (the
# permanent, default-off traefik_tls_self_signed mock — ADR-0013 — because
# SVC-08/Let's-Encrypt real certs are not deployed). Default TRUE so the helper
# call tolerates that self-signed cert today; flip to FALSE once real certs are
# deployed and verification should be enforced. Mirrors zop_openbao_tls_skip_verify
# in this same file. Non-secret transport knob — safe on the helper argv.
zop_base_url_tls_skip_verify: true

# --- The provisioning helper (invoked via the project venv python) ---
zop_venv_python: "{{ ansible_env.HOME }}/venv/devinfra/bin/python"
zop_provision_helper: "scripts/installer/zitadel_provision.py"
zop_repo_root: "{{ playbook_dir | dirname | dirname }}"

# --- OpenBao (SVC-07) secret storage for the captured OIDC client secret ---
# The service-account access token the helper authenticates with is read from
# the ZITADEL_PROVISION_TOKEN env var (NEVER argv) — this role sources it from
# OpenBao / the environment and passes it in the child-process ENV. The captured
# client secret is written to OpenBao under secret/proj-<slug>/zitadel/oidc/<app>.
zop_openbao_addr: ""   # when empty, the OpenBao write is skipped (dev offline)
zop_openbao_primary_container_name: "openbao-openbao-1"
zop_openbao_bao_bin: "bao"
zop_openbao_tls_skip_verify: true
zop_openbao_kv_mount: "secret"
zop_openbao_oidc_secret_path: "{{ zop_openbao_kv_mount }}/proj-{{ zop_project_slug }}/zitadel/oidc/{{ zop_app_name }}"

# --- Provisioning token source: OpenBao by default, env override preserved ----
# The ZITADEL management-API provisioning token is obtained automatically at
# first-init by the zitadel-server role and stored at the shared-zitadel KV path
# field `provision_token` (spec: svc06-org-provision-token-wiring, ADR-0016).
# This role reads it from OpenBao when ZITADEL_PROVISION_TOKEN is empty, and
# prefers the env override when it is set (manual/CI path). These vars mirror
# zitadel-server's delegated `bao`-CLI docker-exec read so the same OpenBao
# source answers from an inventory that holds only localhost.
zop_openbao_provision_secret_path: "{{ zop_openbao_kv_mount }}/proj-shared-zitadel/zitadel"
zop_openbao_provision_token_field: "provision_token"
zop_openbao_cli_host: "10.0.20.10"
zop_openbao_cli_bao_addr: "https://127.0.0.1:8200"
zop_openbao_cli_user: "root"
zop_openbao_cli_python: "/usr/bin/python3"

# --- Dev/mock transport (Traefik-less path) ----------------------------------
# PRODUCTION: zop_base_url is the Traefik-fronted https://auth.<domain> and the
# helper runs on the control node reaching ZITADEL through Traefik (SVC-09).
# DEV/MOCK (no Traefik): ZITADEL publishes NO host port (integration-boundaries
# §1) — its mgmt API is reachable only at the CONTAINER's own IP:8080 on the
# `edge` network, from the GUEST. When zop_zitadel_guest_host is set, the role
# resolves the container IP ON THE GUEST and runs the helper THERE (guest
# python3), targeting http://<container-ip>:8080 while presenting the
# external-domain Host header (exactly as svc06-health.yml does). This mirrors
# the dev path; the token still travels in the child ENV, never argv.
zop_zitadel_guest_host: ""     # empty -> production Traefik path (run on control node)
zop_zitadel_container_name: "zitadel-zitadel-1"
zop_zitadel_http_port: 8080
zop_zitadel_host_header: "auth.{{ zop_platform_domain }}"
# Where the stdlib helper is staged on the guest for the dev-path run.
zop_guest_helper_path: "/tmp/zitadel_provision.py"
zop_guest_python: "/usr/bin/python3"
zop_zitadel_guest_ssh_user: "root"
