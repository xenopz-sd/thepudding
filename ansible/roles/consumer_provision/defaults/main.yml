---
# defaults/main.yml — consumer_provision (Consumer onboarding — Phase 2)
#
# Phase-2 phase-specific defaults. Cross-phase constants (cluster_env_file,
# consumer_repo_root, consumer_venv_python, project_slug, openbao_addr,
# agent_live_run) are play-level vars; consumer_vlan_id / consumer_manifest are
# Phase-1 facts. NO secret here.

# The SVC01_Consumer_Root per-project `db/` Terraform root (ADR-0019). The
# apply is COMPOSED via a child svc-01-bootstrap.yml run (Req 4.4) — this role
# never re-declares the DB container or re-derives addressing.
consumer_db_tf_root: "infra/projects/{{ project_slug }}/db"

# --- Network-slice auto-create (fix-consumer-onboarding-prerequisites, §2) -----
# The project's own top-level network-slice root (its sdn.tf creates the project
# VNet p<vlan> + subnet). It is a DISTINCT per-project Terraform state
# `<slug>-infra` (one-state-per-service, integration-boundaries §5) that the
# project already owns — applying it here (as the FIRST Phase-2 step, gated on the
# Phase-1 decision that the VNet is absent + auto-create ON) folds the previously
# undocumented `terraform apply infra/projects/<slug>/` pre-step into the flow.
# The composed svc01_preflight VNet-presence assert stays the UNCHANGED backstop.
consumer_network_slice_tf_root: "{{ consumer_repo_root }}/infra/projects/{{ project_slug }}"
consumer_network_slice_state_name: "{{ project_slug }}-infra"
# --- Consumer ingress / browser-reachable OIDC (fix-consumer-ingress-browser-
#     reachable-oidc, §6) -----------------------------------------------------
# When the manifest declares an `expose` block (enabled: true), the workload is
# USER-FACING and is published through the shared Traefik under
# <expose.host>.<consumer_platform_domain> via the EXISTING ADR-0018 traefik_route
# path (the openbao-agent role already carries that wiring; the deploy step feeds
# it the real base-domain host rule these facts resolve). consumer_platform_domain
# is the base domain the subdomain label is appended to (single source of truth;
# placeholder default).
consumer_platform_domain: "platform.example.test"
# The Traefik guest the backend must be reachable from (ADR-0015 host_index 2 →
# 10.0.20.12); the cross-VLAN reachability preflight probes from here.
consumer_traefik_guest_host: "10.0.20.12"
# The Phase-2 cross-VLAN preflight probes L3 reachability on this port (sshd),
# NOT the application port — the workload is only deployed in Phase 3, so the
# app port cannot be listening yet. The app route itself is verified end-to-end
# through Traefik post-deploy in Phase 4 (consumer_handoff).
consumer_expose_l3_probe_port: 22
consumer_traefik_guest_ssh_user: "root"
consumer_traefik_guest_python: "/usr/bin/python3"

# The sanctioned SVC-01 orchestrator the consumer provision COMPOSES (Req 4.4).
# Running it stands up the per-project DB guest (Terraform apply) AND configures
# it (common + postgres.yml) in one idempotent child run — never reimplemented.
consumer_svc01_bootstrap_playbook: ansible/playbooks/svc-01-bootstrap.yml

# The generated inventory the SVC-01 installer emits + the consumer-scoped copy
# the orchestrator keys later phases on (design "Phase 2": generate_inventory.py
# -> <slug>-consumer.generated.yml).
consumer_svc01_generated_inventory: ansible/inventory/svc-01-sql-database.generated.yml
consumer_generated_inventory: "ansible/inventory/{{ project_slug }}-consumer.generated.yml"

# The per-project DB guest VMID. Supplied explicitly so instances get stable,
# non-colliding IDs; a real per-project copy overrides via -e consumer_svc01_vmid=.
consumer_svc01_vmid: 1101

# --- Optional workload guest (consumer-last-mile-hello-workload §B, task 3.1) --
#
# The per-project Workload_Consumer_Root (infra/projects/<slug>/workload/, ADR-
# 0021 + task 2.2). Threaded the SAME way the DB is driven: a count-gated
# `terraform apply` against this root, with the Proxmox endpoint/token carried
# via TF_VAR_* env (never argv; no_log), the GitLab-vs-local backend selected by
# the same swap-gate the SVC-01 apply uses, and the inventory regenerated from
# the root's `inventory_hosts` output. The whole block is a STRICT NO-OP unless
# the manifest declares `workload.enabled: true` (Req 2.3).
consumer_workload_tf_root: "{{ consumer_repo_root }}/infra/projects/{{ project_slug }}/workload"

# Per-instance GitLab state name for the workload root — `<slug>-workload`,
# DISTINCT from `<slug>-infra`, `<slug>-db`, and every service state
# (one-state-per-service, integration-boundaries §5; workload/versions.tf).
consumer_workload_state_name: "{{ project_slug }}-workload"

# The workload root's own generated inventory (file-mediated handoff,
# integration-boundaries §4). Regenerated from the workload root's
# `inventory_hosts` output so the workload guest appears ONLY when enabled
# (the output is an empty list while the guest is disabled).
consumer_workload_generated_inventory: "ansible/inventory/{{ project_slug }}-workload.generated.yml"

# The per-project workload guest VMID — OPERATOR OVERRIDE, default 0 = "use the
# module-computed deterministic VMID" (ADR-0022). Threaded to the workload root
# as `-var workload_vmid=`; 0 lets proxmox-compute derive vlan_id * 1000 +
# host_index (VLAN 100 idx 1 -> 100001), which is collision-free by construction.
# This REPLACES the former hardcoded 1102, which collided with the ZITADEL
# backing-DB guest (svc06_db_vmid: 1102) and caused the live workload bring-up to
# match that existing guest instead of creating a new LXC. A real per-project
# copy MAY still pin a specific VMID via -e consumer_workload_vmid=<id> (it then
# wins); leaving it 0 is the recommended path.
consumer_workload_vmid: 0

# Datastore auto-detect sentinel emitted by cluster_env.py when PROXMOX_DATASTORE_ID
# is absent. When the resolved datastore is this sentinel (or empty) we DO NOT
# pass workload_datastore_id, letting the workload root fall back to its own
# default (local-zfs). Mirrors svc01_autodetect_sentinel.
consumer_autodetect_sentinel: "__AUTODETECT__"

# Environment passed to the workload root's terraform init/apply. Proxmox
# endpoint/token via TF_VAR_* (never argv); insecure derived from the homelab
# self-signed tolerance. Evaluated LAZILY against the consumer_tfvars fact
# resolved in Phase 1; every consumer sets no_log:true. NO secret literal here.
consumer_workload_tf_env:
  TF_VAR_proxmox_endpoint: >-
    {{ (consumer_tfvars['TF_VAR_proxmox_endpoint'] | default('')) | trim
       | regex_replace('/+$', '')
       | regex_replace('/api2/json$', '')
       | regex_replace('/+$', '') }}
  TF_VAR_proxmox_api_token: "{{ consumer_tfvars['TF_VAR_proxmox_api_token'] | default('') }}"
  TF_VAR_proxmox_insecure: "{{ (not (consumer_validate_certs | default(false) | bool)) | lower }}"
