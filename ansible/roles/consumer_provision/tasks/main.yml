---
# tasks/main.yml — consumer_provision (Consumer onboarding — Phase 2: Provision)
#
# Phase-2 "Infrastructure provisioning". Runs ONLY when the manifest declares a
# database (design "Phase 2"; a project consuming only sso/secrets skips it).
#
# COMPOSITION, NOT REIMPLEMENTATION (Req 4.4, ADR-0020): the per-project DB is
# stood up by COMPOSING the sanctioned SVC-01 orchestrator
# `svc-01-bootstrap.yml` as a child ansible-playbook run — the one reproducible
# SVC-01 lifecycle entry point (service-installer.md single-orchestrator rule).
# That child drives the SVC01_Consumer_Root apply (terraform apply against
# infra/projects/<slug>/db/ via the reused svc-01-sql-database module, ADR-0019),
# the common baseline, and the DB bootstrap (DB + least-priv app role +
# generated-password->OpenBao write) — this role never re-declares or re-derives
# any of it. The slug, Registry-resolved vlan_id, ledger host_index, engine/tier,
# and svc01_vmid are threaded across the child-process boundary via -e.
#
# After the child run this role regenerates the dynamic inventory into a
# consumer-scoped copy (<slug>-consumer.generated.yml) and refreshes known_hosts,
# mirroring svc07_provision (integration-boundaries.md §4 file-mediated handoff).
#
# IDEMPOTENCE (Req 6): svc-01-bootstrap.yml is idempotent (terraform converges;
# the DB bootstrap is check-then-write), so a re-run against an already-provisioned
# DB converges with zero changes.

# === Phase-2 FIRST STEP — auto-create the project network slice (§2) =========
# fix-consumer-onboarding-prerequisites: when Phase 1 found the project VNet
# ABSENT and auto-create is ON, apply the project's OWN top-level network-slice
# root (its sdn.tf creates VNet p<vlan> + subnet) BEFORE the svc-01 child / the
# workload apply, so the previously-undocumented `terraform apply
# infra/projects/<slug>/` pre-step is folded into the flow. Applies the project's
# own `<slug>-infra` state only (one-state-per-service); the Proxmox token rides
# via TF_VAR_* env (never argv; no_log). The composed svc01_preflight VNet assert
# stays the UNCHANGED backstop (it simply always sees p<vlan> present now).
- name: "Provisioning (network slice) | Auto-create the project VNet when absent"
  when:
    - consumer_autocreate_network_slice | bool
    # WS-C24: only a manifest that declares a guest (database / enabled workload) needs the slice.
    # Defaults to true so an absent fact keeps the previous behavior (fail-safe).
    - consumer_network_slice_required | default(true) | bool
    - not (consumer_vnet_present | default(true) | bool)
  block:
    - name: "Provisioning (network slice) | INFO — auto-creating VNet p{{ consumer_vlan_id }}"
      ansible.builtin.debug:
        msg: >-
          INFO: project VNet 'p{{ consumer_vlan_id }}' absent — applying the
          project network-slice root (state {{ consumer_network_slice_state_name }})
          before provisioning guests.

    # Backend swap-gate (same signal the workload block uses): GitLab HTTP state
    # when the CI vars are present, else the local override (solo/offline default).
    - name: "Provisioning (network slice) | Read the cluster env file for the backend signal"
      ansible.builtin.slurp:
        src: "{{ consumer_repo_root }}/{{ cluster_env_file }}"
      register: consumer_slice_env_slurp
      no_log: true

    - name: "Provisioning (network slice) | Extract env keys (names only, no values)"
      ansible.builtin.set_fact:
        consumer_slice_env_keys: >-
          {{ (consumer_slice_env_slurp.content | b64decode).splitlines()
             | map('trim')
             | reject('match', '^\s*#')
             | select('search', '=')
             | map('regex_replace', '^\s*([^=]+?)\s*=.*$', '\1')
             | list }}

    - name: "Provisioning (network slice) | Detect the GitLab state-backend signal"
      ansible.builtin.set_fact:
        consumer_slice_use_gitlab_backend: >-
          {{ ('CI_API_V4_URL' in consumer_slice_env_keys)
             and ('CI_PROJECT_ID' in consumer_slice_env_keys)
             and ('CI_JOB_TOKEN' in consumer_slice_env_keys) }}

    - name: "Provisioning (network slice) | Ensure local_backend_override.tf (local backend)"
      ansible.builtin.copy:
        dest: "{{ consumer_network_slice_tf_root }}/local_backend_override.tf"
        mode: "0644"
        content: |
          # Local, gitignored state backend for a solo/offline apply — overrides the
          # root's partial backend "http" {}. Never committed (.gitignore: *_override.tf).
          terraform {
            backend "local" {
              path = "{{ consumer_network_slice_state_name }}.tfstate"
            }
          }
      when: not (consumer_slice_use_gitlab_backend | bool)

    - name: "Provisioning (network slice) | Remove local_backend_override.tf (GitLab backend)"
      ansible.builtin.file:
        path: "{{ consumer_network_slice_tf_root }}/local_backend_override.tf"
        state: absent
      when: consumer_slice_use_gitlab_backend | bool

    - name: "Provisioning (network slice) | terraform init (local backend)"
      ansible.builtin.command:
        argv: [terraform, init, -input=false, -reconfigure]
      args:
        chdir: "{{ consumer_network_slice_tf_root }}"
      environment: "{{ consumer_workload_tf_env }}"
      register: consumer_slice_init_local
      changed_when: true
      when: not (consumer_slice_use_gitlab_backend | bool)
      no_log: true

    - name: "Provisioning (network slice) | Derive the per-slug GitLab state address (GitLab backend)"
      ansible.builtin.set_fact:
        consumer_slice_env_pairs: >-
          {{ (consumer_slice_env_slurp.content | b64decode).splitlines()
             | map('trim') | reject('match', '^\s*#') | select('search', '=') | list }}
      when: consumer_slice_use_gitlab_backend | bool
      no_log: true

    - name: "Provisioning (network slice) | Bind the GitLab CI backend values (GitLab backend)"
      ansible.builtin.set_fact:
        consumer_slice_ci_values: >-
          {{ dict(consumer_slice_env_keys | zip(
               consumer_slice_env_pairs
               | map('regex_replace', '^[^=]+=\s*(.*?)\s*$', '\1')
               | map('regex_replace', '^"(.*)"$', '\1') | list)) }}
      when: consumer_slice_use_gitlab_backend | bool
      no_log: true

    - name: "Provisioning (network slice) | terraform init (GitLab HTTP backend, per-slug state)"
      ansible.builtin.command:
        argv:
          - terraform
          - init
          - -input=false
          - -reconfigure
          - "-backend-config=address={{ _addr }}"
          - "-backend-config=lock_address={{ _addr }}/lock"
          - "-backend-config=unlock_address={{ _addr }}/lock"
          - -backend-config=username=gitlab-ci-token
          - "-backend-config=password={{ consumer_slice_ci_values['CI_JOB_TOKEN'] }}"
          - -backend-config=lock_method=POST
          - -backend-config=unlock_method=DELETE
          - -backend-config=retry_wait_min=5
      args:
        chdir: "{{ consumer_network_slice_tf_root }}"
      environment: "{{ consumer_workload_tf_env }}"
      vars:
        _addr: >-
          {{ consumer_slice_ci_values['CI_API_V4_URL'] }}/projects/{{
             consumer_slice_ci_values['CI_PROJECT_ID'] }}/terraform/state/{{
             consumer_network_slice_state_name }}
      register: consumer_slice_init_gitlab
      changed_when: true
      when: consumer_slice_use_gitlab_backend | bool
      no_log: true

    - name: "Provisioning (network slice) | terraform apply (create VNet p{{ consumer_vlan_id }})"
      ansible.builtin.command:
        argv:
          - terraform
          - apply
          - -input=false
          - -auto-approve
          - "-var=project_slug={{ project_slug }}"
      args:
        chdir: "{{ consumer_network_slice_tf_root }}"
      environment: "{{ consumer_workload_tf_env }}"
      register: consumer_slice_apply
      changed_when: "'0 added, 0 changed, 0 destroyed' not in (consumer_slice_apply.stdout | default(''))"
      no_log: true

    - name: "Provisioning (network slice) | Mark the VNet present for downstream steps"
      ansible.builtin.set_fact:
        consumer_vnet_present: true
      changed_when: false

- name: "Provisioning | INFO — Phase 2 start (per-project DB on VLAN {{ consumer_vlan_id }})"
  ansible.builtin.debug:
    msg: >-
      INFO: Phase 2 (Provision) — composing svc-01-bootstrap.yml for
      '{{ project_slug }}' DB on VLAN {{ consumer_vlan_id }}
      (host_index from the Host_Index_Authority ledger).

# Compose the SVC-01 orchestrator child run (Req 4.4). The DB guest's host_index
# is READ from the ledger by the SVC01_Consumer_Root (infra/projects/<slug>/db/
# main.tf resolves it from host-indices.yaml), so we do NOT pass host_index here
# — the per-project db/ root defaults host_index to its ledger-resolved value via
# the reused module. We DO thread project_slug, the Registry-resolved vlan_id,
# engine, tier, svc01_vmid, and the OpenBao address. The child carries its own
# throwaway-guard consult (gated on agent_live_run) in svc01_preflight, so this
# role is LEAF-EXEMPT (no duplicate guard here).
#
# NOTE (WS-C9, ADR-0019): the child is run with `-e svc01_consumer_wrapper=true`,
# so svc01_provision drives the per-project SVC01_Consumer_Root
# infra/projects/<slug>/db/ (state <slug>-db), which resolves vlan_id/host_index
# from the registry/ledger and REUSES the svc-01-sql-database module internally.
# Previously the live flow bypassed the wrapper (state <slug>-svc01-postgres).
# A non-zero child exit propagates to the Phase-2 rescue.
- name: "Provisioning | Compose svc-01-bootstrap.yml to provision + bootstrap the per-project DB"
  ansible.builtin.command:
    argv:
      - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible-playbook"
      - -i
      - ansible/inventory/localhost.yml
      - "{{ consumer_svc01_bootstrap_playbook }}"
      - -e
      - "cluster_env_file={{ cluster_env_file }}"
      - -e
      - "project_slug={{ project_slug }}"
      - -e
      - "vlan_id={{ consumer_vlan_id }}"
      - -e
      - "svc01_vmid={{ consumer_svc01_vmid }}"
      # WS-C9 (ADR-0019): drive the per-project SVC01_Consumer_Root infra/<slug>/db/
      # (state <slug>-db) instead of the reusable svc-01-sql-database root.
      - -e
      - "svc01_consumer_wrapper=true"
      - -e
      - "db_engine={{ consumer_manifest.database.engine | default('postgres') }}"
      - -e
      - "tier={{ consumer_manifest.database.tier | default('small') }}"
      - -e
      - "openbao_addr={{ openbao_addr | default('') }}"
      # Thread the SINGLE Phase-1-resolved datastore (fix-workload-datastore-autodetect)
      # as an EXPLICIT svc01_datastore_id. svc01_preflight gates its own autodetect
      # query/assert on `svc01_datastore_id == sentinel`, so a non-sentinel pre-set
      # value is used verbatim (no second node query) — making the DB guest's
      # datastore provably identical to the workload guest's.
      - -e
      - "svc01_datastore_id={{ consumer_resolved_datastore }}"
  args:
    chdir: "{{ consumer_repo_root }}"
  register: consumer_db_bootstrap_run
  changed_when: "'changed=0' not in (consumer_db_bootstrap_run.stdout | default(''))"
  when: consumer_manifest.database is defined

# --- Regenerate a consumer-scoped dynamic inventory (design "Phase 2") -------
# The SVC-01 installer wrote ansible/inventory/svc-01-sql-database.generated.yml
# against the reusable root. Regenerate from the SAME root into a consumer-scoped
# <slug>-consumer.generated.yml so later phases + the operator have a per-project
# inventory artifact (file-mediated handoff, integration-boundaries.md §4).
- name: "Provisioning | Regenerate the consumer-scoped dynamic inventory"
  ansible.builtin.command:
    argv:
      - "{{ consumer_venv_python }}"
      - ansible/inventory/generate_inventory.py
      - --root
      - "infra/projects/{{ project_slug }}/db"
      - --out
      - "{{ consumer_generated_inventory }}"
  args:
    chdir: "{{ consumer_repo_root }}"
  register: consumer_gen_inventory
  changed_when: true
  when: consumer_manifest.database is defined

- name: "Provisioning | Confirm the consumer-scoped inventory was written"
  ansible.builtin.stat:
    path: "{{ consumer_repo_root }}/{{ consumer_generated_inventory }}"
  register: consumer_generated_inventory_stat
  when: consumer_manifest.database is defined

- name: "Provisioning | Assert the consumer-scoped inventory exists (else halt before Phase 3)"
  ansible.builtin.assert:
    that:
      - "consumer_generated_inventory_stat.stat.exists"
    fail_msg: >-
      generate_inventory.py did not produce {{ consumer_generated_inventory }};
      halting before Phase 3 (Bootstrap).
    success_msg: "Consumer-scoped inventory present: {{ consumer_generated_inventory }}."
  when: consumer_manifest.database is defined

# --- known_hosts refresh for the DB guest IP (mirrors svc01/svc07_provision) --
- name: "Provisioning | Compute the DB guest IP (cidrhost 10.0.<vlan>.0/24, +10)"
  ansible.builtin.set_fact:
    # Single-guest project VLAN -> host_index 0 -> .10 (the ledger value for the
    # dronefleet DB). The authoritative IP is the SVC-01 root's output; this
    # mirror is used only for the known_hosts refresh below.
    consumer_db_guest_ip: "10.0.{{ consumer_vlan_id }}.10"
  changed_when: false
  when: consumer_manifest.database is defined

- name: "Provisioning | Ensure ~/.ssh exists (0700)"
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.ssh"
    state: directory
    mode: "0700"
  when: consumer_manifest.database is defined

- name: "Provisioning | Remove stale known_hosts fingerprints for the DB guest IP"
  ansible.builtin.command:
    argv:
      - ssh-keygen
      - -R
      - "{{ consumer_db_guest_ip }}"
      - -f
      - "{{ ansible_env.HOME }}/.ssh/known_hosts"
  register: consumer_knownhosts_purge
  changed_when: "'updated' in (consumer_knownhosts_purge.stderr | default(''))"
  failed_when: false
  when: consumer_manifest.database is defined

- name: "Provisioning | ssh-keyscan the DB guest IP (30s timeout)"
  ansible.builtin.command:
    argv: [ssh-keyscan, -T, "30", "{{ consumer_db_guest_ip }}"]
  register: consumer_keyscan
  changed_when: false
  failed_when: false
  when: consumer_manifest.database is defined

- name: "Provisioning | Append current host keys to known_hosts"
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.ssh/known_hosts"
    create: true
    mode: "0600"
    marker: "# {mark} consumer onboarding host keys for {{ project_slug }}"
    block: "{{ consumer_keyscan.stdout }}"
  when:
    - consumer_manifest.database is defined
    - (consumer_keyscan.stdout | default('') | trim | length) > 0

- name: "Provisioning | INFO — Phase 2 skipped (no database declared)"
  ansible.builtin.debug:
    msg: "INFO: Phase 2 (Provision) skipped for '{{ project_slug }}' — the Consumer_Manifest declares no database."
  when: consumer_manifest.database is not defined

# =============================================================================
# Optional workload guest (consumer-last-mile-hello-workload §B, task 3.1)
# =============================================================================
# Thread the manifest `workload` block (consumer_manifest.workload) into a
# count-gated `terraform apply` of the per-project Workload_Consumer_Root
# (infra/projects/<slug>/workload/), then regenerate the workload inventory from
# that root's `inventory_hosts` output so the workload guest appears ONLY when
# enabled. Mirrors EXACTLY the SVC-01 provision pattern: the same backend
# swap-gate (GitLab HTTP state vs local override), the same TF_VAR_* token
# handoff (endpoint/token via environment, never argv; no_log), the same
# generate_inventory.py + known_hosts refresh.
#
# STRICT NO-OP (Req 2.3): EVERY task below is gated on
# `consumer_manifest.workload.enabled | default(false)`. A manifest with no
# `workload` block — or `enabled: false` — provisions no guest and adds no host
# to any inventory, behaving exactly as before this feature. The gate is
# evaluated once into `consumer_workload_enabled` so a missing `workload` key
# can never raise.
#
# AGENT-LIVE meta-guard: like the DB apply above, this role is LEAF-EXEMPT — the
# throwaway-guard consult is carried UPSTREAM by consumer_preflight; no duplicate
# guard here.

- name: "Provisioning (workload) | Evaluate the workload gate (strict no-op when absent/false)"
  ansible.builtin.set_fact:
    consumer_workload_enabled: "{{ consumer_manifest.workload.enabled | default(false) | bool }}"
    consumer_workload_count: "{{ consumer_manifest.workload.count | default(1) | int }}"
    consumer_workload_tier: "{{ consumer_manifest.workload.tier | default('small') }}"
  changed_when: false

- name: "Provisioning (workload) | INFO — workload guest disabled (strict no-op)"
  ansible.builtin.debug:
    msg: >-
      INFO: Phase 2 (Provision) — no workload guest for '{{ project_slug }}'
      (the Consumer_Manifest declares no `workload` block, or workload.enabled is
      false). No guest provisioned, no workload host added to any inventory —
      behavior identical to before the last-mile feature (Req 2.3).
  when: not (consumer_workload_enabled | bool)

# Everything below runs ONLY when the workload guest is enabled.
- name: "Provisioning (workload) | Stand up the optional workload guest"
  when: consumer_workload_enabled | bool
  block:
    - name: "Provisioning (workload) | INFO — provisioning the workload guest on VLAN {{ consumer_vlan_id }}"
      ansible.builtin.debug:
        msg: >-
          INFO: Phase 2 (Provision) — applying the Workload_Consumer_Root
          (infra/projects/{{ project_slug }}/workload/) with
          workload_enabled=true, workload_count={{ consumer_workload_count }},
          tier={{ consumer_workload_tier }} (state {{ consumer_workload_state_name }},
          host_index read from the Host_Index_Authority ledger).

    # --- Resolve the operator SSH public key into a JSON list (mirrors svc01) --
    - name: "Provisioning (workload) | Bind + expanduser the operator SSH public-key file path"
      ansible.builtin.set_fact:
        consumer_workload_ssh_key_file: >-
          {{ (consumer_tfvars['TF_VAR_operator_ssh_public_key_file'] | default('') | trim) | expanduser }}
      no_log: true

    - name: "Provisioning (workload) | Read + JSON-encode the operator SSH public key (1-element list)"
      ansible.builtin.set_fact:
        consumer_workload_ssh_keys_json: >-
          {{ [lookup('ansible.builtin.file', consumer_workload_ssh_key_file) | trim] | to_json }}
      when: (consumer_workload_ssh_key_file | default('') | length) > 0

    - name: "Provisioning (workload) | Default the operator SSH public-key list to empty when no path is set"
      ansible.builtin.set_fact:
        consumer_workload_ssh_keys_json: "[]"
      when: (consumer_workload_ssh_key_file | default('') | length) == 0

    # --- Resolve the generic LXC template + datastore from the cluster env ----
    # Datastore comes from the SINGLE Phase-1 resolution (consumer_resolved_datastore,
    # fix-workload-datastore-autodetect) — a real, node-validated value, never the
    # AUTODETECT sentinel — so the workload apply ALWAYS passes it (no omit-on-sentinel
    # branch) and it matches the datastore the composed svc-01 child used.
    - name: "Provisioning (workload) | Bind the resolved LXC template + datastore facts"
      ansible.builtin.set_fact:
        consumer_workload_template_file_id: "{{ consumer_tfvars['TF_VAR_openbao_template_file_id'] | default('') }}"
        consumer_workload_resolved_datastore: "{{ consumer_resolved_datastore }}"
      no_log: true

    # --- Backend swap-gate selection (identical shape to svc01_provision) -----
    - name: "Provisioning (workload) | Read the cluster env file to detect the state-backend signal"
      ansible.builtin.slurp:
        src: "{{ consumer_repo_root }}/{{ cluster_env_file }}"
      register: consumer_workload_env_slurp
      no_log: true

    - name: "Provisioning (workload) | Reduce the env file to KEY=VALUE lines"
      ansible.builtin.set_fact:
        consumer_workload_env_pairs: >-
          {{ (consumer_workload_env_slurp.content | b64decode).splitlines()
             | map('trim')
             | reject('match', '^\s*#')
             | select('search', '=')
             | list }}
      no_log: true

    - name: "Provisioning (workload) | Extract the set of env keys (names only, no values)"
      ansible.builtin.set_fact:
        consumer_workload_env_keys: >-
          {{ consumer_workload_env_pairs | map('regex_replace', '^\s*([^=]+?)\s*=.*$', '\1') | list }}

    - name: "Provisioning (workload) | Decide the Terraform backend (swap gate)"
      ansible.builtin.set_fact:
        consumer_workload_use_gitlab_backend: >-
          {{ ('CI_API_V4_URL' in consumer_workload_env_keys)
             and ('CI_PROJECT_ID' in consumer_workload_env_keys)
             and ('CI_JOB_TOKEN' in consumer_workload_env_keys) }}

    - name: "Provisioning (workload) | Extract GitLab CI state-backend values (GitLab backend only)"
      ansible.builtin.set_fact:
        consumer_workload_env_ci_values: >-
          {{ dict(consumer_workload_env_keys | zip(
               consumer_workload_env_pairs
               | map('regex_replace', '^[^=]+=\s*(.*?)\s*$', '\1')
               | map('regex_replace', '^"(.*)"$', '\1')
               | list)) }}
      when: consumer_workload_use_gitlab_backend | bool
      no_log: true

    - name: "Provisioning (workload) | Derive the per-slug GitLab state address + job token (GitLab backend only)"
      ansible.builtin.set_fact:
        consumer_workload_gitlab_state_address: >-
          {{ consumer_workload_env_ci_values['CI_API_V4_URL'] }}/projects/{{
             consumer_workload_env_ci_values['CI_PROJECT_ID'] }}/terraform/state/{{ consumer_workload_state_name }}
        consumer_workload_ci_job_token: "{{ consumer_workload_env_ci_values['CI_JOB_TOKEN'] }}"
      when: consumer_workload_use_gitlab_backend | bool
      no_log: true

    - name: "Provisioning (workload) | Log the Terraform backend selection (INFO)"
      ansible.builtin.debug:
        msg: >-
          INFO: workload Terraform backend:
          {{ 'GitLab HTTP state (' ~ consumer_workload_state_name ~ ')'
             if (consumer_workload_use_gitlab_backend | bool)
             else 'LOCAL (local_backend_override.tf) — solo/offline Developer-B default; '
                  ~ 'per-instance state ' ~ consumer_workload_state_name }}

    - name: "Provisioning (workload) | Ensure local_backend_override.tf is present (local backend)"
      ansible.builtin.copy:
        dest: "{{ consumer_workload_tf_root }}/local_backend_override.tf"
        mode: "0644"
        content: |
          # Local, gitignored state backend for a solo/offline apply — overrides the
          # root's partial backend "http" {}. Never committed (.gitignore: *_override.tf).
          #
          # PER-INSTANCE state keyed on the project slug (<slug>-workload.tfstate) so
          # each project's workload guest gets its OWN isolated local state, matching
          # the GitLab backend's per-slug isolation (integration-boundaries §5). A
          # bare filename is relative to the root dir, so the state lands inside the
          # workload/ root.
          terraform {
            backend "local" {
              path = "{{ consumer_workload_state_name }}.tfstate"
            }
          }
      when: not (consumer_workload_use_gitlab_backend | bool)

    - name: "Provisioning (workload) | Remove any local_backend_override.tf (GitLab HTTP backend)"
      ansible.builtin.file:
        path: "{{ consumer_workload_tf_root }}/local_backend_override.tf"
        state: absent
      when: consumer_workload_use_gitlab_backend | bool

    - name: "Provisioning (workload) | terraform init (local backend)"
      ansible.builtin.command:
        argv: [terraform, init, -input=false, -reconfigure]
      args:
        chdir: "{{ consumer_workload_tf_root }}"
      environment: "{{ consumer_workload_tf_env }}"
      register: consumer_workload_tf_init_local
      changed_when: true
      when: not (consumer_workload_use_gitlab_backend | bool)
      no_log: true

    - name: "Provisioning (workload) | terraform init (GitLab HTTP backend, per-slug state)"
      ansible.builtin.command:
        argv:
          - terraform
          - init
          - -input=false
          - -reconfigure
          - "-backend-config=address={{ consumer_workload_gitlab_state_address }}"
          - "-backend-config=lock_address={{ consumer_workload_gitlab_state_address }}/lock"
          - "-backend-config=unlock_address={{ consumer_workload_gitlab_state_address }}/lock"
          - -backend-config=username=gitlab-ci-token
          - "-backend-config=password={{ consumer_workload_ci_job_token }}"
          - -backend-config=lock_method=POST
          - -backend-config=unlock_method=DELETE
          - -backend-config=retry_wait_min=5
      args:
        chdir: "{{ consumer_workload_tf_root }}"
      environment: "{{ consumer_workload_tf_env }}"
      register: consumer_workload_tf_init_gitlab
      changed_when: true
      when: consumer_workload_use_gitlab_backend | bool
      no_log: true

    # --- guest-variable assembly + apply --------------------------------------
    - name: "Provisioning (workload) | Assert required guest variables are present (before apply)"
      ansible.builtin.assert:
        that:
          - "consumer_proxmox_node_name is defined and (consumer_proxmox_node_name | trim | length > 0)"
          - "consumer_workload_template_file_id is defined and (consumer_workload_template_file_id | trim | length > 0)"
          - "consumer_workload_vmid is defined"
          - "project_slug is defined and (project_slug | trim | length > 0)"
          - "consumer_vlan_id is defined"
        fail_msg: >-
          A required workload guest variable is absent; refusing `terraform apply`.
          Required: project_slug, resolved VLAN, proxmox_node_name, LXC template,
          consumer_workload_vmid.
        success_msg: "All required workload guest variables present; proceeding to terraform apply."

    # The workload root resolves vlan_id from the Registry and host_index from the
    # Host_Index_Authority ledger itself (main.tf) — so we thread ONLY the opt-in
    # flags and the per-cluster plumbing, never vlan_id/host_index. The datastore
    # is ALWAYS passed as the single Phase-1-resolved value (consumer_resolved_datastore,
    # fix-workload-datastore-autodetect) — a real, node-validated datastore, never the
    # AUTODETECT sentinel — so it can no longer fall back to the root's hard-coded
    # local-zfs default on a node that lacks it. Booleans are lowered for terraform
    # (Jinja renders Python True/False capitalized).
    - name: "Provisioning (workload) | terraform apply (non-interactive, auto-approve)"
      ansible.builtin.command:
        argv: >-
          {{ ['terraform', 'apply', '-input=false', '-auto-approve',
              '-var=project_slug=' ~ project_slug,
              '-var=workload_enabled=' ~ (consumer_workload_enabled | bool | string | lower),
              '-var=workload_count=' ~ (consumer_workload_count | int),
              '-var=tier=' ~ consumer_workload_tier,
              '-var=proxmox_node_name=' ~ consumer_proxmox_node_name,
              '-var=workload_vmid=' ~ (consumer_workload_vmid | int),
              '-var=workload_template_file_id=' ~ consumer_workload_template_file_id,
              '-var=operator_ssh_public_keys=' ~ consumer_workload_ssh_keys_json,
              '-var=workload_datastore_id=' ~ consumer_workload_resolved_datastore] }}
      args:
        chdir: "{{ consumer_workload_tf_root }}"
      environment: "{{ consumer_workload_tf_env }}"
      register: consumer_workload_tf_apply
      changed_when: "'0 added, 0 changed, 0 destroyed' not in consumer_workload_tf_apply.stdout"
      no_log: true

    # --- Regenerate the workload inventory from the root's inventory_hosts -----
    # File-mediated handoff (integration-boundaries §4): generate_inventory.py
    # runs `terraform output -json` in the workload root and renders the workload
    # guest's host into <slug>-workload.generated.yml. The root's inventory_hosts
    # output is the single-element list for the enabled guest (empty when
    # disabled), so the workload host appears ONLY because the guest is enabled.
    - name: "Provisioning (workload) | Generate the workload inventory from Terraform outputs"
      ansible.builtin.command:
        argv:
          - "{{ consumer_venv_python }}"
          - ansible/inventory/generate_inventory.py
          - --root
          - "infra/projects/{{ project_slug }}/workload"
          - --out
          - "{{ consumer_workload_generated_inventory }}"
      args:
        chdir: "{{ consumer_repo_root }}"
      register: consumer_workload_gen_inventory
      changed_when: true

    - name: "Provisioning (workload) | Confirm the workload inventory file was written"
      ansible.builtin.stat:
        path: "{{ consumer_repo_root }}/{{ consumer_workload_generated_inventory }}"
      register: consumer_workload_generated_inventory_stat

    - name: "Provisioning (workload) | Assert the workload inventory exists (else halt before Phase 3)"
      ansible.builtin.assert:
        that:
          - "consumer_workload_generated_inventory_stat.stat.exists"
        fail_msg: >-
          generate_inventory.py did not produce {{ consumer_workload_generated_inventory }};
          halting before Phase 3 (Bootstrap).
        success_msg: "Workload inventory present: {{ consumer_workload_generated_inventory }}."

    # --- known_hosts refresh for the workload guest IP (mirrors svc01) --------
    # host_index for the role_code=workload ledger row on this project VLAN is 1
    # (-> .11) per the committed ledger; the authoritative IP is the workload
    # root's output, this mirror is used only for the known_hosts refresh.
    - name: "Provisioning (workload) | Compute the workload guest IP (cidrhost 10.0.<vlan>.0/24, +11)"
      ansible.builtin.set_fact:
        consumer_workload_guest_ip: "10.0.{{ consumer_vlan_id }}.11"
      changed_when: false

    - name: "Provisioning (workload) | Ensure ~/.ssh exists (0700)"
      ansible.builtin.file:
        path: "{{ ansible_env.HOME }}/.ssh"
        state: directory
        mode: "0700"

    - name: "Provisioning (workload) | Remove stale known_hosts fingerprints for the workload guest IP"
      ansible.builtin.command:
        argv:
          - ssh-keygen
          - -R
          - "{{ consumer_workload_guest_ip }}"
          - -f
          - "{{ ansible_env.HOME }}/.ssh/known_hosts"
      register: consumer_workload_knownhosts_purge
      changed_when: "'updated' in (consumer_workload_knownhosts_purge.stderr | default(''))"
      failed_when: false

    - name: "Provisioning (workload) | ssh-keyscan the workload guest IP (30s timeout)"
      ansible.builtin.command:
        argv: [ssh-keyscan, -T, "30", "{{ consumer_workload_guest_ip }}"]
      register: consumer_workload_keyscan
      changed_when: false
      failed_when: false

    - name: "Provisioning (workload) | Append current host keys to known_hosts"
      ansible.builtin.blockinfile:
        path: "{{ ansible_env.HOME }}/.ssh/known_hosts"
        create: true
        mode: "0600"
        marker: "# {mark} consumer onboarding workload host keys for {{ project_slug }}"
        block: "{{ consumer_workload_keyscan.stdout }}"
      when: (consumer_workload_keyscan.stdout | default('') | trim | length) > 0

    # --- §6: consumer ingress for a USER-FACING workload --------------------
    # fix-consumer-ingress-browser-reachable-oidc. When the manifest declares an
    # `expose` block (enabled), resolve the REAL base-domain host rule + the
    # ADR-0018 route inputs the openbao-agent deploy step feeds to the shared
    # traefik_route path (replacing the *.example.test placeholder), so the
    # workload is published through the shared Traefik at
    # <expose.host>.<platform_domain> and its registered OIDC redirect URI is
    # reachable. These facts are consumed by the workload app-deploy step
    # (openbao-agent); here we resolve them + record for the handoff. No host
    # port, no Docker labels — the file-provider Route_Fragment (ADR-0018) only.
    - name: "Provisioning (workload) | §6 — resolve the expose ingress inputs (user-facing)"
      ansible.builtin.set_fact:
        consumer_expose_enabled: "{{ consumer_manifest.expose.enabled | default(false) | bool }}"
        consumer_expose_host_fqdn: >-
          {{ consumer_manifest.expose.host ~ '.' ~ consumer_platform_domain }}
        # Feed the EXISTING openbao-agent ADR-0018 route wiring real inputs.
        openbao_agent_workload_host_rule: >-
          {{ consumer_manifest.expose.host ~ '.' ~ consumer_platform_domain }}
        openbao_agent_workload_http_port: "{{ consumer_manifest.expose.port | default(8080) }}"
        openbao_agent_traefik_route_enabled: true
        openbao_agent_mock_edge_network: false
      changed_when: false
      when: (consumer_manifest.expose.enabled | default(false)) | bool

    # Scoped FAIL-CLOSED cross-VLAN reachability preflight: Traefik (VLAN 20) must
    # be able to reach the workload backend on the project VLAN via the sanctioned
    # host L3 gateway (integration-boundaries §6, ADR-0004). This spec does NOT
    # configure the gateway — that is owned by fix-sdn-gateway-project-vlan-noop;
    # here we only CHECK and NAME it, so an expose route is never silently broken
    # ("healthy infra-side but unusable"). A read-only TCP reachability probe
    # delegated to the Traefik guest.
    #
    # It probes L3 reachability on consumer_expose_l3_probe_port (sshd, 22) —
    # NOT the application port: in Phase 2 the workload guest is freshly
    # provisioned and Docker + the workload stack only land in Phase 3, so the
    # app port cannot be listening yet (probing it failed every fresh bring-up
    # and mis-blamed the gateway — caught live). sshd IS up (the keyscan above
    # just succeeded), so a failure here isolates the cross-VLAN gateway gap.
    # The end-to-end app-route check through Traefik runs post-deploy in Phase 4
    # (consumer_handoff).
    - name: "Provisioning (workload) | §6 — cross-VLAN reachability preflight (Traefik -> backend)"
      ansible.builtin.wait_for:
        host: "{{ consumer_workload_guest_ip }}"
        port: "{{ consumer_expose_l3_probe_port | int }}"
        timeout: 15
      delegate_to: "{{ consumer_traefik_guest_host }}"
      vars:
        ansible_connection: ssh
        ansible_user: "{{ consumer_traefik_guest_ssh_user }}"
        ansible_python_interpreter: "{{ consumer_traefik_guest_python }}"
      register: consumer_expose_reach
      failed_when: false
      changed_when: false
      when: (consumer_manifest.expose.enabled | default(false)) | bool

    - name: "Provisioning (workload) | §6 — fail closed if Traefik cannot reach the backend"
      ansible.builtin.assert:
        that:
          - "(consumer_expose_reach.state | default('')) == 'started'"
        fail_msg: >-
          expose is enabled but Traefik ({{ consumer_traefik_guest_host }}, VLAN 20)
          cannot reach the workload guest {{ consumer_workload_guest_ip }} (L3
          probe tcp/{{ consumer_expose_l3_probe_port }}) on project VLAN
          {{ consumer_vlan_id }}. The project VLAN's host L3 gateway/NAT is unmet —
          this is owned by fix-sdn-gateway-project-vlan-noop (the §3 fix): ensure
          the gateway serves VLAN {{ consumer_vlan_id }} (10.0.{{ consumer_vlan_id }}.1
          bound on p{{ consumer_vlan_id }}), then re-run. The published route would
          otherwise be silently broken (healthy infra-side but unreachable).
        success_msg: "Traefik can reach the workload backend on the project VLAN."
        quiet: true
      when: (consumer_manifest.expose.enabled | default(false)) | bool
