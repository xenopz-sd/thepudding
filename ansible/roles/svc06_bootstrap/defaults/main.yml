---
# defaults/main.yml — svc06_bootstrap (SVC-06 installer — Phase 3)
#
# Phase-3 defaults. Cross-phase constants (cluster_env_file, svc06_repo_root,
# svc06_generated_inventory, svc06_platform_domain) are play-level. NO secret
# here.

# Whether to run the org-provision step as part of bootstrap. On by default — a
# fresh bring-up onboards a first/throwaway org to prove the OIDC path end-to-end
# (FR-3/FR-5). The org slug to provision is svc06_bootstrap_org_slug.
svc06_run_org_provision: true

# The project slug onboarded to ZITADEL SSO during bootstrap (its org becomes
# proj-<slug>, its OIDC app <slug>-webapp). A throwaway slug on a from-scratch
# acceptance run; a real project slug in production onboarding.
svc06_bootstrap_org_slug: "svc06-smoke"

# The OpenBao address the zitadel-server role reads the masterkey/DB-password
# from (and writes the masterkey to). Forwarded as `zitadel_openbao_addr` to the
# zitadel.yml run — ZITADEL's OpenBao READ gate. Defaults to the SVC-07 OpenBao
# primary's VLAN-20 address (NET-00 host_index 0 -> 10.0.20.10) so a standard
# bring-up WIRES the handoff by default; this is the SAME value svc06_provision
# forwards to the backing-DB child as `openbao_addr` (SVC-01's WRITE gate), so
# both gates resolve to the same OpenBao source and the same app_password flows
# end-to-end. (Was "" — which disabled the read and left ZITADEL presenting an
# empty password -> SQLSTATE 28P01; see fix-svc06-zitadel-db-app-password-mismatch.)
# Override to "" ONLY for a deliberate dev/offline run with an explicit
# zitadel_db_password_override.
svc06_openbao_addr: "10.0.20.10"

# Org-provision reachability path selector.
#
# The guest-run org-provision path is the homelab/Traefik-less DEFAULT (ADR-0018
# cross-guest cleartext-h2c-behind-Traefik): it resolves the ZITADEL container IP
# ON THE GUEST and runs the helper there against the container IP:8080 with the
# external-domain Host header (see the zitadel-org-provision dev path), which
# works regardless of whether ZITADEL serves its own TLS. The correct signal is
# "homelab/Traefik-less bring-up where the public ZITADEL Traefik endpoint +
# public DNS is NOT reachable from the control node" — NOT zitadel_tls_self_signed
# (which only says "ZITADEL serves its own TLS", not "run org-provision on the
# guest"; gating on it was the Layer-B defect — see
# fix-svc06-org-provision-delegate-to-crash).
#
# The guest IP is DERIVED from the ZITADEL guest's host_index
# (svc06_zitadel_host_index, defined in svc06_provision/defaults and in play
# scope via import_role) so it stays single-sourced to the host-index ledger
# (NET-00 10.0.<vlan>.(10+index)). The `| default(5)` fallback mirrors the
# svc06_handoff role's pattern and resolves to the documented NET-00 literal
# 10.0.20.15 (host_index 5) if the var is not in scope — NEVER re-introduce the
# zitadel_tls_self_signed gate.
#
# Set svc06_org_provision_via_traefik=true for a real public-DNS deployment to
# FORCE the control-node Traefik path (guest host empty -> the production
# https://auth.<domain> path runs on the control node).
svc06_org_provision_via_traefik: false
svc06_zitadel_dev_guest_host: >-
  {{ '' if (svc06_org_provision_via_traefik | default(false) | bool)
     else ('10.0.20.' ~ (10 + (svc06_zitadel_host_index | default(5) | int))) }}
