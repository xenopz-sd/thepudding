---
# defaults/main.yml — svc03_clean_slate (SVC-03 Garage installer — clean-slate branch)
#
# Clean-slate phase-specific defaults. Cross-phase constants (clean_slate,
# clean_slate_confirm, cluster_env_file, svc03_repo_root, svc03_venv_python,
# svc03_tf_root, svc03_cluster_env_helper, svc03_vmids) stay as play-level
# vars. NO secret value ever lives here. Derived from the svc09_clean_slate defaults.

# Proxmox host SSH address for the Clean_Slate_Reset path. The delegated
# clean-slate.yml runs `pct` ON THE NODE, so it targets the Proxmox-host
# inventory, whose ansible_host is a committed placeholder overridden at run
# time. Supply the real LAN IP with `-e svc03_proxmox_host=<real-proxmox-lan-ip>`.
# Unset by default; the clean-slate branch fails fast (naming this var) if a
# reset is requested without it. Not needed on the normal install path.
svc03_proxmox_host: ""
# The Proxmox-host inventory clean-slate.yml expects (pct runs on the node).
svc03_proxmox_host_inventory: ansible/inventory/proxmox-hosts.yml

# The Traefik guest the S3 Route_Fragment lives on (cleanup target). Kept in sync
# with garage_install/defaults.
svc03_traefik_guest_host: "10.0.20.12"
svc03_traefik_guest_user: "root"
svc03_traefik_guest_python: "/usr/bin/python3"
svc03_traefik_dynamic_config_dir: "/etc/traefik/dynamic"
