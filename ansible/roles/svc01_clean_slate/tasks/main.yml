---
# tasks/main.yml — svc01_clean_slate (SVC-01 installer — clean-slate branch)
#
# Clone of svc09_clean_slate for the single per-project DB guest. Agent-live
# guard consult FIRST (gated), confirmation gate, independent node-name resolve,
# single-target delegate to terraform_clean_slate, empty-baseline verification.

- name: "Clean-Slate | Consult the throwaway-cluster authorization guard (Agent_Live_Run only)"
  ansible.builtin.command:
    argv:
      - "{{ svc01_venv_python }}"
      - "{{ svc01_throwaway_guard }}"
      - --service
      - svc01
      - --env-file
      - "{{ cluster_env_file }}"
      - --allowlist
      - "{{ svc01_throwaway_allowlist }}"
  args:
    chdir: "{{ svc01_repo_root }}"
  register: svc01_throwaway_decision
  changed_when: false
  failed_when: false
  when: agent_live_run | default(false) | bool

- name: "Clean-Slate | INFO — agent-live authorization decision"
  ansible.builtin.debug:
    msg: >-
      INFO: agent-live authorization:
      {{ (svc01_throwaway_decision.stdout | default('{}') | from_json).reason | default('no decision') }}
  when: agent_live_run | default(false) | bool

- name: "Clean-Slate | Refuse the reset unless the throwaway guard AUTHORIZED it"
  ansible.builtin.assert:
    that:
      - "svc01_throwaway_decision.rc == 0"
    fail_msg: >-
      Agent-live clean-slate REFUSED by the throwaway-cluster guard:
      {{ (svc01_throwaway_decision.stdout | default('{}') | from_json).reason
         | default('guard produced no decision') }}.
      No container was destroyed and no Terraform state was modified.
    success_msg: "Throwaway-cluster guard AUTHORIZED the agent-live clean-slate."
  when: agent_live_run | default(false) | bool

- name: "Clean-Slate | Prompt for explicit confirmation (300s timeout; skipped on force)"
  ansible.builtin.pause:
    prompt: >-
      DESTRUCTIVE Clean-Slate reset of the SVC-01 DB for project '{{ project_slug }}'
      requested. This will pct-destroy container {{ svc01_vmid }} and remove it
      from Terraform state. Type 'yes' to proceed, anything else to abort
  register: svc01_clean_slate_prompt
  when: (clean_slate_confirm | default('')) != 'force'

- name: "Clean-Slate | Resolve whether the reset is confirmed"
  ansible.builtin.set_fact:
    svc01_clean_slate_confirmed: >-
      {{ (clean_slate_confirm | default('')) == 'force'
         or ((svc01_clean_slate_prompt.user_input | default('') | trim | lower) in ['yes', 'y']) }}

- name: "Clean-Slate | Abort with non-zero exit when not confirmed (destroys nothing)"
  ansible.builtin.fail:
    msg: >-
      Clean-Slate reset ABORTED — confirmation not given. Nothing destroyed.
      Re-run with 'yes' at the prompt, or -e clean_slate_confirm=force.
  when: not (svc01_clean_slate_confirmed | bool)

- name: "Clean-Slate | Resolve cluster env for the Proxmox node name"
  ansible.builtin.command:
    argv:
      - "{{ svc01_venv_python }}"
      - "{{ svc01_cluster_env_helper }}"
      - "--env-file"
      - "{{ cluster_env_file }}"
  args:
    chdir: "{{ svc01_repo_root }}"
  register: svc01_cs_env_resolve
  changed_when: false
  no_log: true

- name: "Clean-Slate | Bind the resolved Proxmox node name (no_log)"
  ansible.builtin.set_fact:
    proxmox_node_name: "{{ (svc01_cs_env_resolve.stdout | from_json)['TF_VAR_proxmox_node_name'] }}"
  no_log: true

- name: "Clean-Slate | Assert the Proxmox host SSH address was supplied"
  ansible.builtin.assert:
    that:
      - "svc01_proxmox_host is defined"
      - "(svc01_proxmox_host | trim | length) > 0"
    fail_msg: >-
      The reset delegates to clean-slate.yml against the Proxmox-host inventory
      (runs `pct` on the node). Supply -e svc01_proxmox_host=<real-proxmox-lan-ip>.
      Nothing was destroyed.
    success_msg: "Proxmox host SSH address supplied for the reset."

- name: "Clean-Slate | Assemble the single SVC-01 clean_slate_target"
  ansible.builtin.set_fact:
    svc01_clean_slate_targets:
      - name: "svc01-{{ vlan_id }}-01"
        terraform_root: infra/projects/svc-01-sql-database
        resource_address: proxmox_virtual_environment_container.db
        node: "{{ proxmox_node_name }}"
        vmid: "{{ svc01_vmid }}"

- name: "Clean-Slate | Delegate the reset to clean-slate.yml (one child run per target)"
  ansible.builtin.command:
    argv:
      - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible-playbook"
      - -i
      - "{{ svc01_proxmox_host_inventory }}"
      - ansible/playbooks/clean-slate.yml
      - --extra-vars
      - "ansible_host={{ svc01_proxmox_host }}"
      - -e
      - clean_slate_enabled=true
      - -e
      - "clean_slate_confirm={{ item.vmid }}"
      - -e
      - "{{ {'clean_slate_targets': [item]} | to_json }}"
  args:
    chdir: "{{ svc01_repo_root }}"
  loop: "{{ svc01_clean_slate_targets }}"
  loop_control:
    label: "{{ item.name }} (vmid {{ item.vmid }})"
  register: svc01_clean_slate_runs
  changed_when: "'changed=0' not in (svc01_clean_slate_runs.stdout | default(''))"

- name: "Clean-Slate | VERIFY — list any surviving SVC-01 container on the host (pct list)"
  ansible.builtin.command:
    argv:
      - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible"
      - proxmox
      - -i
      - "{{ svc01_proxmox_host_inventory }}"
      - --extra-vars
      - "ansible_host={{ svc01_proxmox_host }}"
      - -m
      - ansible.builtin.command
      - -a
      - "pct list"
  args:
    chdir: "{{ svc01_repo_root }}"
  register: svc01_pct_list
  changed_when: false
  failed_when: false

- name: "Clean-Slate | Compute the set of surviving SVC-01 container VMIDs"
  ansible.builtin.set_fact:
    svc01_surviving_vmids: >-
      {{ [svc01_vmid | string] | select('in', (svc01_pct_list.stdout | default(''))) | list }}

# Zero RESOURCES of ANY kind in the SVC-01 Terraform state. The child
# clean-slate.yml run above already destroyed the DB guest and state-rm'd its
# container address, but the SVC-01 root carries the non-guest
# `module.*.terraform_data.input_guards` anchor (via proxmox-compute), which the
# container-only state rm leaves behind (the residue bug, spec
# fix-svc07-clean-slate-terraform-data-residue). A correct clean-slate must leave
# `terraform state list` EMPTY, so enumerate every remaining ADDRESS and
# `terraform state rm` it PROVIDER-FREE (NOT `terraform destroy`, Req 2.5). All
# ops run on the CONTROL NODE.
- name: "Clean-Slate | List ALL remaining addresses in the SVC-01 Terraform state (residue sweep)"
  ansible.builtin.command:
    argv: [terraform, state, list]
  args:
    chdir: "{{ svc01_tf_root }}"
  register: svc01_residual_state_list
  changed_when: false
  failed_when: false

- name: "Clean-Slate | Compute the residual (non-guest terraform_data) addresses to remove"
  ansible.builtin.set_fact:
    svc01_residual_state_addrs: >-
      {{ (svc01_residual_state_list.stdout | default('')).splitlines()
         | map('trim') | select('ne', '') | list }}

- name: "Clean-Slate | Remove ALL remaining state addresses provider-free (terraform state rm)"
  ansible.builtin.command:
    argv: [terraform, state, rm, "{{ item }}"]
  args:
    chdir: "{{ svc01_tf_root }}"
  loop: "{{ svc01_residual_state_addrs }}"
  loop_control:
    label: "{{ item }}"
  register: svc01_residual_state_rm
  changed_when: "'Removed' in (svc01_residual_state_rm.stdout | default(''))"
  failed_when:
    - (svc01_residual_state_rm.rc | default(1)) != 0
    - "'No matching objects' not in (svc01_residual_state_rm.stdout | default(''))"
    - "'No matching objects' not in (svc01_residual_state_rm.stderr | default(''))"

- name: "Clean-Slate | VERIFY — list the FULL SVC-01 Terraform state after the residue sweep"
  ansible.builtin.command:
    argv: [terraform, state, list]
  args:
    chdir: "{{ svc01_tf_root }}"
  register: svc01_state_list
  changed_when: false
  failed_when: false

- name: "Clean-Slate | Compute the set of surviving SVC-01 state addresses (FULL state)"
  ansible.builtin.set_fact:
    svc01_surviving_state_addrs: >-
      {{ (svc01_state_list.stdout | default('')).splitlines()
         | map('trim') | select('ne', '') | list }}

- name: "Clean-Slate | GATE — assert an empty baseline (0 containers, 0 state), Req 2.2"
  ansible.builtin.assert:
    that:
      - "(svc01_surviving_vmids | length) == 0"
      - "(svc01_surviving_state_addrs | length) == 0"
    fail_msg: >-
      Clean-Slate reset did NOT reach an empty baseline. Surviving container(s):
      {{ svc01_surviving_vmids | default([]) | join(', ') | default('none', true) }};
      surviving state address(es):
      {{ svc01_surviving_state_addrs | default([]) | join(', ') | default('none', true) }}.
    success_msg: "Clean-Slate reset complete — zero SVC-01 containers + EMPTY SVC-01 state."
