---
# tasks/create.yml — path (a): create a human login user in the project's org (ADR-0023).
# Authenticates with the org's ORG_USER_MANAGER PAT read from OpenBao. The instance IAM_OWNER
# provisioning token is deliberately NOT consulted: the credential used here cannot create orgs,
# cannot act on another org, and cannot change the org's projects. Idempotent: an existing
# username converges (created=false). The PAT and the new user's password travel in the child ENV
# only; every task carrying them is no_log.
- name: "ZITADEL-user | Assert the user to create is fully described"
  ansible.builtin.assert:
    that:
      - zup_username | trim | length > 0
      - zup_first_name | trim | length > 0
      - zup_last_name | trim | length > 0
      - zup_email | trim | length > 0
    fail_msg: "zup_username, zup_first_name, zup_last_name and zup_email are all required to create a user."
    quiet: true
- name: "ZITADEL-user | Bind the new user's initial password from the environment (no_log)"
  ansible.builtin.set_fact:
    zup_new_user_password: "{{ lookup('ansible.builtin.env', 'ZITADEL_NEW_USER_PASSWORD') | default('', true) }}"
  no_log: true
  changed_when: false
- name: "ZITADEL-user | Assert an initial password was supplied (environment only, never a variable or argv)"
  ansible.builtin.assert:
    that:
      - zup_new_user_password | length > 0
    fail_msg: >-
      Set ZITADEL_NEW_USER_PASSWORD in the environment for this run (the user's initial password;
      with zup_password_change_required=true they must change it at first login). It is never
      accepted as a variable or on the command line.
    quiet: true
  no_log: true
- name: "ZITADEL-user | Read the org's user-manager PAT from OpenBao (no_log)"
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'exec', '-e', 'BAO_ADDR=' ~ zup_openbao_cli_bao_addr, '-e', 'BAO_TOKEN=' ~ zup_bao_token,
          zup_openbao_primary_container_name, zup_openbao_bao_bin, 'kv', 'get']
         + (['-tls-skip-verify'] if (zup_openbao_tls_skip_verify | bool) else [])
         + ['-field=' ~ zup_openbao_usermgr_token_field, zup_openbao_usermgr_secret_path] }}
  delegate_to: "{{ zup_openbao_cli_host }}"
  vars:
    ansible_connection: ssh
    ansible_user: "{{ zup_openbao_cli_user | default('root') }}"
    ansible_python_interpreter: "{{ zup_openbao_cli_python | default('/usr/bin/python3') }}"
  register: zup_pat_read
  failed_when: false
  changed_when: false
  no_log: true
- name: "ZITADEL-user | Fail fast if the user-manager PAT is absent (names the path, no value)"
  ansible.builtin.assert:
    that:
      - (zup_pat_read.rc | default(1)) == 0
      - (zup_pat_read.stdout | default('') | trim | length) > 0
    fail_msg: >-
      No user-manager PAT found in OpenBao at {{ zup_openbao_usermgr_secret_path }} field
      '{{ zup_openbao_usermgr_token_field }}'. It is minted when the project is onboarded to SSO
      (zitadel-org-provision / the consumer onboarding with an `sso` block and OpenBao wired).
      Onboard the project first, then re-run. Nothing was created.
    quiet: true
  no_log: true
- name: "ZITADEL-user | Create the human user in org {{ zup_org_name }} (idempotent, no_log)"
  ansible.builtin.command:
    argv: >-
      {{ [zup_venv_python, zup_helper, '--base-url', zup_base_url]
         + (['--insecure'] if (zup_base_url_tls_skip_verify | bool) else [])
         + ['create-user',
            '--username', zup_username,
            '--first-name', zup_first_name,
            '--last-name', zup_last_name,
            '--email', zup_email]
         + ([] if (zup_password_change_required | bool) else ['--no-password-change']) }}
  args:
    chdir: "{{ zup_repo_root }}"
  environment:
    ZITADEL_USERMGR_TOKEN: "{{ zup_pat_read.stdout | trim }}"
    ZITADEL_NEW_USER_PASSWORD: "{{ zup_new_user_password }}"
  register: zup_create_run
  changed_when: (zup_create_run.stdout | default('{}') | from_json).created | default(false)
  no_log: true
- name: "ZITADEL-user | INFO — outcome (non-secret)"
  ansible.builtin.debug:
    msg: >-
      INFO: user '{{ zup_username }}' in org {{ zup_org_name }}:
      {{ 'CREATED' if (zup_create_run.stdout | default('{}') | from_json).created | default(false)
         else 'already existed (no change)' }}
      (user_id={{ (zup_create_run.stdout | default('{}') | from_json).user_id | default('') }}).
