---
# tasks/reset_target.yml — terraform_clean_slate (spec terraform-clean-slate-reset).
#
# Runs ONCE PER TARGET (looped from main.yml, loop_var `clean_slate_target`), only
# when clean_slate_enabled is true. Fail-safe ordering: pct destroy FIRST, then
# terraform state rm (so a pct failure never leaves state-rm'd-but-still-running
# orphan). Every guard fails CLOSED — no destroy runs unless all fields are present
# and the confirm token matches this target's vmid.

# --- Guard 1: all target fields present (Req 4) ------------------------------
- name: "Clean-slate | Assert target fields are all present (fail closed)"
  ansible.builtin.assert:
    that:
      - clean_slate_target.terraform_root is defined and (clean_slate_target.terraform_root | string | trim) | length > 0
      - clean_slate_target.resource_address is defined and (clean_slate_target.resource_address | string | trim) | length > 0
      - clean_slate_target.node is defined and (clean_slate_target.node | string | trim) | length > 0
      - clean_slate_target.vmid is defined and (clean_slate_target.vmid | string | trim) | length > 0
    fail_msg: >-
      Clean-slate target is incompletely specified — every entry needs
      terraform_root, resource_address, node, and vmid. Got:
      {{ clean_slate_target | default('<undefined>') }}. Refusing to destroy an
      under-identified guest.
    success_msg: "Target {{ clean_slate_target.name | default(clean_slate_target.vmid) }} fully specified."
    quiet: true

# --- Guard 2: mandatory confirm token matches THIS target (Req 2) ------------
- name: "Clean-slate | Assert the confirm token matches this target's vmid (fail closed)"
  ansible.builtin.assert:
    that:
      - (clean_slate_confirm | string | trim) | length > 0
      - (clean_slate_confirm | string | trim) == (clean_slate_target.vmid | string | trim)
    fail_msg: >-
      clean_slate_confirm ('{{ clean_slate_confirm | default("") }}') does not match
      target {{ clean_slate_target.name | default(clean_slate_target.vmid) }} (vmid
      {{ clean_slate_target.vmid }}). This is the MANDATORY anti-footgun guard: pass
      `-e clean_slate_confirm={{ clean_slate_target.vmid }}` to destroy THIS guest.
      Refusing to destroy.
    success_msg: "Confirm token matches vmid {{ clean_slate_target.vmid }} — destroy authorised."
    quiet: true

# --- Loud pre-flight: state exactly what will be destroyed (Req 5) -----------
- name: "Clean-slate | ANNOUNCE the destroy about to happen"
  ansible.builtin.debug:
    msg: >-
      DESTROYING guest '{{ clean_slate_target.name | default("?") }}' — vmid
      {{ clean_slate_target.vmid }} on node {{ clean_slate_target.node }}; then
      removing {{ clean_slate_target.resource_address }} from Terraform state in
      {{ clean_slate_target.terraform_root }}. This is IRREVERSIBLE (pct destroy).

# --- Step 1: pct destroy the guest FIRST (Req 3.1, 3.3) ----------------------
# Stop then destroy on the guest's node. Tolerate an already-absent guest (a re-run
# is idempotent) but FAIL on a genuine destroy error so the state rm below is gated.
- name: "Clean-slate | pct stop vmid {{ clean_slate_target.vmid }} (tolerate already-stopped)"
  ansible.builtin.command:
    cmd: "pct stop {{ clean_slate_target.vmid }}"
  register: clean_slate_stop
  changed_when: clean_slate_stop.rc == 0
  failed_when:
    - clean_slate_stop.rc != 0
    - "'does not exist' not in (clean_slate_stop.stderr | default(''))"
    - "'not running' not in (clean_slate_stop.stderr | default('') | lower)"

- name: "Clean-slate | pct destroy --purge vmid {{ clean_slate_target.vmid }} (tolerate already-absent)"
  # `--purge` removes the guest from all related configurations (backup jobs, HA,
  # replication) AND cleans its backing volumes on the storage — so a destroyed
  # guest's disks inside the LXC rootfs do NOT survive to a reused VMID/IP. Bare
  # `pct destroy` could leave orphaned volumes, making a subsequent `terraform
  # apply` provision on top of stale disks. Scoped to THIS target's vmid only
  # (the caller assembles the two SVC-07 VMIDs 1070/1071) — never a global prune.
  ansible.builtin.command:
    cmd: "pct destroy {{ clean_slate_target.vmid }} --purge"
  register: clean_slate_destroy
  changed_when: clean_slate_destroy.rc == 0
  failed_when:
    - clean_slate_destroy.rc != 0
    - "'does not exist' not in (clean_slate_destroy.stderr | default(''))"

# --- Step 2: terraform state rm on the control node (Req 3.1, 3.2, 5-props) ---
# Only reached when the destroy above did NOT hard-fail (a genuine pct-destroy error
# aborts the play before here, so state keeps reflecting reality — no orphan).
# Delegated to localhost: Terraform state lives on the control node, not the guest.
# `become: false` — the play runs `become: true` for `pct` on the Proxmox host, but a
# Terraform state op runs as the invoking user on the CONTROL NODE and needs no root;
# without this it inherits become and fails with `sudo: a password is required` on the
# control node (same reason primary_bootstrap.yml's GitLab-variable-delete task sets
# become: false). `state rm` of an already-absent entry is tolerated (idempotent).
#
# `terraform_root` is repo-RELATIVE; the delegated command runs on localhost from an
# undefined cwd, so a relative `chdir` fails ("Unable to change directory before
# execution"). Resolve it to an ABSOLUTE path against the repo root, which is two
# levels up from the playbook dir (repo/ansible/playbooks/clean-slate.yml). An
# operator-supplied absolute `terraform_root` is honoured as-is.
- name: "Clean-slate | Resolve the terraform_root to an absolute path (control node)"
  ansible.builtin.set_fact:
    clean_slate_tf_root_abs: >-
      {{ clean_slate_target.terraform_root
         if (clean_slate_target.terraform_root | regex_search('^/'))
         else (playbook_dir | dirname | dirname ~ '/' ~ clean_slate_target.terraform_root) }}

- name: "Clean-slate | terraform state rm {{ clean_slate_target.resource_address }} (control node)"
  ansible.builtin.command:
    cmd: "terraform state rm {{ clean_slate_target.resource_address }}"
    chdir: "{{ clean_slate_tf_root_abs }}"
  delegate_to: localhost
  become: false
  register: clean_slate_state_rm
  changed_when: "'Removed' in (clean_slate_state_rm.stdout | default(''))"
  # Guard every field with defaults: if the module fails to even START (e.g. a bad
  # chdir), the registered result has no `rc`/`stdout`/`stderr`, and a bare
  # `clean_slate_state_rm.rc` would raise "dict has no attribute 'rc'" instead of
  # failing cleanly. Tolerate an already-absent state entry (idempotent re-run).
  failed_when:
    - (clean_slate_state_rm.rc | default(1)) != 0
    - "'No matching objects' not in (clean_slate_state_rm.stdout | default(''))"
    - "'No matching objects' not in (clean_slate_state_rm.stderr | default(''))"
    - "'No matching objects' not in (clean_slate_state_rm.msg | default(''))"
