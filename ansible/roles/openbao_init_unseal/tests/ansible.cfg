# Ansible config for the `openbao_init_unseal` role's offline syntax-check /
# wiring smoke test (spec fix-openbao-sysctl-posix-collection, task 5 / C3).
#
# Sole purpose: put the repository's `ansible/roles/` directory on the role
# search path so `tests/test.yml` can resolve `- role: openbao_init_unseal` when
# run from this tests/ directory. `../..` from
# ansible/roles/openbao_init_unseal/tests/ is ansible/roles/. This keeps the
# smoke test self-contained (no need to pass ANSIBLE_ROLES_PATH on the command
# line) without touching any repo-wide Ansible configuration. Mirrors
# ansible/roles/common/tests/ansible.cfg.
[defaults]
roles_path = ../..
