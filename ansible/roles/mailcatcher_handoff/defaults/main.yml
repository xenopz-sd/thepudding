---
# defaults/main.yml — mailcatcher_handoff (Mail catcher installer — Phase 4: Handoff)
#
# Phase-4 health-gate knobs, consumed by the child play mailcatcher-health.yml
# (invoked via `ansible-playbook -i {{ mailcatcher_generated_inventory }}
# mailcatcher-health.yml`, integration-boundaries.md §4) and by the handoff banner.
# Cross-phase constants (mailcatcher_generated_inventory, mailcatcher_repo_root,
# cluster_env_file, mailcatcher_platform_domain) are play-level vars. NO secret here.

# The Mailpit container name on the guest (docker-compose-app names it
# <stack>-<service>-1). Kept in sync with mailcatcher_install/defaults.
mailcatcher_container_name: "mailcatcher-mailpit-1"
# The guest's own VLAN-20 IP and the two ports published on it. Kept in sync with
# mailcatcher_install/defaults.
mailcatcher_bind_ip: "10.0.20.21"
mailcatcher_smtp_port: 1025
mailcatcher_ui_port: 8025
mailcatcher_ui_user: "mailcatcher"
# Two-stage recreate-robust health gate retry budget: retries × delay seconds.
mailcatcher_health_retries: 24
mailcatcher_health_delay: 5
