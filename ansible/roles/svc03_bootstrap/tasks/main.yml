---
# tasks/main.yml — svc03_bootstrap (SVC-03 Garage installer — Phase 3: Bootstrap)
#
#   1. Read the cluster secrets (RPC secret, admin token) from OpenBao; generate
#      and store them the first time (R6). Re-runs REUSE them: a new RPC secret
#      would split the cluster.
#   2. common baseline child run (Docker CE + Compose + hardening) on the guests.
#   3. garage.yml configurator child run (config, Compose, join + layout, route),
#      with the secrets in the child ENVIRONMENT (never argv).
# Both runs are child ansible-playbook invocations (orchestrator/configurator
# seam, integration-boundaries.md §4). A non-zero child exit -> this phase's rescue.

# --- 1. Cluster secrets (OpenBao, delegated bao CLI on the primary, no_log) ------
# The token reaches `bao` as BAO_TOKEN through the task ENVIRONMENT and
# `docker exec -e BAO_TOKEN` (name only), so no secret value is ever on argv.
- name: "Bootstrap | Read the Garage cluster secrets from OpenBao (no_log)"
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'exec', '-e', 'BAO_ADDR=' ~ svc03_openbao_cli_bao_addr, '-e', 'BAO_TOKEN',
          svc03_openbao_primary_container_name, svc03_openbao_bao_bin, 'kv', 'get', '-format=json']
         + (['-tls-skip-verify'] if (svc03_openbao_tls_skip_verify | bool) else [])
         + [svc03_cluster_secret_path] }}
  delegate_to: "{{ svc03_openbao_cli_host }}"
  vars:
    # The orchestrator play is `connection: local`; the delegated call must use SSH.
    ansible_connection: ssh
    ansible_user: "{{ svc03_openbao_cli_user }}"
    ansible_python_interpreter: "{{ svc03_openbao_cli_python }}"
  environment:
    BAO_TOKEN: "{{ svc03_openbao_admin_token }}"
  register: svc03_secret_probe
  changed_when: false
  failed_when: false
  no_log: true

# A missing path is the only acceptable non-zero (first install). Anything else
# (sealed, 403, unreachable) stops the install: generating new secrets then would
# overwrite a cluster's real ones.
- name: "Bootstrap | Classify the OpenBao read (non-secret projection)"
  ansible.builtin.set_fact:
    svc03_secret_missing: >-
      {{ (svc03_secret_probe.rc | default(1)) != 0
         and ('No value found' in ((svc03_secret_probe.stderr | default(''))
                                    ~ (svc03_secret_probe.stdout | default('')))) }}
    svc03_secret_read_ok: "{{ (svc03_secret_probe.rc | default(1)) == 0 }}"

- name: "Bootstrap | Fail closed when OpenBao could not be read (R6)"
  ansible.builtin.assert:
    that:
      - (svc03_secret_read_ok | bool) or (svc03_secret_missing | bool)
    fail_msg: >-
      Reading {{ svc03_cluster_secret_path }} from OpenBao failed (rc
      {{ svc03_secret_probe.rc | default('n/a') }}). OpenBao must be up, unsealed and
      reachable on {{ svc03_openbao_cli_host }}, and the admin token must be valid.
      Re-run ansible/playbooks/svc-07-bootstrap.yml if needed. Nothing was changed.
    quiet: true

- name: "Bootstrap | Bind the stored secrets (no_log)"
  ansible.builtin.set_fact:
    svc03_rpc_secret: "{{ (svc03_secret_probe.stdout | from_json).data.data.rpc_secret | default('') }}"
    svc03_admin_token: "{{ (svc03_secret_probe.stdout | from_json).data.data.admin_token | default('') }}"
  when: svc03_secret_read_ok | bool
  no_log: true

- name: "Bootstrap | Generate the cluster secrets on first install (no_log)"
  ansible.builtin.set_fact:
    svc03_rpc_secret: "{{ lookup('ansible.builtin.password', '/dev/null length=64 chars=digits,abcdef') }}"
    svc03_admin_token: "{{ lookup('ansible.builtin.password', '/dev/null length=48 chars=ascii_letters,digits') }}"
  when: svc03_secret_missing | bool
  no_log: true

- name: "Bootstrap | Store the generated cluster secrets in OpenBao (no_log)"
  ansible.builtin.command:
    argv: >-
      {{ ['docker', 'exec', '-e', 'BAO_ADDR=' ~ svc03_openbao_cli_bao_addr, '-e', 'BAO_TOKEN',
          '-e', 'GARAGE_RPC_SECRET', '-e', 'GARAGE_ADMIN_TOKEN',
          svc03_openbao_primary_container_name, 'sh', '-c',
          svc03_openbao_bao_bin ~ ' kv put'
          ~ (' -tls-skip-verify' if (svc03_openbao_tls_skip_verify | bool) else '')
          ~ ' ' ~ svc03_cluster_secret_path
          ~ ' rpc_secret="$GARAGE_RPC_SECRET" admin_token="$GARAGE_ADMIN_TOKEN"'] }}
  delegate_to: "{{ svc03_openbao_cli_host }}"
  vars:
    # The orchestrator play is `connection: local`; the delegated call must use SSH.
    ansible_connection: ssh
    ansible_user: "{{ svc03_openbao_cli_user }}"
    ansible_python_interpreter: "{{ svc03_openbao_cli_python }}"
  environment:
    BAO_TOKEN: "{{ svc03_openbao_admin_token }}"
    GARAGE_RPC_SECRET: "{{ svc03_rpc_secret }}"
    GARAGE_ADMIN_TOKEN: "{{ svc03_admin_token }}"
  when: svc03_secret_missing | bool
  changed_when: true
  no_log: true

- name: "Bootstrap | Fail closed on a malformed stored secret (no_log)"
  ansible.builtin.assert:
    that:
      - svc03_rpc_secret is match('^[0-9a-f]{64}$')
      - (svc03_admin_token | length) >= 32
    fail_msg: >-
      The Garage cluster secrets at {{ svc03_cluster_secret_path }} are malformed
      (rpc_secret must be 64 lowercase hex chars, admin_token at least 32 chars).
      Fix or delete the OpenBao entry (deleting it on a running cluster requires a
      clean-slate, since the nodes keep the old secret). Values are not printed.
    quiet: true
  no_log: true

- name: "Bootstrap | INFO — cluster secret decision (by name only)"
  ansible.builtin.debug:
    msg: >-
      INFO garage cluster secrets: {{ 'GENERATED and stored at ' if (svc03_secret_missing | bool)
      else 'REUSED from ' }}{{ svc03_cluster_secret_path }} (fields rpc_secret, admin_token;
      values never printed).

# --- 2. Common baseline child run ----------------------------------------------
- name: "Bootstrap | common baseline (Docker + Compose) on the Garage guests"
  ansible.builtin.command:
    argv:
      - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible-playbook"
      - -i
      - "{{ svc03_generated_inventory }}"
      - ansible/playbooks/common.yml
  args:
    chdir: "{{ svc03_repo_root }}"
  register: svc03_common_run
  changed_when: "(svc03_common_run.stdout | default('')) is search('changed=[1-9]')"

# --- 3. Garage configurator child run --------------------------------------------
- name: "Bootstrap | Garage install + layout + route (garage.yml child run, no_log)"
  ansible.builtin.command:
    argv:
      - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible-playbook"
      - -i
      - "{{ svc03_generated_inventory }}"
      - ansible/playbooks/garage.yml
      - -e
      - "garage_platform_domain={{ svc03_platform_domain }}"
      - -e
      - "garage_data_disk_gb={{ svc03_data_disk_gb | default(20) }}"
      - -e
      - "garage_traefik_route_enabled={{ svc03_traefik_route_enabled | default(true) }}"
  args:
    chdir: "{{ svc03_repo_root }}"
  environment:
    GARAGE_RPC_SECRET: "{{ svc03_rpc_secret }}"
    GARAGE_ADMIN_TOKEN: "{{ svc03_admin_token }}"
  register: svc03_garage_run
  changed_when: "(svc03_garage_run.stdout | default('')) is search('changed=[1-9]')"
  failed_when: false
  no_log: true

# The child's own secret-bearing tasks are no_log, so its output carries no secret
# value; surfacing its tail keeps a failure diagnosable through the no_log above.
- name: "Bootstrap | Fail with the child run's output tail when garage.yml failed"
  ansible.builtin.fail:
    msg: >-
      garage.yml failed (rc {{ svc03_garage_run.rc }}). Last output:
      {{ (svc03_garage_run.stdout | default('')).splitlines()[-40:] | join(' | ') }}
  when: (svc03_garage_run.rc | default(1)) != 0

- name: "Bootstrap | Scrub the cluster secret facts from memory (no_log)"
  ansible.builtin.set_fact:
    svc03_rpc_secret: ""
    svc03_admin_token: ""
  no_log: true
  changed_when: false
