---
# defaults/main.yml — svc09_preflight (SVC-09 installer — Phase 1: Preflight)
#
# Phase-1 phase-specific defaults. Cross-phase constants (cluster_env_file,
# svc09_repo_root, svc09_venv_python, etc.) are play-level vars on
# svc-09-bootstrap.yml. NO secret value ever lives here. Clone of
# svc07_preflight/defaults adapted for the Traefik single-guest root.

# The pure-logic env helper (Phase 1 delegates parse/validate to it).
svc09_cluster_env_helper: scripts/installer/cluster_env.py

# Sentinel emitted by cluster_env.py for an unset optional datastore var —
# kept in sync with AUTODETECT in scripts/installer/cluster_env.py. A resolved
# datastore equal to this triggers node-storage auto-detect.
svc09_autodetect_sentinel: "__AUTODETECT__"

# Homelab Proxmox commonly presents a self-signed API cert; default to not
# validating so preflight reachability does not fail on cert trust. Override:
#   -e svc09_proxmox_validate_certs=true
# This single toggle governs BOTH the Phase-1 uri reachability tasks AND the
# bpg/proxmox provider's TLS verification (svc09_tf_env derives
# TF_VAR_proxmox_insecure = NOT validate_certs), so they cannot drift.
svc09_proxmox_validate_certs: false

# Ansible collections the installer's CONFIGURATOR child runs rely on. Preflight
# asserts each is installed so a missing collection fails fast, not mid-bootstrap.
svc09_required_collections:
  - community.docker
  - community.general
  - ansible.posix
  - community.crypto

# Project venv binaries the installer + its child runs invoke by absolute path.
svc09_required_venv_binaries:
  - "{{ ansible_env.HOME }}/venv/devinfra/bin/python"
  - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible-playbook"
  - "{{ ansible_env.HOME }}/venv/devinfra/bin/ansible-galaxy"
