---
# =============================================================================
# Developer Services Platform — OFFLINE test/lint gate
# Spec: .kiro/specs/ci-offline-test-pipeline/ (requirements.md / design.md /
# tasks.md). Steering: testing-strategy.md "When Tests Run" + "When a CI pipeline
# becomes relevant (threshold)" + "Offline gate — how CI runs it".
#
# WHAT THIS IS: the OFFLINE verification the repo already runs by hand before every
# merge, now automated as a blocking gate on every MR to `main` (and on `main`
# after merge). It runs:
#   - the FOUR pytest roots, each as a SEPARATE invocation (conftest/module
#     basename collision under pytest's prepend import mode — design §1/§3.2),
#   - yamllint, ansible --syntax-check, terraform fmt -check + validate.
#
# WHAT THIS IS NOT (hard out-of-scope — requirements.md §Scope, design §5):
#   - NO requires-infra / live tier. No terraform apply, no Proxmox API, no live
#     cluster, no secrets. `pytest.ini` deselects `-m "not requires_infra"` by
#     default, so the live tier is off BY CONSTRUCTION; no job opts in.
#   - NO deploy/release, NO Terraform STATE access (validate runs -backend=false).
#   The gate is credential-free, hence safe on untrusted MR branches.
# =============================================================================

stages:
  - test

# --- Pinned toolchain (design §3.1; FR-7, NFR-2/NFR-4) -----------------------
# Default runner, install-on-job against the CI cache (no custom image maintained
# yet — a prebuilt pinned image is the documented future optimisation). Versions
# pinned; no floating `latest`. The repo runs on Python 3.12.
variables:
  PYTHON_IMAGE: "python:3.12-bookworm"
  TERRAFORM_VERSION: "1.16.0"
  PIP_CACHE_DIR: "$CI_PROJECT_DIR/.cache/pip"
  # The CI build dir is WORLD-WRITABLE, so Ansible REFUSES to read the repo's
  # root `ansible.cfg` ("ignoring it as an ansible.cfg source") — which is the
  # only place `roles_path = ansible/roles` is set. Without it, every
  # `--syntax-check` / ansible-driven test fails with "role '<x>' was not found".
  # Pin the role search path (and the config path) explicitly via env so the
  # repo's intent survives the world-writable-dir refusal. Harmless for the
  # non-Ansible jobs. (CI-failure fix; see ci-offline-test-pipeline design §3.7.)
  ANSIBLE_ROLES_PATH: "$CI_PROJECT_DIR/ansible/roles"
  ANSIBLE_CONFIG: "$CI_PROJECT_DIR/ansible.cfg"
  # The two known-non-defect, BRANCH-CONTEXT meta-tests (design §3.3). They PASS
  # on an empty `main...HEAD` diff (i.e. on `main`), and FAIL BY CONSTRUCTION on
  # any non-documentation feature branch (the accessible-root-readme feature's own
  # scope guards). Deselected ONLY on MR/feature pipelines (see `pytest:infra`);
  # run with NO deselection on `main`. Defined once here so it cannot rot.
  INFRA_META_DESELECT: >-
    --deselect
    infra/tests/test_accessible_root_readme_links.py::test_git_diff_scope_guard
    --deselect
    infra/tests/test_offline_plan_preservation.py::TestPreExistingSuiteBaseline::test_no_pre_existing_test_fails

# Run on MRs targeting main, and on main after merge (FR-1). Nothing manual.
workflow:
  rules:
    - if: >-
        $CI_PIPELINE_SOURCE == "merge_request_event" &&
        $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
    - if: '$CI_COMMIT_BRANCH == "main"'

cache:
  key: "offline-gate-py312"
  paths:
    - .cache/pip

# --- Shared setup for the Python-based jobs ----------------------------------
# `.py-base` installs the repo's pinned Python toolchain into the job image and
# invokes tools via `python -m ...` from that interpreter — the CI analogue of
# the `~/venv/devinfra/bin/...` by-path rule in dev-workflow.md (no reliance on
# ambient shell activation).
.py-base:
  image: "$PYTHON_IMAGE"
  stage: test
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt

# =============================================================================
# FOUR SEPARATE pytest jobs — one invocation per test root (FR-2, FR-3).
# Each root ships a sys.path-injecting conftest.py; collected together their
# basenames collide, so they MUST NOT share an invocation (design §1).
# Offline by construction: pytest.ini's `addopts = -m "not requires_infra"`
# deselects the live tier; NO job passes `-m requires_infra`.
# =============================================================================

pytest:infra:
  extends: .py-base
  before_script:
    - python --version
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    # `requirements.txt` pulls ansible-core transitively (via ansible-lint), so
    # `ansible-playbook` is on PATH in this image. Several infra/tests gate on
    # that binary and then RUN (not skip) — e.g. the openbao_install check-mode
    # idempotency test drives the real role, which references
    # `community.docker.*`. Install the Galaxy collections so those ansible-gated
    # tests run GREEN here exactly as they do on a developer machine, instead of
    # failing half-configured (ansible present, collections absent). Mirrors the
    # syntax:ansible job. (CI-failure fix; see design §3.7.)
    - ansible-galaxy collection install -r ansible/requirements.yml
    # Install the PINNED Terraform binary so the `requires_terraform`-gated
    # infra/tests RUN (fmt/validate/plan-json) instead of SKIPPING. Without it
    # this image has no terraform, ~15 tests skip, and the
    # test_offline_plan_preservation baseline (pinned to 36 skips, calibrated
    # WITH terraform present) sees ~66 and fails. Installing terraform gives this
    # job the SAME full toolchain a developer machine has — true parity — so the
    # baseline realigns to 36. (CI-failure fix; see design §3.7.)
    - |
      set -eu
      tf_zip="terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
      curl -fsSL -o "/tmp/${tf_zip}" \
        "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/${tf_zip}"
      python -c "import zipfile; zipfile.ZipFile('/tmp/${tf_zip}').extractall('/usr/local/bin')"
      chmod +x /usr/local/bin/terraform
      terraform version
  script:
    # The two branch-context meta-tests are deselected ONLY on merge-request
    # pipelines; on the `main` (post-merge) pipeline the full suite runs — the
    # meta-tests pass there on the empty `main...HEAD` diff (design §3.3).
    #
    # Discriminate purely on CI_PIPELINE_SOURCE. In a merge_request_event
    # pipeline GitLab does NOT define CI_COMMIT_BRANCH (it sets the
    # CI_MERGE_REQUEST_* family instead), and the runner executes job scripts
    # under `set -u`, so a bare `$CI_COMMIT_BRANCH` reference aborts the job with
    # "unbound variable" before any test runs. Reference predefined vars with the
    # `${VAR:-}` default so an unset var is safe, and drop the redundant branch
    # check (source == merge_request_event is sufficient and correct).
    - |
      if [ "${CI_PIPELINE_SOURCE:-}" = "merge_request_event" ]; then
        echo "merge-request pipeline → deselecting the two known branch-context meta-tests (design §3.3)"
        python -m pytest infra/tests $INFRA_META_DESELECT
      else
        echo "non-MR (e.g. main) pipeline → full infra/tests (meta-tests pass on empty main...HEAD diff)"
        python -m pytest infra/tests
      fi

pytest:installer:
  extends: .py-base
  script:
    - python -m pytest tests/installer

pytest:inventory:
  extends: .py-base
  script:
    - python -m pytest ansible/inventory/tests

pytest:foundation:
  extends: .py-base
  script:
    - python -m pytest infra/platform-foundation/scripts/tests

# =============================================================================
# Lint / syntax / terraform jobs (FR-5). All blocking, all parallel.
# =============================================================================

lint:yaml:
  extends: .py-base
  script:
    # Repo .yamllint config (line-length 120). Scope = the Ansible roles +
    # playbooks (the YAML this project authors).
    - python -m yamllint ansible/roles ansible/playbooks

syntax:ansible:
  extends: .py-base
  script:
    # Playbook parse-only check. Needs the Galaxy collections the playbooks
    # reference (community.docker/general) so --syntax-check can resolve them.
    - python -m pip install ansible-core
    - ansible-galaxy collection install -r ansible/requirements.yml
    - |
      rc=0
      for pb in ansible/playbooks/*.yml; do
        echo "--- syntax-check $pb ---"
        ansible-playbook --syntax-check "$pb" || rc=1
      done
      exit $rc

terraform:fmt-validate:
  image:
    name: "hashicorp/terraform:$TERRAFORM_VERSION"
    entrypoint: [""]
  stage: test
  script:
    # fmt gate across all of infra/ (design §3.2).
    - terraform fmt -check -recursive infra/
    # validate each root OFFLINE: `init -backend=false` (NEVER touches state —
    # FR-3) then `validate`. Covers the 4 service roots + _TEMPLATE +
    # platform-foundation.
    - |
      rc=0
      for root in \
        infra/platform-foundation \
        infra/projects/_TEMPLATE \
        infra/projects/svc-01-sql-database \
        infra/projects/svc-06-identity-provider \
        infra/projects/svc-07-secrets-manager \
        infra/projects/svc-09-reverse-proxy; do
        echo "--- terraform validate $root ---"
        ( cd "$root" \
          && terraform init -backend=false -input=false -no-color \
          && terraform validate -no-color ) || rc=1
      done
      exit $rc
